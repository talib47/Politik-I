ESSAYS.push(
 {id:"v1-e5", ch:1, kind:"lang", short:"Demokratiemodelle",
  q:"Stellen Sie die drei Demokratiemodelle nach Merkel dar und diskutieren Sie, ob die Leistungen eines politischen Systems (Output) Teil der Demokratiedefinition sein sollten.",
  op:"„Darstellen“: die drei Modelle mit Kernmerkmal und Vertretern beschreiben. „Diskutieren“: Argumente für und gegen ein Output-Kriterium abwägen und Stellung beziehen.",
  gl:["<b>Einleitung:</b> Demokratiedefinitionen sind „Legion“. Frage: Wie viel gehört dazu, und gehört auch der Output dazu?",
   "<b>Minimalistisch:</b> Schumpeter, Wahlen als Markt, vertikale Verantwortlichkeit, elitistisch.",
   "<b>Mittel, prozedural:</b> plus Rechtsstaat, Gewaltenkontrolle, Partizipation. Beispiel Embedded Democracy.",
   "<b>Maximalistisch:</b> plus Output, vor allem faire Verteilung (Meyer, Heller).",
   "<b>Pro Output:</b> politische Gleichheit braucht soziale Grundlagen, wachsende Ungleichheit, Output-Legitimität sichert Stabilität.",
   "<b>Contra Output:</b> nicht demokratiespezifisch (China, Singapur, Kuba), Definition würde unscharf und normativ überladen.",
   "<b>Fazit:</b> Output nicht in die Definition, aber als zentrale Bedingung für Stabilität und Qualität berücksichtigen."],
  k:["Alle drei Modelle mit Kernmerkmal genannt",
   "Mindestens ein Vertreter pro Modell (z. B. Schumpeter, Habermas oder Merkel, Meyer oder Heller)",
   "Embedded Democracy als Beispiel des mittleren Modells eingeordnet",
   "Argument für ein Output-Kriterium (soziale Grundlagen politischer Gleichheit, Ungleichheit)",
   "Argument dagegen: Leistungen auch in Autokratien möglich, mit Beispiel",
   "Output-Legitimität und Stabilität angesprochen",
   "Begründete eigene Position im Fazit"],
  m:["Was eine Demokratie ausmacht, ist in der Politikwissenschaft umstritten. Merkel (2013) ordnet die zahllosen Definitionen in drei Gruppen: minimalistische, mittlere und maximalistische Modelle. Die Modelle unterscheiden sich vor allem darin, wie viel sie in die Demokratie hineinnehmen. Im Folgenden werden sie dargestellt, bevor diskutiert wird, ob auch die Leistungen eines Systems zur Definition gehören sollten.",
   "Das minimalistische Modell geht auf Joseph Schumpeter (1942) zurück. Für ihn sind freie, gleiche und geheime Wahlen nicht nur der Kern der Demokratie, sondern die Demokratie selbst. Ähnlich wie auf einem Markt bieten Parteien Programme an, die Wähler wählen aus und können die Regierenden bei der nächsten Wahl abstrafen. Demokratie wird damit auf die vertikale Verantwortlichkeit zwischen Regierten und Regierenden beschränkt, weshalb man auch von einem elitistischen Modell spricht.",
   "Vertreter eines mittleren, prozeduralen Modells halten das für zu dünn. Sie ergänzen die Wahlen um den Rechtsstaat, die horizontale Gewaltenkontrolle und weitere Beteiligungsformen wie Referenden oder eine lebendige Zivilgesellschaft. Erst die Einbettung der Wahlen in Grund- und Bürgerrechte und die gegenseitige Kontrolle der Gewalten mache sie wirksam. Merkels Konzept der Embedded Democracy ist ein solches Modell. In Europa dominieren diese Ansätze.",
   "Maximalisten wie Hermann Heller oder heute Thomas Meyer gehen weiter: Für sie gehört auch der Output zur Demokratie, also Sicherheit, Wohlstand, sozialstaatliche Garantien und vor allem eine faire Verteilung. Erst die soziale Demokratie sichere die politische Gleichheit.",
   "Für ein Output-Kriterium spricht, dass formale Gleichheit wenig wert ist, wenn extreme soziale Ungleichheit die tatsächlichen Beteiligungschancen verzerrt. Merkel weist darauf hin, dass die seit Jahrzehnten wachsende Ungleichheit in den OECD-Staaten die Verteilungsfrage wieder näher an die Demokratietheorie gerückt hat. Zudem hängt die Stabilität einer Demokratie von ihrer Output-Legitimität ab: Liefert sie nicht, was die Bürger erwarten, gerät sie in die Krise.",
   "Gegen ein Output-Kriterium spricht jedoch, dass solche Leistungen nicht demokratiespezifisch sind. Auch Autokratien erzielen hohes Wirtschaftswachstum wie China, Wohlstand wie Singapur oder soziale Gleichheit wie Kuba. Nähme man den Output in die Definition auf, würde die Grenze zur Autokratie unscharf, und die Definition würde mit politischen Zielen überladen, über die in einer Demokratie gerade gestritten werden soll.",
   "Überzeugender ist deshalb, mit Merkel den Output nicht in die Definition der Demokratie aufzunehmen, ihn aber als zentrale Bedingung für ihre Stabilität und Qualität ernst zu nehmen. Die Definition bleibt so trennscharf, und trotzdem gerät nicht aus dem Blick, dass eine Demokratie, die dauerhaft keine Probleme löst, ihre eigene Grundlage untergräbt."]},
 {id:"v1-e6", ch:1, kind:"lang", short:"Warum Autokratien überleben",
  q:"Erläutern Sie, wie sich autoritäre und totalitäre Regime unterscheiden, und erklären Sie mithilfe des Drei-Säulen-Modells, wodurch autokratische Herrschaft stabil bleibt oder zerbricht.",
  op:"„Erläutern“: Unterschiede mit Kriterien und Beispielen darstellen. „Erklären“: das Modell anwenden und Ursachen für Stabilität und Krise benennen.",
  gl:["<b>Einleitung:</b> Autokratie nach Kelsen (heteronome Normen), Frage nach Formen und Stabilität.",
   "<b>Autoritär vs. totalitär:</b> Linz' drei Merkmale, Arendt-Zitat, Beispiele.",
   "<b>Heutige Formen:</b> elektoraler Autoritarismus, Geddes' Typen und ihre Lebensdauer.",
   "<b>Drei Säulen:</b> Legitimation, Repression, Kooptation, jeweils erklären.",
   "<b>Zusammenspiel und Krise:</b> Säulen gleichen sich aus oder überlasten sich, critical juncture.",
   "<b>Fazit:</b> Stabilität beruht auf der Balance aller drei Säulen, Repression allein reicht nicht."],
  k:["Autokratie definiert (z. B. Kelsen oder Gesetzgeber nicht an Gesetze gebunden)",
   "Linz' Unterscheidung mit den drei Merkmalen Pluralismus, Legitimation, Mobilisierung",
   "Mindestens ein heutiger Typ oder Befund (elektoraler Autoritarismus oder Geddes)",
   "Legitimation als Säule mit ideologischer und leistungsbezogener Quelle",
   "Repression als Säule, weich und hart, mit Grenze (sinkende Legitimation)",
   "Kooptation als Säule (Eliten durch Ämter, Privilegien, Geld binden)",
   "Zusammenspiel der Säulen und critical juncture erklärt",
   "Fazit beantwortet die Frage"],
  m:["Autokratien unterscheiden sich von Demokratien grundsätzlich dadurch, dass die Herrschenden nicht an die Gesetze gebunden sind, die sie für andere machen. Kelsen spricht von heteronomen Normen: Normautoren und Normadressaten fallen auseinander. Doch Autokratien sind sehr verschieden, und manche halten sich über Jahrzehnte. Dieses Essay erläutert zunächst, wie sich autoritäre und totalitäre Regime unterscheiden, und erklärt dann mit dem Drei-Säulen-Modell, was ihre Stabilität ausmacht.",
   "Juan Linz unterscheidet die beiden Subtypen anhand von drei Merkmalen. Autoritäre Regime lassen einen begrenzten Pluralismus zu, legitimieren sich über Mentalitäten wie Nationalismus oder Sicherheit und halten die Bevölkerung eher ruhig. Totalitäre Regime ersetzen den Pluralismus durch Monismus, stützen sich auf eine umfassende Weltanschauung und mobilisieren die Bevölkerung dauerhaft. Hannah Arendt hat den Unterschied zugespitzt: Autoritäre Herrschaft schränkt die Freiheit ein, totalitäre schafft sie ab. Heute gilt fast nur noch Nordkorea als totalitär. Häufiger ist der elektorale Autoritarismus, bei dem manipulierte Wahlen einen demokratischen Anstrich liefern.",
   "Warum überleben solche Regime? Das am Wissenschaftszentrum Berlin entwickelte Drei-Säulen-Modell nennt Legitimation, Repression und Kooptation. Legitimation speist sich aus einer ideologischen Quelle und aus der Leistungsbilanz, ähnlich wie bei Eastons diffuser und spezifischer Unterstützung. Weil Heilsversprechen und Wirklichkeit in Diktaturen auseinanderklaffen, sind sie besonders auf wirtschaftliche Erfolge und Ordnung angewiesen.",
   "Repression kann weich sein, etwa durch Einschränkung der Presse- und Versammlungsfreiheit, oder hart, wenn sie Leib und Leben betrifft. Sie allein kann ein Regime aber nicht dauerhaft tragen, denn steigende Repression senkt die Legitimation. Die dritte Säule, Kooptation, bindet wichtige Gruppen wie Militär, Sicherheitsapparat und Wirtschaftseliten über Ämter, Privilegien und Geld an das Regime. Rohstoffreiche Staaten haben dafür besonders viele Mittel.",
   "Entscheidend ist das Zusammenspiel. Bricht eine Säule, etwa die Legitimation in einer Wirtschaftskrise, können die anderen das eine Zeit lang ausgleichen, zum Beispiel durch mehr Repression oder mehr Geld für die Eliten. Sie können dabei aber überlastet werden. Dann entsteht eine critical juncture, in der oppositionelle Kräfte eine Chance sehen, das Regime herauszufordern. Auch der Herrschaftsträger spielt eine Rolle: Nach Geddes halten Einparteienregime im Schnitt am längsten, weil sie Konflikte in Verfahren lösen, während Militärregime an internen Streitigkeiten und personalistische Regime an der Nachfolgefrage scheitern.",
   "Autokratische Stabilität beruht also nicht allein auf Gewalt, sondern auf einer Balance aus Legitimation, Repression und Kooptation. Wo diese Balance kippt, werden auch lange stabile Regime verwundbar."]},
 {id:"v1-e7", ch:1, kind:"kurz", short:"Regierung, Regime, Staat",
  q:"Unterscheiden Sie die Begriffe Regierung, Regime, Staat und politisches System.",
  op:"„Unterscheiden“: jeden Begriff bestimmen und die Unterschiede an einem Beispiel zeigen. Etwa 15 Minuten.",
  gl:["<b>Regierung:</b> engster Begriff, Regierungschef und Kabinett, auf Zeit.",
   "<b>Regime:</b> Regeln des Zugangs zur Macht und der Beziehung zu den Beherrschten, unterscheidet Demokratie und Autokratie.",
   "<b>Staat:</b> dauerhafte Herrschaftsstruktur, Jellinek, überdauert Regimewechsel.",
   "<b>Politisches System:</b> umfassendster Begriff, Funktionen und Strukturen, Input und Output.",
   "<b>Beispiel:</b> Spanien nach Franco."],
  k:["Regierung als engster Begriff (Regierungschef und Kabinett, auf Zeit)",
   "Regime als Regeln des Machtzugangs und der Beziehung Herrschende und Beherrschte",
   "Staat mit Drei-Elemente-Lehre (Gebiet, Volk, Gewalt)",
   "Staat überdauert Regimewechsel",
   "Politisches System als umfassendster Begriff",
   "Ein passendes Beispiel"],
  m:["Die Regierung ist der engste der vier Begriffe. Sie besteht aus dem Regierungschef und dem Kabinett und lenkt die politischen Entscheidungen. In Demokratien ist sie auf Zeit gewählt und kann abgewählt werden.",
   "Das Regime bezeichnet nach Merkel die formelle und informelle Organisation der Herrschaft: wie man Zugang zu den Herrschaftspositionen erhält und wie Herrschende und Beherrschte zueinander stehen. Die Regeln des Regimes unterscheiden Demokratien von Autokratien. Regime sind dauerhafter als Regierungen.",
   "Der Staat ist eine noch dauerhaftere Herrschaftsstruktur, die die nötigen Zwangsmittel einschließt. Nach Jellineks Drei-Elemente-Lehre besteht er aus Staatsgebiet, Staatsvolk und Staatsgewalt. Bei einem Regimewechsel ändern sich diese nicht, sondern nur die Regeln der Herrschaft. So blieben in Spanien nach dem Ende der Franco-Diktatur Staat und Verwaltung weitgehend bestehen, während das Regime zur Demokratie wurde.",
   "Das politische System schließlich ist der umfassendste Begriff. Es deckt Funktionen und Strukturen von Regierung und Staat ab und verbindet die politische Ordnung über Inputs und Outputs mit ihrer Umwelt."]},
 {id:"v1-e8", ch:1, kind:"kurz", short:"Wissenschaft und Alltagswissen",
  q:"Was ist Wissenschaft nach Patzelt, und warum braucht die Politik mehr als den „gesunden Menschenverstand“?",
  op:"„Erklären“: Definition wiedergeben und an den Schwächen des Alltagsdenkens begründen. Etwa 15 Minuten. (Kontrollfrage aus Patzelt, Kap. 1)",
  gl:["<b>Definition:</b> Aussagen, die dem gesunden Menschenverstand an empirischem und logischem Wahrheitsgehalt überlegen sind.",
   "<b>Drei Schwächen des Alltagsdenkens:</b> selektiv, perspektivisch, selbstverständlich, jeweils mit Gegenmittel.",
   "<b>Anforderungen:</b> empirisch und logisch wahr, empirische und normative Aussagen unterscheiden.",
   "<b>Schluss:</b> kritische, aufklärende Aufgabe der Politikwissenschaft."],
  k:["Definition von Wissenschaft (empirischer und logischer Wahrheitsgehalt über dem gesunden Menschenverstand)",
   "Alltagsdenken unreflektiert selektiv",
   "Alltagsdenken unreflektiert perspektivisch",
   "Alltagsdenken selbstverständlich",
   "Empirische und logische Wahrheit unterschieden",
   "Aufklärende Aufgabe der Politikwissenschaft genannt"],
  m:["Patzelt versteht Wissenschaft als menschliches Handeln, das Aussagen herstellen will, die an empirischem und logischem Wahrheitsgehalt dem überlegen sind, was der gesunde Menschenverstand formulieren kann. Wissenschaft ist also eine Emanzipation aus dem Alltagsdenken und wird erst dort gebraucht, wo dieses nicht mehr ausreicht.",
   "Das Alltagsdenken hat nach Patzelt drei Schwächen. Es ist unreflektiert selektiv: Niemand nimmt alles wahr, und das meiste vergisst man wieder. Es ist unreflektiert perspektivisch, weil jeder von seinem eigenen Standort aus urteilt. Und es ist selbstverständlich: Was nicht ins eigene Weltbild passt, wird eher angezweifelt als das Weltbild selbst. Die Politikwissenschaft setzt dem eine bewusste Fallauswahl, klar definierte Begriffe und Theorien sowie Methodenlehre entgegen.",
   "Wissenschaftliche Aussagen sollen empirisch wahr sein, also mit der Wirklichkeit übereinstimmen, und logisch wahr, also frei von Denkfehlern. Gerade in der Politik, wo Ideologien oft mit überzeugend wirkenden Argumenten auf falschen Prämissen arbeiten, ist diese doppelte Prüfung wichtig. Darin liegt die aufklärende Aufgabe der Politikwissenschaft: Alltagswissen und politische Theorien auf Vorurteile und Fehler zu prüfen und bessere Aussagen anzubieten."]}
);

{id:"se1-1", t:"Worum es in der Regierungsforschung geht", html:`
<p>Das Seminar startet mit Korte und Fröhlich (2009). Ihr Lehrbuch fragt nicht, wie das Grundgesetz aufgebaut ist, sondern <b>wie in Deutschland regiert wird</b>.</p>
<div class="quote">Wer regiert wie in Berlin? Wie nehmen die Wähler Einfluss auf die politische Führung? Wie steuert man Reformen?<cite>Leitfragen bei Korte/Fröhlich 2009, S. 9</cite></div>
<p>Um das zu beantworten, braucht man Kenntnisse im <b>Politikmanagement</b>. Der Begriff verbindet zwei Seiten:</p>
<div class="merk"><b>Politikmanagement</b><div class="mrows">
<div><span class="ml">Steuerbarkeit des Systems</span><span>Lässt sich das politische System überhaupt lenken?</span></div>
<div><span class="ml">Steuerungsfähigkeit der Akteure</span><span>Können die wichtigen Akteure es lenken?</span></div></div></div>
<p>Dabei sind <b>Sach- und Machtfragen</b> immer verwoben. „Management“ meint nicht Betriebswirtschaft: Das Wort kommt von lateinisch <i>manus</i> (Hand) und <i>agere</i> (handeln), also richtunggebendes Handeln in komplexen Strukturen.</p>
<h3>Regieren ist mehr als Gesetze machen</h3>
<p>Regieren ist weder bloße Gesetzesinitiative noch Anpassung an Stimmungen noch „Sich-Durchwursteln“. Im Regierungsalltag finden sich <b>Routine, spontane Improvisation und grundlegende Strategie</b> nebeneinander.</p>
<h3>Was das Buch anders macht</h3>
<ul><li><b>Keine Verfassungskunde</b>, sondern eine Darstellung der <b>Funktionsweise des Regierens</b>.</li>
<li>Formale Institutionenkunde wird ergänzt um <b>informelle Entscheidungsprozesse, politische Kommunikation, personalisierte Regierungsstile und Strategien</b>.</li>
<li>Die <b>Exekutive</b> steht im Mittelpunkt. Kernthese: Der politische Prozess wird zunehmend <b>exekutivlastig</b>.</li>
<li>Steuerung von Politikinhalten soll mit politischen Machtprozessen verbunden werden (nach Renate Mayntz).</li>
<li>Beispiele stammen vor allem aus den Regierungszeiten von Kohl, Schröder und Merkel.</li></ul>
<p class="small muted">Für deinen GL-Unterricht: Auch eine Schulleitung „regiert“ so. Es gibt Routine (Stundenplan), Improvisation (Vertretung bei Krankheit) und Strategie (Schulprogramm). Formale Regeln allein erklären nicht, wie Entscheidungen wirklich fallen.</p>`,

{id:"se1-2", t:"Deutschland als parlamentarische Demokratie", html:`
<p>Das politische System Deutschlands ist laut Korte/Fröhlich einmalig, lässt sich formal aber einem häufigen Typ zuordnen: ein <b>repräsentatives, freiheitliches und parlamentarisches Regierungssystem</b>.</p>
<h3>Warum „parlamentarisch“?</h3>
<ul><li>Nur der <b>Bundeskanzler</b> ist unmittelbar parlamentarisch verantwortlich und legitimiert.</li>
<li>Er wird von der <b>Mehrheit des Bundestages gewählt</b> und kann durch das <b>konstruktive Misstrauensvotum</b> abberufen werden.</li>
<li>Diese <b>Abberufbarkeit</b> der Regierung durch das Parlament macht das System zur parlamentarischen Demokratie, im Gegensatz zum präsidentiellen System (<b>Steffani 1979</b>).</li></ul>
<h3>Artikel 20 GG: Verfassung in Kurzform</h3>
<p>Art. 20 enthält die tragenden <b>Strukturprinzipien</b>:</p>
<table class="kvq"><tr><td><b>Demokratie</b></td><td>Alle Staatsgewalt geht vom Volke aus, ausgeübt in Wahlen und Abstimmungen und durch besondere Organe.</td></tr>
<tr><td><b>Bundesstaat</b></td><td>„demokratischer und sozialer Bundesstaat“</td></tr>
<tr><td><b>Rechtsstaat</b></td><td>Gesetzgebung an die verfassungsmäßige Ordnung, Verwaltung und Gerichte an Gesetz und Recht gebunden</td></tr>
<tr><td><b>Sozialstaat</b></td><td>ebenfalls in Abs. 1</td></tr></table>
<p class="small muted">Abs. 4 (Widerstandsrecht) wurde 1968 eingefügt.</p>
<h3>Freiheitliche demokratische Grundordnung</h3>
<p>Das Bundesverfassungsgericht hat sie im <b>SRP-Verbotsurteil (1952)</b> präzisiert. Dazu gehören mindestens:</p>
<ul><li>Achtung der Menschenrechte, vor allem Leben und freie Entfaltung</li><li>Volkssouveränität und Gewaltenteilung</li><li>Verantwortlichkeit der Regierung, Gesetzmäßigkeit der Verwaltung</li><li>Unabhängigkeit der Gerichte</li><li>Mehrparteienprinzip und Chancengleichheit der Parteien, Recht auf Opposition</li></ul>
<h3>Qualität statt Liste</h3>
<p>Solche Listen nennen Bestandteile, sagen aber nichts über die <b>Qualität</b> einer Demokratie. Dafür greifen Korte/Fröhlich auf <b>Dahl (1971)</b> zurück: offener <b>Wettbewerb</b> um Ämter und Macht und Raum für <b>Partizipation</b> aller. Die Qualität hängt auch von der Qualität des Regierens ab: <b>Good Governance</b> verbindet effektive Steuerung mit der Stabilität des Systems.</p>
<h3>Mehrheit und Legitimationskette</h3>
<ul><li>Entschieden wird meist nach dem <b>Mehrheitsprinzip</b>, ergänzt durch <b>Minderheitenschutz</b>. Beides ist konstitutiv für die repräsentative Demokratie.</li>
<li>Abgeordnete sind <b>nicht an Aufträge und Weisungen gebunden</b> und stellen sich alle vier Jahre zur Wahl.</li>
<li>Kanzler und Ministerpräsidenten verdanken ihr Amt einer <b>Wahl durch das Parlament</b>, die Abgeordneten einer freien Wahl. So entsteht eine <b>lückenlose Legitimationskette</b> vom Volk bis zur Entscheidung.</li></ul>
<div class="litbox"><b>Empfehlung: Croissant (2010)</b>Steffanis Kriterium im Detail und weitere Typologien von Regierungssystemen findest du in der Lektion „Regierungssysteme typisieren“.</div>`,

{id:"se1-3", t:"Grundbegriffe I: Darstellung, Entscheidung, Governance, Politik", html:`
<p>Korte/Fröhlich definieren vorab einige Begriffe, die im ganzen Seminar wiederkommen.</p>
<h3>Darstellungspolitik und Entscheidungspolitik</h3>
<table class="kvq"><tr><th></th><th>Darstellungspolitik</th><th>Entscheidungspolitik</th></tr>
<tr><td>Was</td><td>medienvermittelte, symbolische, öffentlich inszenierte Politik</td><td>Verfahren der Politik, konkreter Gesetzgebungsprozess</td></tr>
<tr><td>Regeln</td><td>Wettbewerbsregeln der medialen Öffentlichkeit</td><td>weitgehend unabhängig von Medienaufmerksamkeit, meist Routine-Gesetzgebung</td></tr></table>
<p class="small muted">Die Unterscheidung geht auf Ulrich Sarcinelli zurück.</p>
<h3>Governance</h3>
<p>Governance meint nicht nur die Tätigkeit des Regierens, sondern auch <b>die Art und Weise</b>, wie gesteuert und koordiniert wird. Ziel ist das <b>Management von Interdependenzen</b> zwischen staatlichen und nichtstaatlichen Akteuren (Benz). Es ist ein <b>strukturorientiertes</b> Konzept: Wie koordinieren sich öffentliche und private Akteure bei der Herstellung öffentlicher Güter?</p>
<div class="merk"><b>Vier Formen von Governance</b>Hierarchie · Netzwerk · Verhandlung · Wettbewerb</div>
<h3>Politik: drei Dimensionen</h3>
<p>Auch Korte/Fröhlich nutzen die Dreiteilung, mit einer Tabelle nach Lauth/Wagner (2006):</p>
<table class="kvq"><tr><th></th><th>Polity</th><th>Politics</th><th>Policy</th></tr>
<tr><td>Interesse</td><td>Rahmenbedingungen</td><td>Ausgestaltung der Prozesse</td><td>Inhalte</td></tr>
<tr><td>Ausrichtung</td><td>institutionenorientiert</td><td>inputorientiert</td><td>outputorientiert</td></tr>
<tr><td>Erscheinung</td><td>Verfassungen, Gesetze, Normen, formale und informale Spielregeln</td><td>Einstellungen, Interessen, Konflikte, Entscheidungsfindung</td><td>Ziele, Aufgaben, Tun und Lassen von Regierungen, Steuerung</td></tr>
<tr><td>Gegenstände</td><td>Verfassungsrecht, Regimetypen, Regierungssysteme, Institutionen</td><td>Parteien, Verbände, Wahlen, politische Kultur</td><td>Politikfelder, Staatstätigkeit</td></tr></table>
<p>Neu gegenüber der Vorlesung: Politics ist <b>inputorientiert</b>, Policy <b>outputorientiert</b>. Das verbindet die Dreiteilung mit Eastons Systemmodell.</p>`,

{id:"se1-4", t:"Grundbegriffe II: Macht, System, Regieren", html:`
<h3>Politische Macht</h3>
<ul><li>Macht ist <b>kein Attribut einzelner Akteure</b>. Wer Macht ausüben will, ist auf andere angewiesen.</li>
<li>Sie ist <b>nicht statisch</b> und folgt nicht einfach aus Positionen wie Parteivorsitz oder Kanzleramt. Positionen schaffen nur eine formale Über- und Unterordnung.</li>
<li>Wer ein Amt hat, muss sich als <b>„Machtjongleur“</b> täglich Macht durch Führung und Einflusssicherung erarbeiten.</li>
<li>Einfluss wird vor allem <b>durch Kommunikation</b> gesichert: Kontaktstellen haben, Netzwerke pflegen.</li>
<li>Macht ist durch Wahlen <b>zeitlich begrenzt</b>. Darum gilt: <b>Kommunikative Macht ist zugleich politische Macht.</b></li></ul>
<table class="kvq"><tr><th colspan="2">Bezugsgrößen von Macht (Pfetsch 2006)</th></tr>
<tr><td><b>Besitzgröße</b></td><td>Grundlage sind Potenziale</td></tr>
<tr><td><b>Beziehungsgröße</b></td><td>Grundlage sind sozialpsychologische Beziehungen</td></tr>
<tr><td><b>Relationale Größe</b></td><td>Grundlage ist ein Vergleich relativer Positionen</td></tr></table>
<h3>Politisches System: eng oder weit</h3>
<p>In Lehrveranstaltungen werden „Regierungssystem“, „politisches System“ und „Innenpolitik“ oft gleich verwendet. Nach Murswieck (1989) lässt sich unterscheiden:</p>
<div class="merk"><b>Eng oder weit?</b><div class="mrows">
<div><span class="ml">Eng (government)</span><span>Verfassungsorgane: Parlament, Regierung, nachgeordnet Rechtsprechung. Formal, ohne ökonomische, soziale und kommunikative Bedingungen.</span></div>
<div><span class="ml">Weit</span><span>auch ökonomische, soziale und gesellschaftliche Konstellationen, dazu Verbände, Parteien und andere Organisationen, die auf Politik einwirken.</span></div></div></div>
<h3>Regieren und Regierung</h3>
<table class="kvq">
<tr><td><b>Regieren</b></td><td>Herbeiführung und Durchsetzung gesellschaftlich verbindlicher Entscheidungen. Mischung aus Koordination und Steuerung, Leitung und Entscheidung, Durchsetzung.</td></tr>
<tr><td><b>Regierung</b></td><td>im parlamentarischen System gleich Exekutive: Regierungschef und Kabinett</td></tr>
<tr><td><b>Regierungshandeln</b></td><td>das Tun und Lassen der Regierung</td></tr>
<tr><td><b>Regierungssteuerung</b></td><td>strategisches Regierungshandeln, um materielle Politikziele zu erreichen</td></tr>
<tr><td><b>Strategie</b></td><td>Strategiefähigkeit beruht auf Orientierungswissen für offene Problemsituationen</td></tr></table>
<p class="small muted">Vergleich Vorlesung: Dort hieß das enge Verständnis ZPES (Patzelt). Gleiche Idee, anderer Name.</p>`,

{id:"se1-5", t:"Vier Zugänge: Struktur und Prozess", html:`
<p>Nach Schuppert (2003) haben sich vier systematische Zugänge zur Analyse des politischen Systems herausgebildet:</p>
${FIG_ZUGAENGE}
<h3>1. Struktur: ordnungspolitische und institutionelle Ansätze (polity)</h3>
<ul><li>In den <b>1960er Jahren</b> wollten <b>Hennis</b>, Guilleaume und Ellwein der Regierungslehre (bis dahin Verfassungs- und Demokratielehre) neuen Schwung geben: mehr Blick auf das <b>Regierungshandeln</b>.</li>
<li>Hennis fragte: <b>Welche Aufgaben muss der Leistungsstaat zwingend erfüllen?</b> Er kritisierte die einseitige Ausrichtung des Fachs auf Willensbildung und Partizipation.</li>
<li><b>Schwächen:</b> keine vollständige Operationalisierung, unsichere Quellen, Ablehnung empirischer Methoden. Das Handeln der Akteure blieb weitgehend ausgeblendet, ebenso die ökonomischen und sozialen Voraussetzungen.</li></ul>
<h3>2. Prozess: Politikmanagement und Governance (politics)</h3>
<p><b>Ende der 1960er</b> stieg der Planungsbedarf. Aus der Praxis kam der Anstoß für Regierungs- und Verwaltungsstudien (Mayntz/Scharpf 1973). Angelsächsische Theorien und empirische Methoden setzten sich durch.</p>
<ul><li><b>Systemtheorie</b> (Anfang 1970er): Das Zusammenwirken der Strukturen heißt nun politisches System. Leitfragen: Auf welche Einflüsse reagiert das Entscheidungszentrum? Welche Interessen greift es auf? Welche Rückwirkungen haben Entscheidungen? <i>Kritik:</i> bleibt bei der Auflistung von Faktoren, fragt nicht nach dem Sinn.</li>
<li><b>Seit den 1980ern:</b> technische Dimension des Regierens (Organisation, Instrumente, Personal), <b>formelle und informelle</b> Komponenten, politisches System als Kommunikationsraum.</li>
<li>Neue Schubkraft durch <b>Governance</b>, Verhandlungsdemokratie, Neo-Institutionalismus und Politikmanagement. Gemeinsames Thema: Steuerung unter <b>Souveränitätsverlusten</b> und wachsender <b>Informalität</b>.</li></ul>
<div class="merk"><b>Zwei Souveränitätsverluste</b><div class="mrows">
<div><span class="ml">Innere</span><span>immer mehr Mitspieler. Lehmbruch: Deutschland hat einen <b>Mischcharakter</b> aus konkurrenzdemokratischen (Parteienwettbewerb) und konkordanzdemokratischen (Aushandeln im Bundesstaat) Mechanismen. Steuerung braucht weichere Techniken: verhandeln, moderieren, koordinieren.</span></div>
<div><span class="ml">Äußere</span><span>durch europäische Integration und Globalisierung. Steuerung ist auf Kooperation in Netzwerken und Verhandlungssystemen angewiesen.</span></div></div></div>
<p>Aktuell im Zentrum der Regierungsforschung: <b>politische Führung</b> (Stile, Techniken, Instrumente), <b>politische Strategie</b> (Raschke/Tils) und die <b>Europäisierung</b> des Regierens (Sturm/Pehle).</p>`,

{id:"se1-6", t:"Vier Zugänge: Inhalte und Kommunikation", html:`
<h3>3. Inhalte: Politikfelder (policy)</h3>
<ul><li>Die <b>Politikfeldanalyse</b> wurde erst <b>seit Mitte der 1970er</b> ein eigenständiges Forschungsfeld. Sie überwindet die rein institutionelle oder prozessuale Sicht zugunsten der Inhalte, etwa in Sozial-, Umwelt- oder Arbeitsmarktpolitik.</li>
<li>Implementations- und Evaluationsforschung wollten auch <b>gesellschaftskritisch</b> wirken.</li>
<li><b>Leitfragen:</b> Was tun und lassen Regierungen? Wie organisieren sie ihre Tätigkeit? Welche Folgen hat das für Form, Prozess und Inhalt der Politik?</li>
<li><b>Befund:</b> Politik hat trotz objektiver Grenzen <b>erhebliche Autonomie</b> gegenüber Wirtschaft und Gesellschaft. Wie groß der <b>Handlungskorridor</b> ist, bleibt strittig und muss je Themenfeld neu vermessen werden.</li></ul>
<h3>4. Kommunikation: mediale Komponenten und Aufmerksamkeitsmanagement</h3>
<p>Seit den 1990ern (Sarcinelli) gilt Kommunikation nicht als Nebenschauplatz, sondern als <b>konstitutive Bedingung</b> für den Erfolg von Politik: <b>Legitimation erfolgt über Kommunikation.</b></p>
<div class="merk"><b>Kommunikative Macht ist nicht Medienmacht</b>Medienmacht ist oft eine <b>„als-ob-Macht“</b>: Entscheidend ist nicht, ob Medien wirklich entscheiden, sondern dass alle so handeln, als ob sie es täten. Politiker brauchen die Medien, um dosiert Aufmerksamkeit zu erzeugen: Aufmerksamkeit gegen Information. <b>Präsenz wird zur Machtwährung.</b></div>
<table class="kvq"><tr><th colspan="2">Wie Medien auf Politik wirken (nach Schmidt/Zohlnhöfer)</th></tr>
<tr><td><b>Direkt</b></td><td>Agenda-Setting, Stimmungen verstärken oder vergröbern, sichtbare Felder wie Verbraucherschutz als politisches Marketing</td></tr>
<tr><td><b>Indirekt</b></td><td>Politiker passen sich der <b>Selektionslogik</b> (Nachrichtenwerte, Aufmerksamkeit um jeden Preis) und der <b>Präsentationslogik</b> (Politainment) der Medien an</td></tr></table>
<p>Die Folge der indirekten Wirkung: Politik wird zur Unterhaltung, das Ergebnis ist <b>„politics without policy“</b>, nur noch Macht-, keine Sachfragen. <b>Darstellungspolitik ersetzt zunehmend Entscheidungspolitik.</b> Verstärkt wird das, weil die <b>Traditionsbindungen der Wähler</b> an Parteien schwächer werden. Situative Information über Medien gewinnt an Gewicht.</p>
<p class="small muted">Gut für deine Presseschau: Achte darauf, ob ein Artikel über eine Entscheidung (Entscheidungspolitik) oder über eine Inszenierung (Darstellungspolitik) berichtet.</p>`,

{id:"se1-7", t:"Regierungssysteme typisieren", html:`${EMPF("Croissant (2010), Abschnitt 2")}
<p>Ein Regierungssystem im <b>engen Sinn</b> umfasst die obersten Staatsorgane: Staatsoberhaupt, Regierung, Parlament. Im <b>weiten Sinn</b> auch Gerichte, Verwaltung, Wahlsystem, Parteien, Verbände, Medien (Steffani).</p>
<h3>Steffani: parlamentarisch oder präsidentiell</h3>
<table class="kvq"><tr><th></th><th>parlamentarisch</th><th>präsidentiell</th></tr>
<tr><td><b>Primär</b></td><td><b>politische Abberufbarkeit</b> der Regierung</td><td>nur verfassungsrechtliche Abberufbarkeit</td></tr>
<tr><td>Amt und Mandat</td><td>vereinbar</td><td>inkompatibel</td></tr>
<tr><td>Rücktritt</td><td>der gesamten Regierung</td><td>keine Pflicht</td></tr>
<tr><td>Auflösungsrecht</td><td>Regierung kann Parlament auflösen</td><td>keins</td></tr>
<tr><td>Fraktionsdisziplin</td><td>stark</td><td>gering</td></tr></table>
<ul><li>Mischtypen gibt es bei Steffani nicht.</li>
<li>Gewaltenteilung: Im Präsidentialismus stehen Parlament und Regierung <b>unverbunden nebeneinander</b>. Im Parlamentarismus wird sie überlagert von <b>Regierungsmehrheit gegen Opposition</b>.</li>
<li>Parlamente haben im Parlamentarismus vor allem <b>Wahlfunktion</b>, im Präsidentialismus vor allem Gesetzgebungs- und Kontrollfunktion.</li>
<li><b>Kritik:</b> Wie der Regierungschef ins Amt kommt, bleibt offen (Decker). Die Schweiz müsste als präsidentiell gelten.</li></ul>
<h3>Semi-Präsidentialismus (Duverger 1980)</h3>
<p>Drei Merkmale: (1) direkt gewählter Präsident, (2) mit beträchtlichen Befugnissen, (3) daneben Premier und Regierung, die vom <b>Vertrauen des Parlaments</b> abhängen. Die Regierung ist also <b>doppelt abhängig</b>: von Parlament und Präsident.</p>
<h3>Shugart/Carey (1992): fünf Typen</h3>
<table class="kvq">
<tr><td><b>Präsidentiell</b></td><td>geschlossene Exekutive, feste Amtszeit (USA)</td></tr>
<tr><td><b>Präsident-parlamentarisch</b></td><td>Präsident ernennt Premier, der von Präsident und Parlament abhängt (Russland)</td></tr>
<tr><td><b>Premier-präsidentiell</b></td><td>Regierung nur dem Parlament verantwortlich (Frankreich)</td></tr>
<tr><td><b>Parlamentarisch</b></td><td>Staatsoberhaupt ohne Macht über die Regierung (Großbritannien)</td></tr>
<tr><td><b>Versammlungsunabhängig</b></td><td>vom Parlament bestellt, aber nicht abberufbar (Schweiz)</td></tr></table>
<h3>Sind präsidentielle Systeme gefährlicher?</h3>
<p><b>Linz</b> sah die „perils of presidentialism“: Rigidität bei <i>divided government</i>, zwei konkurrierende Legitimationen, Winner-takes-all-Logik. Neuere Forschung relativiert das: Es kommt auf Parteiensystem, Wahlsystem, Befugnisse des Präsidenten und Lernprozesse der Eliten an (etwa Cheibub 2007).</p>`,

{id:"se1-8", t:"Demokratietypen und Vetospieler", html:`${EMPF("Croissant (2010), Abschnitte 3 und 4")}
<h3>Lijphart: Mehrheits- und Konsensdemokratie</h3>
<p><b>Mehrheitsdemokratie</b> (Westminster) konzentriert Macht und lässt Mehrheiten freie Bahn. <b>Konsensdemokratie</b> zielt auf Inklusion und Machtteilung, mit hohen Entscheidungshürden. Lijphart misst das an zehn Merkmalen in zwei Dimensionen:</p>
<table class="kvq"><tr><th colspan="2">Exekutive-Parteien-Dimension</th></tr>
<tr><td>Parteiensystem</td><td>Vielparteien- oder Zweiparteiensystem</td></tr>
<tr><td>Kabinette</td><td>Koalitionen oder Alleinregierung</td></tr>
<tr><td>Exekutive</td><td>Gleichgewicht oder Regierungsdominanz</td></tr>
<tr><td>Wahlsystem</td><td>Verhältniswahl oder Mehrheitswahl</td></tr>
<tr><td>Verbände</td><td>korporatistisch oder pluralistisch</td></tr>
<tr><th colspan="2">Föderalismus-Unitarismus-Dimension</th></tr>
<tr><td>Staatsaufbau</td><td>föderal oder zentralistisch</td></tr>
<tr><td>Zweite Kammer</td><td>starker Bikameralismus oder Einkammersystem</td></tr>
<tr><td>Verfassung</td><td>nur mit Supermehrheit oder einfach änderbar</td></tr>
<tr><td>Verfassungsgericht</td><td>starke oder keine judicial review</td></tr>
<tr><td>Zentralbank</td><td>autonom oder abhängig</td></tr></table>
<ul><li><b>Deutschland</b> ist in beiden Dimensionen konsensual: eine <b>föderale Konsensdemokratie</b>, in Lijpharts Tabelle neben Schweiz, Belgien, Niederlanden.</li>
<li>Nächst an den Idealtypen: Großbritannien und Neuseeland (Mehrheit), Schweiz (Konsens).</li>
<li>Der Demokratietyp liegt <b>quer zum Regierungssystem</b>: Großbritannien und Deutschland sind beide parlamentarisch, aber gegensätzliche Demokratietypen.</li>
<li>Lijphart hält Konsensdemokratien für „kinder and gentler“ und empfiehlt sie gespaltenen Gesellschaften und jungen Demokratien.</li>
<li><b>Kritik:</b> Konsistenzannahme nicht begründet, institutionelle und Verhaltensvariablen vermischt, Indikatoren teils nicht valide, Befunde stark von der Fallauswahl abhängig, Loblied auf die Konsensdemokratie fraglich, weil diese Gruppe fast nur reiche Länder enthält.</li></ul>
<h3>Tsebelis: Vetospieler</h3>
<p><b>Vetospieler</b> sind Akteure, deren Zustimmung für einen Politikwechsel nötig ist.</p>
<table class="kvq"><tr><td><b>Institutionelle</b></td><td>Einspruchsrecht steht in der Verfassung, etwa zweite Kammer oder Präsident</td></tr>
<tr><td><b>Parteipolitische</b></td><td>entstehen im politischen Prozess, etwa Koalitionsparteien</td></tr></table>
<p>Politikwechsel wird wahrscheinlicher, je <b>weniger</b> Vetospieler es gibt und je <b>näher</b> sie sich programmatisch sind. <b>Absorptionsregel:</b> Spieler mit gleicher Position zählen einfach, Spieler zwischen zwei anderen werden nicht gezählt. Entscheidend ist der Abstand der beiden am weitesten entfernten Spieler.</p>
<p>Damit lässt sich erklären, warum Reformen in Großbritannien oder Neuseeland größer ausfallen als in <b>Deutschland und der Schweiz</b>. Kritik: Verbände, Gewerkschaften oder Notenbanken mit faktischer Blockademacht fallen durch das Raster, und Parteien wollen nicht nur Policies, sondern auch Ämter und Stimmen.</p>`,

{id:"se1-9", t:"Regimetypen: Demokratie, Autoritarismus, Totalitarismus", html:`${EMPF("Lauth (2010)")}
<p class="small muted">Vieles kennst du aus der Vorlesung (Sitzung 1, Lauth 2015). Hier nur, was für das Seminar dazukommt.</p>
<h3>Herrschaft, Regime, Regierungssystem</h3>
<ul><li><b>Herrschaft</b> nach Max Weber: die Chance, für einen Befehl bestimmten Inhalts bei angebbaren Personen Gehorsam zu finden.</li>
<li><b>Herrschaftsform</b> und <b>Regime</b> werden synonym verwendet: Zugang zur Herrschaft, Machtbeziehungen der Eliten, Verhältnis zu den Beherrschten (Merkel).</li>
<li>Davon zu trennen ist das <b>Regierungssystem</b>: institutionelle Muster innerhalb eines Regimetyps. Parlamentarisch und präsidentiell sind beides Demokratien.</li>
<li>Voraussetzung jedes Regimes ist ein <b>Staat mit Gewaltmonopol</b>. Ist die Staatlichkeit schwach, spricht Lauth von defizitären Regimen.</li></ul>
<h3>Realtypus oder Idealtypus</h3>
<p>Ein <b>Realtypus</b> nimmt einen historischen Fall als Muster (etwa NS-Deutschland für Totalitarismus). Problem: Welches Jahr gilt? Und Widersprüche im Fall werden Teil des Typs. Lauth bevorzugt den <b>Idealtypus</b> (Max Weber): eine Leitidee wird zugespitzt entfaltet, der reale Fall muss nicht deckungsgleich sein.</p>
<h3>Demokratie kategorial bestimmen</h3>
<table class="kvq"><tr><td><b>Fraenkel</b></td><td>vier Ebenen: Legitimation, Gesellschaftsstruktur, Regierungssystem, Rechtssystem. Lauths Einwand: Eine pluralistische Gesellschaft ist Voraussetzung, nicht Merkmal der Demokratie.</td></tr>
<tr><td><b>Merkel</b></td><td>sechs Ebenen, hervorgehoben Herrschaftszugang und Herrschaftsweise</td></tr>
<tr><td><b>Lauth</b></td><td>fünf Institutionen: Entscheidungsverfahren (Wahlen), öffentliche Kommunikation, intermediäre Vermittlung, Regelsetzung und -anwendung, Rechtsgarantie</td></tr></table>
<h3>Totalitär und autoritär</h3>
<ul><li>Gemeinsam ist allen Totalitarismustheorien die <b>Ideologie</b> mit Wahrheitsanspruch, Freund-Feind-Denken und dem Anspruch, die <b>gesamte Gesellschaft</b> umzuformen. <b>Arendt</b> betont den Terror, <b>Friedrich/Brzezinski</b> den technischen Charakter (sechs Merkmale, etwa Massenpartei, Geheimpolizei, Nachrichtenmonopol).</li>
<li>Autoritäre Regime nach <b>Linz</b>: begrenzter Pluralismus, Mentalitäten statt Ideologie, kaum Mobilisierung. Lauth zweifelt, ob Mobilisierung trennscharf ist.</li>
<li><b>Merkel</b> unterscheidet neun autoritäre Subtypen nach der Legitimation, etwa Militärregime, theokratische, sultanistische Regime.</li></ul>
<h3>Regime messen</h3>
<table class="kvq"><tr><td><b>Vanhanen</b></td><td>quantitativ: Wahlbeteiligung mal Wettbewerb (100 minus Stimmenanteil der stärksten Partei). Benachteiligt Zweiparteiensysteme und junge Bevölkerungen.</td></tr>
<tr><td><b>Polity</b></td><td>Wettbewerb und Regulierung der Partizipation, Offenheit der Rekrutierung, Begrenzung der Exekutive</td></tr>
<tr><td><b>Freedom House</b></td><td>politische Rechte und bürgerliche Freiheiten: free, partly free, not free. Wenig transparent.</td></tr>
<tr><td><b>Sartori</b></td><td>17 Kriterien, misst die Intensität totalitärer Herrschaft</td></tr></table>`,

{id:"se1-10", t:"Politische Kultur", html:`${EMPF("Pickel/Pickel (2016)")}
<p><b>Politische Kultur</b> ist die subjektive Seite der Politik: die auf politische Objekte gerichteten <b>Einstellungen und Wertorientierungen</b> der Bürger, als Kollektiv betrachtet. Der Begriff ist <b>analytisch, nicht wertend</b>. Jedes Land hat eine politische Kultur, die Frage ist nur, welche.</p>
<p class="small muted">Max Kaase spottete 1983, den Begriff zu fassen sei, als wolle man einen Pudding an die Wand nageln. Das gilt heute als überwunden.</p>
<div class="merk"><b>Kernannahme</b>Ein System ist stabil, wenn politische <b>Kultur und Struktur zueinander passen</b> (Kongruenz). Demokratische Institutionen brauchen eine demokratische Kultur. Faustregel nach Diamond: mindestens 75 Prozent Demokraten, keine größere Gruppe von etwa 15 Prozent dagegen.</div>
<h3>Almond und Verba: The Civic Culture (1963)</h3>
<p>Umfrage in fünf Ländern, darunter die Bundesrepublik. Drei Grundtypen:</p>
<table class="kvq"><tr><td><b>Parochial</b></td><td>kein Interesse, kein Wissen, keine Erwartungen (Stammes- und Feudalkulturen)</td></tr>
<tr><td><b>Subject</b> (Untertan)</td><td>bewertet System und Outputs, sieht sich selbst nicht als Akteur (Kaiserreich)</td></tr>
<tr><td><b>Participant</b></td><td>Wissen, Beteiligung, Bürger bringt sich ein</td></tr></table>
<p>Vorbild ist die <b>Civic Culture</b>, ein Mischtyp: stark partizipativ, aber mit Elementen der Untertanenkultur, die das System regierbar halten. Kritik: Ähnelt stark der amerikanischen Demokratie.</p>
<p>Passung schafft <b>allegiance</b> (Verbundenheit). Instabil machen <b>apathy</b> (Gleichgültigkeit) und <b>alienation</b> (Entfremdung).</p>
<h3>Lipset: Legitimität und Effektivität</h3>
<table class="kvq"><tr><th></th><th>effektiv</th><th>nicht effektiv</th></tr>
<tr><td><b>legitim</b></td><td>A: stabil</td><td>B: Effektivitätskrise, zehrt vom Legitimitätsvorschuss</td></tr>
<tr><td><b>nicht legitim</b></td><td>C: lebt von Leistung, instabil</td><td>D: instabil, vor dem Zusammenbruch</td></tr></table>
<p>Typischer Weg <b>C → A</b>: Die Bundesrepublik gewann Legitimität durch ihre wirtschaftlichen Erfolge nach dem Krieg. Ein langer Weg A → B → D führt in den Zusammenbruch.</p>
<h3>Easton: politische Unterstützung</h3>
<ul><li>Drei Objekte: <b>politische Gemeinschaft</b>, <b>Regime</b> (die Rollen, etwa das Amt des Bundespräsidenten), <b>Autoritäten</b> (die Personen).</li>
<li><b>Spezifische</b> Unterstützung: Zufriedenheit mit Outputs und Amtsträgern (wie Lipsets Effektivität).</li>
<li><b>Diffuse</b> Unterstützung: Zustimmung um ihrer selbst willen (wie Lipsets Legitimität), unterteilt in Legitimität und Vertrauen.</li></ul>
<p><b>Fuchs</b> ordnet hierarchisch: Werte der Demokratie, dann Struktur, dann Performanz. Befund: kaum Legitimitätskrise im Westen. Hohe Zustimmung zur Demokratie (70 bis 90 Prozent), aber wenig Vertrauen in Politiker und Parteien (10 bis 20 Prozent).</p>`,

{id:"se1-11", t:"Der Policy-Zyklus", html:`${EMPF("Schneider/Janning (2006), Abschnitt 2.1")}
<p>Gegenstand der Politikfeldanalyse ist die <b>inhaltliche Dimension</b>: Gesetze, Verordnungen, Programme, Einzelentscheidungen. Ausgangspunkt ist Eastons Input-Output-Schema. Daraus entsteht der <b>Policy-Zyklus</b>.</p>
${FIG_ZYKLUS}
<h3>1. Problemdefinition und Agenda-Setting</h3>
<ul><li>Ein Problem ist eine <b>Diskrepanz zwischen Ist und Soll</b> (Sjöblom). Es hat zwei Komponenten: <b>Norm und Faktizität</b>.</li>
<li>Es muss von Akteuren <b>wahrgenommen</b> werden. Umweltschäden gab es lange, bevor sie ein politisches Problem wurden.</li>
<li>Akteure handeln nur, wenn sie eine Änderung für denkbar halten, Mittel haben und Risiko eingehen. Probleme können auch verdrängt oder bewusst konserviert werden.</li>
<li>Aufmerksamkeit ist <b>knapp</b>: Themen konkurrieren um die Agenda.</li>
<li>Themenkarrieren: innerhalb der Regierung, von außen über Gruppen und Öffentlichkeit, beides verknüpft, oder durch <b>internationale Politikdiffusion</b>.</li>
<li>Ereignisse öffnen ein <b>policy window</b> (Kingdon): ein kurzes Gelegenheitsfenster. Wer es verpasst, muss warten. Was nie auf die Agenda kommt, ist eine <b>Nichtentscheidung</b> (Bachrach/Baratz).</li></ul>
<h3>2. Programmformulierung</h3>
<ul><li>Ein Programm legt Ziele, Adressaten, Träger und Mittel fest, meist als Gesetz oder Verordnung.</li>
<li>Kriterien: <b>effektiv</b> (löst das Problem), <b>effizient</b> (mit möglichst wenig Mitteln).</li>
<li>In der Praxis fehlen klare Ziele und Wissen. Darum entstehen eher <b>inkrementalistische</b> Schritte (Lindblom), „zufriedenstellende“ Lösungen (Simon) oder <b>Imitation</b> fremder Lösungen.</li>
<li>In Deutschland entstehen rund <b>80 Prozent</b> der Gesetzentwürfe in einem <b>Referat eines Bundesministeriums</b>. Das ist das strategische Stadium.</li></ul>
<h3>3. Implementation</h3>
<table class="kvq"><tr><th colspan="2">Programmtypen nach Mayntz</th></tr>
<tr><td><b>Regulativ</b></td><td>direkte Verhaltenssteuerung, hoher Kontrollaufwand, ruft Widerstand hervor</td></tr>
<tr><td><b>Anreiz</b></td><td>motiviert positiv, wirkt indirekt, Mitnahmeeffekte</td></tr>
<tr><td><b>Leistung</b></td><td>sichert ein Angebot, nicht dessen Nutzung, teuer</td></tr></table>
<p>Je mehr Stellen beteiligt sind, desto geringer die Chance auf Umsetzung (Pressman/Wildavsky). Sind die Adressaten private Akteure, braucht es Kooperation. Droht der Staat nur zu regulieren, regeln Verbände manchmal selbst: <b>private Interessenregierung</b> (Streeck/Schmitter).</p>
<h3>Evaluation und Terminierung</h3>
<p>Wirkt das Programm? Ist es effizient? Danach wird es fortgesetzt, verändert oder beendet. Die Autoren sehen darin eine <b>Rückkopplung</b>, keine eigene Phase.</p>
<div class="merk"><b>Kritik und Wert</b>Die Phasen überlappen, laufen parallel und auf mehreren Ebenen. Der Zyklus ist <b>kein Kausalmodell</b>, erklärt nicht, was den Prozess antreibt, und vernachlässigt Akteure und Lernen. Als <b>Heuristik</b> ist er aber unbestritten nützlich.</div>`,

{id:"se1-12", t:"Politikfelder, Akteure, Netzwerke", html:`${EMPF("Schneider/Janning (2006), Abschnitt 2.2")}
<p>Strukturell betrachtet ist ein Politikfeld ein <b>Problemverarbeitungszusammenhang</b> und zugleich eine <b>Konfliktstruktur</b>.</p>
<h3>Arten von Akteuren (Scharpf)</h3>
<table class="kvq">
<tr><td><b>Individuen</b></td><td>einzelne Personen</td></tr>
<tr><td><b>Handlungsaggregate</b></td><td>Gruppe handelt gleichgerichtet, weil sie ähnliche Präferenzen hat</td></tr>
<tr><td><b>Kollektive Akteure</b></td><td>Beteiligte handeln selbst, aber koordiniert: Allianzen, Clubs, Bewegungen, Verbände</td></tr>
<tr><td><b>Korporative Akteure</b></td><td>Ressourcen werden in eine eigene Organisation gelegt, die stellvertretend handelt: Parteien, Gewerkschaften, Parlament, Regierung</td></tr></table>
<p>Moderne Politik wird von <b>korporativen Akteuren</b> geprägt: Sie handeln dauerhaft, spezialisiert und arbeitsteilig. Sie entwickeln aber auch <b>Eigeninteressen</b>, etwa den Erhalt der Organisation. Individuen handeln meist als <b>Agenten</b> für Prinzipale.</p>
<h3>Wer wirkt wo mit?</h3>
<p><b>Almond</b> ordnete jeder Phase eine Hauptstruktur zu: Verbände artikulieren, Parteien bündeln, das Parlament formuliert, die Verwaltung setzt um. Das passt zu den USA, aber nicht zu Deutschland. Nach <b>Mayntz</b> wirken hier <b>Verbände</b> auch bei Zielen und Programmen mit, und <b>Regierung und Verwaltung</b> sind mehr als Vollzugsorgane.</p>
<h3>Konflikt, Netzwerk, Diskurs</h3>
<ul><li><b>Lowi:</b> Regulative, distributive und redistributive Politik erzeugen unterschiedliche Konfliktarenen.</li>
<li><b>Akteurkonstellation:</b> Positionen, Konflikte und Koalitionen der Akteure zueinander.</li>
<li><b>Politiknetzwerk:</b> enger, betont Beziehungen wie Kommunikation und Ressourcenaustausch.</li>
<li><b>Issue networks</b> (Heclo): Netzwerke öffnen Zugang für viele, auch für schwache Interessen, und liefern Sachverstand.</li>
<li><b>Diskursfeld:</b> Akteure folgen Weltbildern (belief systems). Was der eine als Lösung sieht, ist für den anderen ein Problem.</li></ul>
<p>Wichtig sind zudem <b>professionals</b> und Expertennetzwerke, etwa in Umwelt- und Gesundheitspolitik: Sie bringen Wissen über Organisationsgrenzen hinweg ein.</p>`,

 {id:"se1-c14", f:"Regieren (Korte/Fröhlich)", b:"Herbeiführung und Durchsetzung gesellschaftlich verbindlicher Entscheidungen.\nMischung aus Koordination und Steuerung, Leitung und Entscheidung, Durchsetzung."},
 {id:"se1-c15", f:"Regierung, Regierungshandeln, Regierungssteuerung", b:"Regierung: Exekutive, also Regierungschef und Kabinett\nRegierungshandeln: Tun und Lassen der Regierung\nRegierungssteuerung: strategisches Handeln für materielle Politikziele"},
 {id:"se1-c16", f:"Vier Zugänge der Regierungsforschung (Schuppert)", b:"1. Struktur (polity): institutionelle Ansätze\n2. Prozess (politics): Politikmanagement, Governance\n3. Inhalte (policy): Politikfelder\n4. Kommunikation: Medien, Aufmerksamkeitsmanagement"},
 {id:"se1-c17", f:"Struktureller Zugang der 1960er (Hennis)", b:"Leitfrage: Welche Aufgaben hat der Leistungsstaat zwingend zu erfüllen?\nSchwächen: keine Operationalisierung, keine empirischen Methoden, Akteure und soziale Voraussetzungen ausgeblendet."},
 {id:"se1-c18", f:"Systemtheorie in der Regierungsforschung: Leitfragen", b:"1. Auf welche Einflüsse reagiert das Entscheidungszentrum?\n2. Welche Interessen greift das System auf?\n3. Welche Rückwirkungen haben Entscheidungen?\nKritik: Auflistung von Faktoren, keine Sinnfrage."},
 {id:"se1-c19", f:"Innerer vs. äußerer Souveränitätsverlust", b:"Ursache: mehr Mitspieler im Inneren / europäische Integration, Globalisierung\nFolge: verhandeln, moderieren, koordinieren / Kooperation in Netzwerken und Verhandlungssystemen"},
 {id:"se1-c20", f:"Mischcharakter nach Lehmbruch", b:"Konkurrenzdemokratisch: Parteienwettbewerb\nKonkordanzdemokratisch: Aushandeln im Bundesstaat\nBeides prägt den Regierungsalltag."},
 {id:"se1-c21", f:"Leitfragen der Politikfeldanalyse", b:"1. Was tun und lassen Regierungen?\n2. Wie organisieren sie ihre Tätigkeiten?\n3. Welche Folgen hat das für Form, Prozess und Inhalt der Politik?"},
 {id:"se1-c22", f:"Kommunikative Macht vs. Medienmacht", b:"Kommunikative Macht: braucht der Akteur, um Mehrheiten zu sichern und Sach- und Machtfragen zu verbinden.\nMedienmacht: oft eine „als-ob-Macht“, wirkt, weil alle sie unterstellen."},
 {id:"se1-c23", f:"Direkte vs. indirekte Medieneinflüsse", b:"Direkt: Agenda-Setting, Stimmungen verstärken, politisches Marketing\nIndirekt: Politik passt sich Selektions- und Präsentationslogik an, Folge „politics without policy“"},
 {id:"se1-c24", f:"Steffani: Primär- und Sekundärmerkmale", b:"Primär: politische Abberufbarkeit der Regierung durch das Parlament\nSekundär: Amt und Mandat vereinbar, Rücktritt der ganzen Regierung, Auflösungsrecht, starke Fraktionsdisziplin"},
 {id:"se1-c25", f:"Semi-Präsidentialismus nach Duverger", b:"1. direkt gewählter Präsident\n2. mit beträchtlichen Befugnissen\n3. Premier und Regierung abhängig vom Vertrauen des Parlaments"},
 {id:"se1-c26", f:"Shugart/Carey: fünf Typen mit Beispiel", b:"Präsidentiell: USA\nPräsident-parlamentarisch: Russland\nPremier-präsidentiell: Frankreich\nParlamentarisch: Großbritannien\nVersammlungsunabhängig: Schweiz"},
 {id:"se1-c27", f:"Linz: Gefahren des Präsidentialismus", b:"1. Rigidität bei divided government\n2. zwei konkurrierende demokratische Legitimationen\n3. Winner-takes-all fördert Kooperationsfeindlichkeit\nNeuere Forschung relativiert das."},
 {id:"se1-c28", f:"Lijphart: zwei Dimensionen", b:"Exekutive-Parteien: Parteiensystem, Kabinette, Exekutivdominanz, Wahlsystem, Verbände\nFöderalismus-Unitarismus: Staatsaufbau, zweite Kammer, Verfassungsrigidität, judicial review, Zentralbank"},
 {id:"se1-c29", f:"Deutschland bei Lijphart", b:"**Föderale Konsensdemokratie**: konsensual in beiden Dimensionen.\nDer Demokratietyp liegt quer zum Regierungssystem: UK und Deutschland sind beide parlamentarisch, aber gegensätzlich."},
 {id:"se1-c30", f:"Vetospieler nach Tsebelis", b:"Akteure, deren Zustimmung für einen Politikwechsel nötig ist.\nInstitutionell: in der Verfassung (z. B. zweite Kammer)\nParteipolitisch: im Prozess (z. B. Koalitionspartner)"},
 {id:"se1-c31", f:"Wann ist Politikwechsel wahrscheinlich? (Tsebelis)", b:"- wenige Vetospieler\n- geringe programmatische Distanz\nAbsorptionsregel: entscheidend ist der Abstand der am weitesten entfernten Spieler."},
 {id:"se1-c32", f:"Realtypus vs. Idealtypus", b:"Bildung: historischer Fall als Muster / Leitidee zugespitzt entfaltet (Weber)\nProblem: Zeitpunkt, Widersprüche des Falls / Fall muss nicht deckungsgleich sein"},
 {id:"se1-c33", f:"Politische Kultur (Pickel/Pickel)", b:"Die auf politische Objekte gerichteten Einstellungen und Wertorientierungen der Bürger, als Kollektiv.\nAnalytisch, nicht wertend. Stabilität durch Kongruenz von Kultur und Struktur."},
 {id:"se1-c34", f:"Almond/Verba: Typen politischer Kultur", b:"Parochial: kein Bezug zum System\nSubject: bewertet Outputs, sieht sich nicht als Akteur\nParticipant: Wissen und Beteiligung\nCivic Culture: Mischtyp, Vorbild für Demokratien"},
 {id:"se1-c35", f:"Lipsets Raster", b:"A: legitim und effektiv, stabil\nB: legitim, nicht effektiv, Effektivitätskrise\nC: effektiv, nicht legitim, instabil\nD: weder noch, Zusammenbruch droht\nBRD nach 1945: C → A"},
 {id:"se1-c36", f:"Diffuse Unterstützung vs. spezifische Unterstützung", b:"Bezug: System um seiner selbst willen / Outputs und Amtsträger\nEntspricht bei Lipset: Legitimität / Effektivität\nStabilität: langfristig / schwankt kurzfristig"},
 {id:"se1-c37", f:"Phasen des Policy-Zyklus", b:"1. Problemdefinition und Agenda-Setting\n2. Programmformulierung\n3. Implementation\nDazu Evaluation und Terminierung als Rückkopplung."},
 {id:"se1-c38", f:"Programmtypen nach Mayntz", b:"Regulativ: direkte Steuerung, Widerstand, hoher Kontrollaufwand\nAnreiz: positiv, indirekt, Mitnahmeeffekte\nLeistung: Angebot gesichert, Nutzung nicht, teuer"},
 {id:"se1-c39", f:"Akteurstypen nach Scharpf", b:"Individuen\nHandlungsaggregate: gleichgerichtet ohne Organisation\nKollektive Akteure: koordiniert, Beteiligte handeln selbst\nKorporative Akteure: eigene Organisation handelt stellvertretend"}

ESSAYS.push(
 {id:"se1-e1", ch:101, kind:"lang", short:"Regierungsforschung statt Verfassungskunde",
  q:"Korte und Fröhlich fordern, die formale Institutionenkunde um informelle Prozesse und politische Kommunikation zu ergänzen. Erläutern Sie diese Forderung und diskutieren Sie, ob sie für das Verständnis des Regierens in Deutschland notwendig ist.",
  op:"„Erläutern“: Forderung und Begründung mit Begriffen und Beispiel darstellen. „Diskutieren“: Was leistet die formale Sicht, was fehlt ihr? Am Ende Stellung nehmen.",
  gl:["<b>Einleitung:</b> Grundgesetz beschreibt Organe, erklärt aber nicht, wie wirklich regiert wird. Frage und These.",
   "<b>Formale Sicht:</b> parlamentarisches System, Art. 20 GG, Legitimationskette. Was sie leistet: Rahmen, Zuständigkeiten.",
   "<b>Die Forderung:</b> Regieren als Herbeiführung und Durchsetzung verbindlicher Entscheidungen, Politikmanagement, Macht muss erarbeitet werden, informelle Komponenten.",
   "<b>Kommunikation:</b> Legitimation über Kommunikation, kommunikative Macht, Darstellungs- und Entscheidungspolitik.",
   "<b>Gegenargument:</b> Ohne formalen Rahmen lässt sich Informelles nicht einordnen. Gefahr, Inszenierung zu überschätzen.",
   "<b>Fazit:</b> Ergänzung notwendig, aber als Ergänzung, nicht als Ersatz."],
  k:["Problemstellung: Verfassungsnormen allein erklären die Regierungspraxis nicht",
   "Formaler Rahmen korrekt skizziert (z. B. parlamentarisches System, Abberufbarkeit, Art. 20 GG)",
   "Regieren oder Politikmanagement nach Korte/Fröhlich definiert",
   "Informelle Komponenten und Macht als zu erarbeitende Größe erklärt",
   "Rolle der Kommunikation (Legitimation, kommunikative Macht oder Darstellungspolitik) erläutert",
   "Mindestens ein Gegenargument oder eine Grenze abgewogen",
   "Fazit mit begründeter eigener Position"],
  m:[
 "Wer das Grundgesetz liest, erfährt, welche Organe es gibt, wer wen wählt und welche Zuständigkeiten gelten. Wie in Berlin tatsächlich regiert wird, steht dort nicht. Korte und Fröhlich (2009) verstehen ihr Lehrbuch deshalb ausdrücklich nicht als Verfassungskunde. Sie fordern, die formale Institutionenkunde um informelle Entscheidungsprozesse, politische Kommunikation, personalisierte Regierungsstile und Strategien zu ergänzen. Dieser Essay erläutert die Forderung und vertritt die These, dass sie für das Verständnis des deutschen Regierens notwendig ist, die formale Sicht aber nicht ersetzt.",
 "Formal ist Deutschland ein repräsentatives, freiheitliches und parlamentarisches Regierungssystem. Der Bundestag wählt den Kanzler und kann ihn durch das konstruktive Misstrauensvotum abberufen, nach Steffani das entscheidende Merkmal des Parlamentarismus. Art. 20 GG legt Demokratie, Bundesstaat, Rechtsstaat und Sozialstaat fest, und über Wahlen entsteht eine lückenlose Legitimationskette vom Volk bis zur Regierung. Diese Ordnung bestimmt Zuständigkeiten und Verfahren. Sie sagt aber wenig darüber, wer sich in einem konkreten Konflikt durchsetzt und warum.",
 "Hier setzen Korte und Fröhlich an. Regieren bedeutet für sie die Herbeiführung und Durchsetzung gesellschaftlich verbindlicher Entscheidungen, eine Mischung aus Koordination, Steuerung, Leitung und Durchsetzung. Dafür braucht es Politikmanagement, also die Verbindung der Steuerbarkeit des Systems mit der Steuerungsfähigkeit der Akteure. Macht folgt dabei nicht einfach aus dem Amt. Ein Kanzler muss sie sich als „Machtjongleur“ täglich erarbeiten, etwa in Koalitionsrunden oder Gesprächen mit Ministerpräsidenten, die in keinem Organigramm stehen. Weil durch Föderalismus, Verbände und EU immer mehr Mitspieler beteiligt sind, muss eine Regierung verhandeln, moderieren und koordinieren statt anordnen. Diese informellen Komponenten erklären, warum Entscheidungen oft schon gefallen sind, bevor das Parlament formal abstimmt.",
 "Hinzu kommt die Kommunikation. Legitimation entsteht nach Korte und Fröhlich über Kommunikation, kommunikative Macht ist zugleich politische Macht. Weil die Bindung der Wähler an Parteien schwächer wird, gewinnt situative, medienvermittelte Information an Gewicht, und die Darstellungspolitik tritt neben die Entscheidungspolitik. Wer nur die Gesetzgebung betrachtet, kann nicht erklären, warum eine Regierung trotz stabiler Mehrheit an Zustimmung verliert oder warum ein Vorhaben scheitert, bevor es überhaupt eingebracht wird.",
 "Dagegen lässt sich einwenden, dass informelle Prozesse ohne den formalen Rahmen gar nicht verständlich wären. Koalitionsausschüsse gibt es nur, weil das parlamentarische System eine stabile Mehrheit verlangt, und mit den Ländern wird verhandelt, weil das Grundgesetz dem Bundesrat Mitwirkungsrechte gibt. Zudem besteht die Gefahr, Inszenierung zu überschätzen. Ein großer Teil der Gesetzgebung läuft als Routine ab und bleibt von Medien weitgehend unbeeinflusst.",
 "Insgesamt ist die Forderung berechtigt. Ohne den Blick auf informelle Macht, Strategie und Kommunikation bleibt unerklärt, wie Regieren in Deutschland tatsächlich funktioniert. Die formale Institutionenkunde bleibt aber das Fundament, denn sie setzt die Spielregeln, innerhalb derer informell verhandelt wird. Regierungsforschung ergänzt die Verfassungskunde also, sie ersetzt sie nicht."]},
 {id:"se1-e2", ch:101, kind:"lang", short:"Deutschland typologisch einordnen",
  q:"Ordnen Sie das politische System Deutschlands typologisch ein und diskutieren Sie, welche Folgen diese Einordnung für die Reformfähigkeit deutscher Politik hat.",
  op:"„Einordnen“: Typologien nennen und Deutschland mit Begründung zuordnen. „Diskutieren“: Vor- und Nachteile für Reformen abwägen, Stellung nehmen.",
  gl:["<b>Einleitung:</b> Klage über Reformstau. Frage: Liegt das am Systemtyp?",
   "<b>Regierungssystem:</b> Steffani, Abberufbarkeit, konstruktives Misstrauensvotum: parlamentarisch.",
   "<b>Demokratietyp:</b> Lijphart, föderale Konsensdemokratie mit Merkmalen. Typ quer zum Regierungssystem.",
   "<b>Folgen:</b> Vetospieler (Tsebelis): Bundesrat, Koalitionen, Verfassungsgericht. Lehmbruchs Mischcharakter.",
   "<b>Abwägung:</b> Nachteil langsame Reformen. Vorteil Inklusion, Stabilität, Schutz vor abrupten Wechseln.",
   "<b>Fazit:</b> geringere Reformgeschwindigkeit als Preis für breite Zustimmung."],
  k:["Einordnung als parlamentarisches Regierungssystem mit Steffanis Kriterium",
   "Einordnung als Konsensdemokratie nach Lijphart mit mindestens zwei Merkmalen",
   "Unterschied zwischen Regierungssystem und Demokratietyp erkannt",
   "Vetospieler-Ansatz erklärt und auf Deutschland angewendet",
   "Nachteil für die Reformfähigkeit begründet",
   "Vorteil oder Gegenargument abgewogen",
   "Fazit beantwortet die Frage begründet"],
  m:[
 "In der öffentlichen Debatte ist oft von einem Reformstau in Deutschland die Rede, etwa bei Rente, Steuern oder Digitalisierung. Ob das am politischen System selbst liegt, lässt sich mit den Typologien der Vergleichenden Regierungslehre prüfen. Dabei ist zwischen dem Typ des Regierungssystems und dem Demokratietyp zu unterscheiden. Dieser Essay ordnet Deutschland als parlamentarisches System und als Konsensdemokratie ein und vertritt die These, dass diese Kombination Reformen bremst, dafür aber Stabilität und breite Zustimmung sichert.",
 "Nach Winfried Steffani entscheidet ein einziges Merkmal über den Typ des Regierungssystems: ob das Parlament die Regierung aus politischen Gründen abberufen kann. In Deutschland wählt der Bundestag den Kanzler und kann ihn durch das konstruktive Misstrauensvotum stürzen. Deutschland ist daher, wie auch Korte und Fröhlich festhalten, ein parlamentarisches Regierungssystem. Dazu passen die Sekundärmerkmale: Minister dürfen zugleich Abgeordnete sein, und die Fraktionsdisziplin ist hoch, weil die Mehrheit die Regierung tragen muss.",
 "Damit ist aber noch nicht gesagt, wie die Macht verteilt ist. Arend Lijphart unterscheidet Mehrheits- und Konsensdemokratien und misst das an zehn Merkmalen in zwei Dimensionen. In der Exekutive-Parteien-Dimension ist Deutschland konsensual: Es gibt ein Vielparteiensystem, Koalitionsregierungen und ein Verhältniswahlrecht. Auch in der Föderalismus-Unitarismus-Dimension ist es konsensual, mit föderalem Staatsaufbau, starkem Bundesrat, einer nur mit Zweidrittelmehrheit änderbaren Verfassung und einem mächtigen Verfassungsgericht. Lijphart stuft Deutschland deshalb als föderale Konsensdemokratie ein. Großbritannien ist ebenfalls parlamentarisch, aber eine Mehrheitsdemokratie. Der Demokratietyp liegt also quer zum Regierungssystem.",
 "Für die Reformfähigkeit ist vor allem der Demokratietyp entscheidend. Nach George Tsebelis wird ein Politikwechsel umso schwerer, je mehr Vetospieler zustimmen müssen und je weiter ihre Positionen auseinanderliegen. In Deutschland sind das mindestens die Koalitionspartner als parteipolitische Vetospieler und bei zustimmungspflichtigen Gesetzen der Bundesrat als institutioneller Vetospieler, in dem oft andere Mehrheiten herrschen. Hinzu kommt das Bundesverfassungsgericht, das Gesetze aufheben kann. Gerhard Lehmbruch beschreibt diesen Mischcharakter aus Parteienwettbewerb im Bundestag und Aushandeln im Bundesstaat. Reformen fallen daher in Deutschland und der Schweiz kleiner aus als in Großbritannien oder Neuseeland.",
 "Diese Bremswirkung hat jedoch eine Kehrseite. Weil viele Akteure eingebunden werden, beruhen Entscheidungen auf einer breiten Basis und werden nach einem Regierungswechsel seltener zurückgedreht. Abrupte Kurswechsel, wie sie Mehrheitsdemokratien kennen, bleiben aus. Lijphart hält Konsensdemokratien deshalb sogar für die „freundlicheren“ Demokratien und empfiehlt sie gespaltenen Gesellschaften. Allerdings ist diese These umstritten, da in seiner Gruppe der Konsensdemokratien fast nur wohlhabende Länder liegen und andere Faktoren deren Leistungen erklären könnten.",
 "Insgesamt ist Deutschland ein parlamentarisches Regierungssystem mit konsensdemokratischer Machtverteilung. Diese Einordnung erklärt gut, warum Reformen langsam und in kleinen Schritten verlaufen. Das ist jedoch weniger ein Systemfehler als der Preis für Inklusion, Berechenbarkeit und Stabilität. Wer schnellere Reformen will, müsste Vetopunkte abbauen und damit zugleich Machtteilung aufgeben."]},
 {id:"se1-e3", ch:101, kind:"lang", short:"Darstellung verdrängt Entscheidung",
  q:"„Darstellungspolitik ersetzt zunehmend Entscheidungspolitik.“ Erläutern Sie diese These nach Korte/Fröhlich und nehmen Sie kritisch Stellung.",
  op:"„Erläutern“: Begriffe klären, Begründung der These darstellen. „Kritisch Stellung nehmen“: Argumente für und gegen die These prüfen, eigenes Urteil.",
  gl:["<b>Einleitung:</b> Beispiel Talkshow oder Krisenbesuch. These vorstellen.",
   "<b>Begriffe:</b> Darstellungspolitik und Entscheidungspolitik (Sarcinelli).",
   "<b>Begründung:</b> Legitimation über Kommunikation, kommunikative Macht, als-ob-Macht, Präsenz als Machtwährung, schwächere Parteibindungen.",
   "<b>Folgen:</b> Selektions- und Präsentationslogik, politics without policy.",
   "<b>Kritik:</b> Routine-Gesetzgebung, Verhandlungen im Bundesstaat und Ministerialreferate bleiben unsichtbar, aber entscheidend.",
   "<b>Fazit:</b> Gewicht verschiebt sich, ersetzen ist zugespitzt."],
  k:["Darstellungs- und Entscheidungspolitik korrekt definiert",
   "Kommunikation als Legitimationsquelle oder kommunikative Macht erklärt",
   "Unterschied kommunikative Macht und Medienmacht (als-ob-Macht) oder Präsenz als Machtwährung",
   "Direkte oder indirekte Medieneinflüsse, etwa politics without policy",
   "Gegenargument, z. B. Routine-Gesetzgebung abseits der Medien",
   "Eigenes, begründetes Urteil über die These"],
  m:[
 "Wenn nach einer Flutkatastrophe Regierungsmitglieder in Gummistiefeln vor Kameras stehen, ist das Politik. Ob den Betroffenen damit geholfen ist, entscheidet sich aber an anderer Stelle, etwa in Verhandlungen über Hilfsgelder. Korte und Fröhlich (2009) vertreten die These, dass solche Darstellungspolitik die Entscheidungspolitik zunehmend ersetzt. Dieser Essay erläutert die These und argumentiert, dass sie eine reale Verschiebung beschreibt, das Wort „ersetzen“ aber zu weit geht.",
 "Die Unterscheidung geht auf Ulrich Sarcinelli zurück. Darstellungspolitik ist medienvermittelte, symbolische und öffentlich inszenierte Politik, die den Wettbewerbsregeln der medialen Öffentlichkeit folgt. Entscheidungspolitik meint dagegen die Verfahren der Politik, vor allem die Gesetzgebung. Sie läuft meist als Routine ab und bleibt von den Aufmerksamkeitsregeln der Medien weitgehend unbeeinflusst. Korte und Fröhlich nennen die Darstellung den Soll-Wert, die Entscheidung den Nenn-Wert der Politik.",
 "Für die These spricht zunächst, dass Kommunikation für Korte und Fröhlich keine Nebensache ist: Legitimation entsteht über Kommunikation. Wer regiert, braucht kommunikative Macht, um Mehrheiten zu sichern und Sach- und Machtfragen zusammenzubringen. Medien bieten dafür Aufmerksamkeit im Tausch gegen Information, Präsenz wird zur Machtwährung. Dabei genügt es, dass alle den Medien Macht unterstellen: Diese „als-ob-Macht“ lässt Politiker so handeln, als ob die Medien entschieden. Verstärkt wird der Trend, weil die Traditionsbindungen der Wähler an Parteien schwächer werden. Kurzfristige, medienvermittelte Eindrücke gewinnen an Gewicht, und Politiker müssen um jede Stimme neu werben.",
 "Die Folgen sind problematisch. Medien betreiben Agenda-Setting und verstärken Stimmungen. Passen sich Politiker zudem ganz der Selektionslogik mit ihren Nachrichtenwerten und der Präsentationslogik des Politainments an, wird Politik zu einer Form der Unterhaltung. Es entsteht „politics without policy“: Es geht um Machtfragen statt um Sachfragen. Bürger erkennen in Talkshows dann nur noch ein taktisches Verhältnis der Politiker zur Politik, was Vertrauen kostet.",
 "Gegen die These spricht jedoch, dass der größte Teil der Entscheidungspolitik weiterhin abseits der Öffentlichkeit stattfindet. Gesetzentwürfe entstehen überwiegend in den Referaten der Bundesministerien, und zustimmungspflichtige Gesetze werden zwischen Bund und Ländern ausgehandelt. Diese Prozesse sind kaum medientauglich und trotzdem entscheidend für die Inhalte. Auch Korte und Fröhlich rücken mit der Exekutive gerade diese Ebene ins Zentrum. Zudem kann gute Darstellung eine Entscheidung erst möglich machen, indem sie Unterstützung mobilisiert. Darstellung und Entscheidung konkurrieren also nicht nur, sie ergänzen sich auch.",
 "Im Ergebnis beschreibt die These eine wichtige Verschiebung: Darstellung gewinnt an Gewicht, und eine Regierung ohne kommunikative Macht kann kaum noch regieren. Von einem Ersetzen kann aber keine Rede sein, solange die eigentlichen Weichen in Ministerien und Verhandlungsrunden gestellt werden. Treffender ist, dass Darstellungs- und Entscheidungspolitik heute eng verzahnt sind. Erfolgreiches Regieren muss beides beherrschen."]},
 {id:"se1-e4", ch:101, kind:"lang", short:"Politische Kultur und Stabilität",
  q:"Erläutern Sie, warum die politische Kultur für die Stabilität eines politischen Systems bedeutsam ist, und beurteilen Sie die Entwicklung der Bundesrepublik mit Hilfe der Typologie von Lipset.",
  op:"„Erläutern“: Begriff und Kernannahme erklären, Konzepte darstellen. „Beurteilen“: Lipsets Raster auf die Bundesrepublik anwenden und ein begründetes Urteil fällen.",
  gl:["<b>Einleitung:</b> gleiche Institutionen, unterschiedliche Stabilität (Weimar und Bonn). Frage und These.",
   "<b>Begriff:</b> Einstellungen und Werte der Bürger, analytisch. Kongruenz von Kultur und Struktur.",
   "<b>Almond/Verba:</b> Typen, Civic Culture, allegiance gegen apathy und alienation.",
   "<b>Lipset und Easton:</b> Legitimität und Effektivität, diffuse und spezifische Unterstützung.",
   "<b>Anwendung:</b> Bundesrepublik von C zu A, heute Kritik an Autoritäten bei stabiler Demokratiezustimmung.",
   "<b>Fazit:</b> Kultur als Fundament, Leistung als Brücke dorthin."],
  k:["Politische Kultur als Einstellungen und Wertorientierungen definiert, analytisch statt wertend",
   "Kongruenz von Kultur und Struktur als Bedingung für Stabilität",
   "Almond/Verba mit Civic Culture oder den Typen erklärt",
   "Lipsets Raster aus Legitimität und Effektivität korrekt dargestellt",
   "Anwendung auf die Bundesrepublik (Weg von C zu A)",
   "Diffuse und spezifische Unterstützung oder heutiger Befund einbezogen",
   "Begründetes Urteil"],
  m:[
 "Die Weimarer Republik und die Bundesrepublik hatten beide demokratische Verfassungen, doch nur eine von ihnen überdauerte. Institutionen allein erklären die Stabilität eines Systems also nicht. Die politische Kulturforschung fragt deshalb nach der subjektiven Seite der Politik, nach dem, was Bürger über ihr System denken und fühlen. Dieser Essay erläutert, warum politische Kultur für die Stabilität entscheidend ist, und zeigt mit Lipsets Typologie, dass die Bundesrepublik ihre Stabilität erst über ihre Leistungen gewonnen hat.",
 "Politische Kultur meint nach Pickel und Pickel (2016) die auf politische Objekte gerichteten Einstellungen und Wertorientierungen der Bürger, betrachtet als Kollektiv. Der Begriff ist analytisch, nicht wertend: Jedes Land hat eine politische Kultur, die Frage ist nur, welche. Die Kernannahme lautet, dass ein System stabil ist, wenn Kultur und Struktur zueinander passen. Demokratische Institutionen brauchen eine demokratische Kultur, also eine breite Mehrheit überzeugter Demokraten und keine größere Gruppe, die das System aktiv ablehnt.",
 "Almond und Verba haben das 1963 erstmals vergleichend untersucht, unter anderem in der Bundesrepublik. Sie unterscheiden die parochiale Kultur ohne Bezug zum System, die Untertanenkultur, in der Bürger nur die Leistungen bewerten, und die partizipative Kultur. Als Vorbild gilt ihnen aber ein Mischtyp, die Civic Culture: Bürger beteiligen sich aktiv, zeigen aber auch Folgebereitschaft, die das System regierbar hält. Passen Kultur und Struktur zusammen, entsteht Verbundenheit (allegiance). Fehlt die Passung, drohen Gleichgültigkeit (apathy) oder Entfremdung (alienation).",
 "Seymour Lipset bezieht zusätzlich die Leistung des Systems ein. Er kombiniert Legitimität, die langfristige Überzeugung von der Anerkennungswürdigkeit des Systems, mit Effektivität, der kurzfristigen Bewertung seiner Leistungen. Ein legitimes und effektives System ist stabil (A). Ein legitimes, aber ineffektives System zehrt in einer Krise von seinem Legitimitätsvorschuss (B). Ein effektives, aber nicht legitimes System lebt nur von seinen Erfolgen (C), ein System ohne beides steht vor dem Zusammenbruch (D). Ähnlich unterscheidet David Easton diffuse Unterstützung, die dem System um seiner selbst willen gilt, und spezifische Unterstützung für Leistungen und Amtsträger.",
 "Die Bundesrepublik ist das klassische Beispiel für den Weg von C nach A. In den ersten Jahren war die Demokratie für viele Bürger noch nicht verankert, ihre Akzeptanz beruhte vor allem auf dem wirtschaftlichen Aufschwung. Erst der dauerhafte Erfolg verwandelte diese Effektivität in Legitimität. Heute zeigt sich ein gemischtes Bild: Die Zustimmung zur Demokratie als Staatsform ist sehr hoch, das Vertrauen in Politiker und Parteien gering. Nach Easton ist das eine schwache spezifische, aber starke diffuse Unterstützung. Nach Lipset liegt die Bundesrepublik damit in Feld A, bei anhaltender Unzufriedenheit allenfalls in Feld B, aber nicht in einer Legitimitätskrise.",
 "Die politische Kultur ist somit das Fundament der Stabilität, weil sie ein System auch durch Krisen trägt, in denen die Leistungen ausbleiben. Die Bundesrepublik zeigt aber, dass Leistung der Weg zu diesem Fundament sein kann. Gefährlich würde es erst, wenn eine lange Effektivitätskrise die diffuse Unterstützung angreift und sich die Unzufriedenheit mit Politikern in eine Ablehnung der Demokratie verwandelt."]},
 {id:"se1-e5", ch:101, kind:"lang", short:"Nutzen des Policy-Zyklus",
  q:"Erläutern Sie das Modell des Policy-Zyklus und beurteilen Sie seinen Nutzen für die Analyse deutscher Politik.",
  op:"„Erläutern“: Phasen mit Merkmalen und Beispiel darstellen. „Beurteilen“: Stärken und Schwächen abwägen, Fazit zum Nutzen.",
  gl:["<b>Einleitung:</b> Gesetze entstehen nicht aus dem Nichts. Frage nach dem Nutzen des Modells.",
   "<b>Herkunft:</b> Eastons Input-Output-Modell, Politik als Problemverarbeitung.",
   "<b>Phasen:</b> Problemdefinition und Agenda-Setting (Ist-Soll, policy window), Programmformulierung (Ministerialreferate), Implementation (Programmtypen), Evaluation als Rückkopplung.",
   "<b>Stärken:</b> ordnet Komplexität, zeigt, dass Politik nicht mit dem Gesetz endet.",
   "<b>Schwächen:</b> Phasen überlappen, kein Kausalmodell, Akteure und Lernen fehlen, mehrere Ebenen in Deutschland.",
   "<b>Fazit:</b> nützliche Heuristik, Erklärung braucht Akteurs- und Institutionenansätze."],
  k:["Policy-Zyklus als Phasenmodell der Problemverarbeitung, Bezug zu Easton",
   "Problemdefinition und Agenda-Setting erklärt (z. B. Ist-Soll, knappe Aufmerksamkeit, policy window)",
   "Programmformulierung und Implementation erklärt",
   "Evaluation und Terminierung als Rückkopplung",
   "Anwendung auf ein Beispiel oder auf deutsche Besonderheiten (Ministerialreferate, Föderalismus)",
   "Kritik: kein Kausalmodell, Überlappung, Akteure fehlen",
   "Urteil: Heuristik mit Grenzen"],
  m:[
 "Gesetze entstehen nicht aus dem Nichts. Bevor etwa ein Gesetz zum Kita-Ausbau verabschiedet wird, muss jemand ein Problem erkennen, es auf die Tagesordnung bringen und eine Lösung ausarbeiten, und danach muss das Gesetz vor Ort umgesetzt werden. Diesen Ablauf beschreibt das Modell des Policy-Zyklus. Dieser Essay stellt es nach Schneider und Janning (2006) vor und vertritt die These, dass es für die Analyse deutscher Politik eine nützliche Ordnungshilfe ist, aber keine Erklärung liefert.",
 "Der Policy-Zyklus geht auf Eastons Systemmodell zurück, in dem das politische System Inputs aus der Umwelt zu Outputs verarbeitet. Er zerlegt diesen Prozess in Phasen. Am Anfang steht die Problemdefinition. Ein Problem ist eine Diskrepanz zwischen Ist und Soll und hat damit eine faktische und eine normative Seite. Es muss zudem erst wahrgenommen werden: Umweltschäden gab es lange, bevor sie zum politischen Thema wurden. Weil politische Aufmerksamkeit knapp ist, konkurrieren Themen um die Agenda. Ereignisse wie Unfälle können ein kurzes Gelegenheitsfenster öffnen, das Kingdon policy window nennt.",
 "In der Programmformulierung werden Ziele, Adressaten, Träger und Mittel festgelegt, meist in Gesetzen oder Verordnungen. In Deutschland entstehen etwa 80 Prozent der Entwürfe in einem Referat eines Bundesministeriums, dort fallen die strategischen Vorentscheidungen. Weil Wissen und klare Ziele oft fehlen, wählen Planer eher kleine Schritte oder übernehmen Lösungen anderer Länder. In der Implementation zeigt sich dann, ob das Programm wirkt. Regulative Programme rufen Widerstand hervor, Anreizprogramme erzeugen Mitnahmeeffekte, Leistungsprogramme sichern nur das Angebot. Die Evaluation prüft schließlich Wirkung und Effizienz und führt zu Fortsetzung, Änderung oder Beendigung.",
 "Der Nutzen des Modells liegt darin, dass es die Komplexität der Politik in überschaubare Abschnitte teilt. Es lenkt den Blick darauf, dass Politik mit der Verabschiedung eines Gesetzes nicht endet, und macht Vollzugsprobleme sichtbar. Für die Analyse eines konkreten Gesetzes bietet es ein klares Raster: Wie kam das Thema auf die Agenda, wer schrieb das Programm, wer setzt es um? Zahlreiche Studien zu einzelnen Phasen sind so entstanden.",
 "Seine Grenzen sind jedoch erheblich. In der Wirklichkeit überlappen sich die Phasen und laufen parallel auf mehreren Ebenen ab. Gerade im deutschen Föderalismus setzen die Länder die meisten Bundesgesetze um, sodass Formulierung und Implementation eng verflochten sind. Akteure, die bei der Formulierung unterlegen waren, versuchen zudem, die Umsetzung in ihrem Sinn zu verändern. Vor allem ist der Zyklus kein Kausalmodell: Er sagt nicht, welche Akteure den Prozess antreiben und warum, und er vernachlässigt das Lernen der Beteiligten.",
 "Der Policy-Zyklus ist deshalb als Heuristik wertvoll, als Theorie aber unzureichend. Wer deutsche Politik erklären will, muss ihn mit Ansätzen verbinden, die Akteure und Institutionen in den Blick nehmen, etwa dem Vetospieleransatz oder der Analyse von Akteurkonstellationen und Netzwerken. Als erstes Ordnungsraster für eine Analyse bleibt er aber unverzichtbar."]}
);

/* Start: erst sofort zeigen, dann mit den anderen Geräten abgleichen */
/* Zoom gilt pro Gerät (nicht synchronisiert) */
(function(){ let z=parseFloat(lsGet("p1-zoom"))||1;
  const apply=()=>{ document.documentElement.style.setProperty("--z",z); lsSet("p1-zoom",String(z)); };
  apply();
  document.getElementById("zIn").onclick=()=>{ z=Math.min(1.8,Math.round((z+.1)*10)/10); apply(); };
  document.getElementById("zOut").onclick=()=>{ z=Math.max(.8,Math.round((z-.1)*10)/10); apply(); };
})();

<script>
/* Update-Check: Beim Start und beim Zurückkehren in die App wird version.txt (von build.py erzeugt) mit der eigenen Version verglichen.
   Beim Start lädt die App eine neue Version sofort. Beim Zurückkehren nur, wenn gerade nichts läuft;
   mitten in Karten, Aufgaben oder Probeklausur erscheint stattdessen ein Hinweis zum Antippen. Der Lernstand liegt im Gerät und wird vorher abgeglichen. */
(function(){
  var V="dcfd36f2fe38", BUSY=["task","exam","essay","graph","kurz","lesson","cards","kreuz","recall","who","outline"];
  function busy(){ try{ return BUSY.indexOf(view)>=0; }catch(e){ return false; } }
  function syncing(){ try{ return !!(pushTimer||pushing); }catch(e){ return false; } }
  function reload(t){ try{ sessionStorage.setItem("upd-"+t,"1"); }catch(e){} location.replace(location.pathname+"?v="+t+location.hash); }
  function safeReload(t,n){ if(syncing()&&(n||0)<10){ try{ flushPush(); }catch(e){} setTimeout(function(){ safeReload(t,(n||0)+1); },600); } else reload(t); }
  function bar(t){ if(document.getElementById("updbar")) return;
    var b=document.createElement("button"); b.id="updbar"; b.type="button"; b.textContent="Neue Version · Tippen zum Laden";
    b.onclick=function(){ b.disabled=true; b.textContent="Wird geladen …"; safeReload(t); }; document.body.appendChild(b); }
  function check(start){
    fetch("version.txt?t="+Date.now(),{cache:"no-store"}).then(function(r){ return r.ok?r.text():""; }).then(function(t){
      t=(t||"").trim(); if(!/^[0-9a-f]{6,40}$/.test(t)||t===V) return;
      var tried=false; try{ tried=!!sessionStorage.getItem("upd-"+t); }catch(e){}
      if(tried) return;                       /* Schutz gegen Endlosschleife, falls GitHub noch die alte Seite liefert */
      if(start||!busy()) safeReload(t); else bar(t);
    }).catch(function(){});
  }
  var st=document.createElement("style");
  st.textContent="#updbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}";
  document.head.appendChild(st);
  check(true);
  document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") check(false); });
})();
</script>
