  }
  const item=KREUZ.find(x=>x.id===K.items[K.i]), all=[0,1,2].every(j=>K.ans[j]!==undefined), ch=chOf(item.ch);
  if(!K.shown) K.prev=kzStat(item.id);
  $("#app").innerHTML=`${backTo(back)}
    <div class="row between"><p class="eyebrow" style="margin:0">Aufgabe ${K.i+1} von ${K.items.length} · Sitzung ${ch.no}</p>${K.prev?`<span class="chip">zuletzt ${K.prev.p}/4</span>`:""}</div>
    <div class="block" style="margin-top:8px"><h3 style="margin:0 0 4px">${item.stem}</h3>${kzBlock(item,K.ans,K.shown,"s",K.gs)}</div>
    ${K.shown?`<div class="row between"><span class="pbadge">${K.pts[K.i]} von 4 Punkten${K.sure[K.i]<K.pts[K.i]?` · ohne Geratenes ${K.sure[K.i]}`:""}</span><button class="btn" id="nx">${K.i<K.items.length-1?"Nächste Aufgabe":"Auswertung"}</button></div>`
      :`<button class="btn" id="ev" style="width:100%" ${all?"":"disabled"}>Auswerten</button><p class="hint">„geraten“ markieren, wenn du nicht sicher bist. Zählt dann nicht als gewusst.</p>`}`;
  bindCrumb(backFn);
  document.querySelectorAll("[data-kz]").forEach(b=>b.onclick=()=>{ K.ans[+b.dataset.kz.split(":").pop()]=b.dataset.v==="1"; const y=window.scrollY; renderKreuz(); window.scrollTo(0,y); });
  document.querySelectorAll("[data-kg]").forEach(b=>b.onclick=()=>{ const j=+b.dataset.kg; K.gs[j]=!K.gs[j]; const y=window.scrollY; renderKreuz(); window.scrollTo(0,y); });
  if($("#ev")) $("#ev").onclick=()=>{ K.pts[K.i]=kzPoints(item,K.ans); const p=kzPoints(item,K.ans,K.gs); K.sure[K.i]=p; K.shown=true;
    const s=kzStat(item.id)||{n:0,best:0}; state.kreuz[item.id]={n:s.n+1,p,best:Math.max(s.best||0,p),t:Date.now()}; logDay(); save(); renderKreuz(); };
  if($("#nx")) $("#nx").onclick=()=>{ K.i++; K.ans={}; K.gs={}; K.shown=false; renderKreuz(); window.scrollTo(0,0); };
}

/* ================= Essay-Trainer =================
   Prüfung Vorlesung: Essay, 60 Minuten am PC. Jede Frage hat
   op  = was der Operator verlangt, gl = Gliederungsvorschlag, k = Erwartungshorizont (zum Abhaken), m = Musteressay (Absätze).
   kind "lang" = Prüfungsfrage für 60 Minuten, "kurz" = Teilfrage für etwa 15 Minuten. */
const essaysOf=n=>n? ESSAYS.filter(x=>x.ch===n) : ESSAYS.filter(x=>isReady(x.ch)&&chOf(x.ch).c===state.course);
const essayScore=id=>(state.essays||{})[id];
const wordCount=t=>{ const s=String(t||"").trim(); return s?s.split(/\s+/).length:0; };
/* Seminar Schwarz: Essay von etwa 500 Wörtern, bewertet nach vier Kriterien (Verlaufsplan).
   Je Kriterium gut / hinreichend / unzureichend; bestanden, wenn keines unzureichend ist.
   Die Stichworte (d) sind eine Lesehilfe, keine Vorgabe von Schwarz. */
const isSE=x=>!!x&&chOf(x.ch).c==="se";
const SE_WORDS=500;
const SE_CRIT=[
 {k:"aufbau", t:"Aufbau und Struktur", d:"Einleitung mit Fragestellung und These, je Absatz ein Gedanke, roter Faden, Fazit beantwortet die Frage"},
 {k:"arg", t:"Argumentation", d:"Behauptungen begründet und belegt, Gegenargument abgewogen, eigene Position folgt aus den Argumenten"},
 {k:"fach", t:"Fachwissen", d:"Begriffe, Konzepte und Autoren korrekt und präzise"},
 {k:"anw", t:"Anwendung des fachspezifischen Wissens", d:"Wissen auf die Frage und ein Beispiel angewendet, nicht nur nacherzählt"}];
const SE_LV=[["g","gut"],["h","hinreichend"],["u","unzureichend"]];
const wcLabel=(t,x)=>{ const n=wordCount(t); if(!isSE(x)) return n+" Wörter"; const d=n<SE_WORDS*.7?" · eher zu kurz":n>SE_WORDS*1.4?" · deutlich zu lang":""; return `${n} von etwa ${SE_WORDS} Wörtern${d}`; };
const sePass=r=>{ if(!r) return null; const v=SE_CRIT.map(c=>r[c.k]); if(v.some(x=>x==="u")) return false; return v.every(Boolean)?true:null; };
function rubricHTML(r,pre){
  const p=sePass(r);
  return `<div class="block"><h3>Die vier Kriterien von Dr. Schwarz</h3><p class="small muted">Stuf jedes Kriterium ehrlich ein. Bestanden ist das Essay, wenn keines „unzureichend“ ist. Die Stichworte sind eine Lesehilfe (Ergänzung).</p>
    ${SE_CRIT.map(c=>`<div class="rub"><p style="margin:10px 0 2px"><b>${c.t}</b></p><p class="small muted" style="margin:0 0 6px">${c.d}</p>
      <div class="row">${SE_LV.map(([v,l])=>`<button class="btn small ${r[c.k]===v?"":"ghost"}" data-rk="${pre}" data-c="${c.k}" data-v="${v}" aria-pressed="${r[c.k]===v}">${l}</button>`).join("")}</div></div>`).join("")}
    <p class="pts" id="${pre}verdict" style="margin-top:12px">${p===true?"Voraussichtlich bestanden":p===false?"Voraussichtlich nicht bestanden":"Noch nicht alle Kriterien eingestuft"}</p></div>`;
}
function bindRubric(r,pre,after){
  document.querySelectorAll(`[data-rk="${pre}"]`).forEach(b=>b.onclick=()=>{ r[b.dataset.c]=b.dataset.v; after(); });
}
const musterHTML=x=>`<p class="small muted">So könnte eine gute Antwort aussehen. Beispiele und Zusatzwissen darin gehen teils über die Folien hinaus.</p><div class="musterp">${x.m.map(p=>`<p>${p}</p>`).join("")}</div>`;
const glHTML=x=>`<ol class="gl">${x.gl.map(g=>`<li>${g}</li>`).join("")}</ol>`;
function pickEssay(n,onlyLong){
  let L=essaysOf(n); if(onlyLong&&L.some(x=>x.kind==="lang")) L=L.filter(x=>x.kind==="lang");
  const w=L.map(x=>{ const s=essayScore(x.id); return !s?4:(s.p<s.max*.75?3:1); });
  let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<L.length;i++){ r-=w[i]; if(r<=0) break; }
  return L[Math.min(i,L.length-1)];
}
function openEssay(n,id){ n=n||0; const x=id?ESSAYS.find(e=>e.id===id):pickEssay(n); cur.es={n, id:x&&x.id, phase:"schreiben", help:false, checks:{}}; go("essay"); }
function claudePrompt(x,text,exam){
  const C=COURSES[chOf(x.ch).c];
  if(isSE(x)) return `Bewerte bitte mein ${exam?"Probe-Essay (60 Minuten, ohne Hilfsmittel)":"Essay"} für die Essayklausur im Seminar „${C.title}“ (Dr. Oliver Schwarz, UDE, Modul Grundlagen Politik I). Vorgaben: ein Essay von etwa 500 Wörtern zu einer von drei Fragen, 60 Minuten, keine Hilfsmittel. Bewertet wird nach vier Kriterien: Aufbau und Struktur, Argumentation, Fachwissen, Anwendung des fachspezifischen Wissens, je mit „gute Leistung“, „hinreichende Leistung“ oder „unzureichende Leistung“. Bestanden ist das Essay, wenn kein Kriterium unzureichend ist.\n\nFrage:\n${x.q}\n\nErwartungshorizont aus meiner Lern-App:\n${x.k.map(k=>"- "+k).join("\n")}\n\nMein Essay (${wordCount(text)} Wörter):\n${text||"(leer)"}\n\nGib mir bitte:\n1. Je Kriterium: gut, hinreichend oder unzureichend, mit einem Satz Begründung.\n2. Bestanden oder nicht?\n3. Fachliche Fehler oder ungenaue Begriffe.\n4. Was ich beim nächsten Mal anders machen sollte, vor allem bei Aufbau und Argumentation.\n5. Einen verbesserten Absatz als Beispiel.`;
  return `Bewerte bitte mein ${exam?"Probe-Essay (60 Minuten, ohne Hilfsmittel)":"Essay"} für die Prüfung der ${C.short} „${C.title}“ (${C.who}, UDE, Modul Grundlagen Politik I). Die echte Prüfung ist ein Essay von 60 Minuten am PC, unbenotet (bestanden oder nicht).\n\nFrage:\n${x.q}\n\nErwartungshorizont aus meiner Lern-App:\n${x.k.map(k=>"- "+k).join("\n")}\n\nMein Essay (${wordCount(text)} Wörter):\n${text||"(leer)"}\n\nGib mir bitte:\n1. Würde das voraussichtlich bestehen? Kurz begründet.\n2. Je Punkt des Erwartungshorizonts: erfüllt, teilweise oder fehlt.\n3. Fachliche Fehler oder ungenaue Begriffe.\n4. Aufbau und Argumentation: was ich beim nächsten Mal anders machen sollte.\n5. Einen verbesserten Absatz als Beispiel.`;
}
function renderEssay(){
  const E=cur.es, n=E.n, back=n?chLabel(n):"Üben", backFn=()=>{ if(n){ cur.ch=n; go("chapter"); } else go("practice"); };
  const x=ESSAYS.find(e=>e.id===E.id), L=essaysOf(n);
  if(!x){ $("#app").innerHTML=`${backTo(back)}<h1>Noch keine Essay-Fragen</h1><p class="muted">Für diesen Bereich gibt es noch keine Fragen.</p>`; bindCrumb(backFn); return; }
  state.drafts=state.drafts||{}; const text=state.drafts[x.id]||"", done=L.filter(y=>essayScore(y.id)).length, last=essayScore(x.id);
  const head=`${backTo(back)}
    <p class="eyebrow">${isSE(x)?"Prüfungsfrage · etwa 500 Wörter":x.kind==="lang"?"Prüfungsfrage · etwa 60 Min.":"Teilfrage · etwa 15 Min."} · Sitzung ${chOf(x.ch).no} · ${done} von ${L.length} bearbeitet</p>
    <div class="block"><p style="margin:0"><b>${x.q}</b></p><p class="small muted" style="margin:8px 0 0">${x.op}</p>${last?`<p class="small muted" style="margin:6px 0 0">Zuletzt: ${last.p} von ${last.max} Punkten des Erwartungshorizonts${last.pass===true?", bestanden":last.pass===false?", nicht bestanden":""}</p>`:""}</div>`;
  if(E.phase==="schreiben"){
    $("#app").innerHTML=`${head}
      <div class="block"><button class="btn ghost small" id="eh">${E.help?"Gliederungshilfe ausblenden":"Gliederungshilfe zeigen"}</button>${E.help?glHTML(x):`<p class="small muted" style="margin:8px 0 0">Versuch es erst ohne. In der Prüfung gibt es keine Hilfe.</p>`}</div>
      <div class="essay"><label class="small muted" for="et">Dein Essay (wird automatisch gespeichert)</label>
        <textarea id="et" style="margin-top:6px">${esc(text)}</textarea><p class="wc" id="ewc">${wcLabel(text,x)}</p></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="ed">Fertig, bewerten</button><button class="btn ghost" id="en">Andere Frage</button></div>`;
    let t=null; $("#et").oninput=e=>{ state.drafts[x.id]=e.target.value; $("#ewc").textContent=wcLabel(e.target.value,x); clearTimeout(t); t=setTimeout(save,1200); };
    $("#eh").onclick=()=>{ E.help=!E.help; const y=window.scrollY; renderEssay(); window.scrollTo(0,y); };
    $("#ed").onclick=()=>{ save(); E.phase="bewerten"; E.r=Object.assign({},(essayScore(x.id)||{}).r||{}); renderEssay(); window.scrollTo(0,0); };
    $("#en").onclick=()=>{ save(); const others=L.filter(y=>y.id!==x.id); openEssay(n, others.length?pick(others).id:x.id); };
  } else {
    const pts=()=>x.k.filter((_,j)=>E.checks[j]).length;
    $("#app").innerHTML=`${head}
      <div class="block"><h3>Erwartungshorizont</h3><p class="small muted">Hake ab, was in deinem Text klar und fachlich richtig vorkommt.</p>
        ${x.k.map((k,j)=>`<label class="check"><input type="checkbox" id="q${j}" ${E.checks[j]?"checked":""}><span>${k}</span></label>`).join("")}
        <p class="pts" id="ep">${pts()} von ${x.k.length}</p>
        <div class="row"><button class="btn" id="es">Speichern</button><button class="btn ghost" id="ecl">Von Claude bewerten lassen</button></div><div id="ecopy"></div></div>
      ${isSE(x)?rubricHTML(E.r=E.r||{},"er"):""}
      <div class="block"><h3>Dein Text</h3>${isSE(x)?`<p class="small muted" style="margin:0 0 6px">${wcLabel(text,x)}</p>`:""}${text.trim()?`<p class="essaytext">${esc(text)}</p>`:`<p class="small muted" style="margin:0">Du hast nichts geschrieben. Lies dir die Gliederung und das Musteressay durch und versuch es danach noch einmal.</p>`}
        <div class="row" style="margin-top:8px"><button class="btn ghost small" id="eb">Weiterschreiben</button>${text.trim()?`<button class="btn ghost small" id="ex">Neu anfangen</button>`:""}</div></div>
      <div class="block"><h3>Gliederungsvorschlag</h3>${glHTML(x)}</div>
      <div class="block lesson"><h3>Musteressay</h3>${musterHTML(x)}</div>
      <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="en">Nächste Frage</button></div>`;
    document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ E.checks[+c.id.slice(1)]=c.checked; $("#ep").textContent=`${pts()} von ${x.k.length}`; });
    if(isSE(x)) bindRubric(E.r,"er",()=>{ const y=window.scrollY; renderEssay(); window.scrollTo(0,y); });
    $("#es").onclick=()=>{ state.essays[x.id]=Object.assign({p:pts(),max:x.k.length,t:Date.now(),w:wordCount(text)}, isSE(x)?{r:Object.assign({},E.r),pass:sePass(E.r)}:{}); logDay(); save(); toast(`${pts()} von ${x.k.length} gespeichert`); renderEssay(); };
    $("#ecl").onclick=()=>copyForClaude(claudePrompt(x,text,false),"#ecopy");
    $("#eb").onclick=()=>{ E.phase="schreiben"; renderEssay(); };
    if($("#ex")) $("#ex").onclick=()=>{ const b=$("#ex"); if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Text wirklich löschen"; return; } delete state.drafts[x.id]; save(); E.phase="schreiben"; E.checks={}; renderEssay(); };
    $("#en").onclick=()=>{ const others=L.filter(y=>y.id!==x.id); openEssay(n, others.length?pick(others).id:x.id); };
  }
  bindCrumb(backFn);
}

/* ---------- Probe-Essay: 60 Minuten, keine Hilfen ---------- */
let examTimer=null, examSaveT=null;
function examSave(){ clearTimeout(examSaveT); examSaveT=setTimeout(()=>save(),1200); }
function examLeft(){ const e=state.examRun; return e? e.start+e.min*60000-Date.now() : 0; }
const mmss=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
/* Seminar: drei Fragen zur Wahl, möglichst aus verschiedenen Sitzungen, Ungeübte bevorzugt */
function pickThree(){
  const L=shuffle(essaysOf(0).filter(x=>x.kind==="lang")).sort((a,b)=>(essayScore(a.id)?1:0)-(essayScore(b.id)?1:0));
  const out=[], used=new Set();
  L.forEach(x=>{ if(out.length<3&&!used.has(x.ch)){ out.push(x.id); used.add(x.ch); } });
  L.forEach(x=>{ if(out.length<3&&!out.includes(x.id)) out.push(x.id); });
  return out;
}
function renderExam(){
  clearInterval(examTimer);
  const e=state.examRun;
  if(!e){
    const hist=(state.exams||[]).filter(h=>(h.c||"vl")===state.course).slice(-6).reverse(), ready=essaysOf(0).length;
    $("#app").innerHTML=`${backTo("Üben")}<p class="eyebrow">${COURSES[state.course].short} · Probe-Essay</p><h1>Probe-Essay</h1>
      <div class="block">${state.course==="se"?`<p>Wie in der Essayklausur am 04.02.: Du bekommst <b>drei Fragen</b> aus den fertigen Sitzungen, wählst eine und schreibst <b>etwa 500 Wörter</b> in <b>60 Minuten</b>. Die Uhr läuft ab dem Start, auch während du wählst. Keine Gliederungshilfe, kein Musteressay.</p>
        <p class="small muted">Danach stufst du die vier Kriterien von Dr. Schwarz ein und hakst den Erwartungshorizont ab, oder lässt Claude bewerten. Der Text wird laufend gespeichert.</p>`:`<p>Wie in der Prüfung am 04.02.: Du bekommst eine Frage aus den Sitzungen, die schon fertig sind, und hast <b>60 Minuten</b>. Keine Gliederungshilfe, kein Musteressay. Der Text wird laufend gespeichert, auch wenn du die App zwischendurch schließt.</p>
        <p class="small muted">Danach bewertest du selbst am Erwartungshorizont oder lässt Claude bewerten. Plane 5 bis 10 Minuten für die Gliederung ein, bevor du losschreibst.</p>`}
        ${ready?`<div class="row"><button class="btn" id="xs">Starten (60 Min.)</button><button class="btn ghost" id="xs30">Kurz üben (30 Min.)</button></div>`:`<p class="small muted">Noch keine Fragen vorhanden.</p>`}</div>
      ${hist.length?`<div class="block"><h3>Bisherige Probe-Essays</h3>${hist.map(h=>`<div class="srow"><span>${new Date(h.t).toLocaleDateString("de-DE",{day:"numeric",month:"numeric"})}</span><span class="small muted">${esc(h.title||"")}${h.w?" · "+h.w+" Wörter":""}</span><span class="pts">${h.pass===true?"bestanden":h.pass===false?"nicht bestanden":h.p+"/"+h.max}</span></div>`).join("")}</div>`:""}`;
    bindCrumb(()=>go("practice"));
    const start=min=>{
      if(state.course==="se"){ const opts=pickThree(); state.examRun={id:opts.length===1?opts[0]:null,opts,c:"se",start:Date.now(),min,text:"",checks:{},r:{}}; }
      else { const x=pickEssay(0,true); state.examRun={id:x.id,c:state.course,start:Date.now(),min,text:"",checks:{}}; }
      save(); renderExam(); window.scrollTo(0,0); };
    if($("#xs")) $("#xs").onclick=()=>start(60);
    if($("#xs30")) $("#xs30").onclick=()=>start(30);
    return;
  }
  if(!e.id&&e.opts&&e.opts.length){
    const O=e.opts.map(id=>ESSAYS.find(y=>y.id===id)).filter(Boolean);
    $("#app").innerHTML=`<div class="etop"><span class="small muted">Probe-Essay · ${e.min} Min.</span><span class="clock" id="clock">${mmss(examLeft())}</span></div>
      <h1>Wähle eine Frage</h1><p class="small muted">Lies alle drei. Nimm die, zu der dir Autoren, Begriffe und ein Beispiel einfallen.</p>
      ${O.map((y,i)=>`<div class="block"><p class="eyebrow">Frage ${i+1} · Sitzung ${chOf(y.ch).no}</p><p style="margin:0 0 10px"><b>${y.q}</b></p><button class="btn ghost small" data-pick="${y.id}">Diese Frage schreiben</button></div>`).join("")}
      <div class="row" style="margin:8px 0 16px"><button class="btn ghost small" id="xq">Abbrechen</button></div>`;
    document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ e.id=b.dataset.pick; save(); renderExam(); window.scrollTo(0,0); });
    $("#xq").onclick=()=>{ state.examRun=null; save(); renderExam(); };
    examTimer=setInterval(()=>{ const c=$("#clock"); if(!c||view!=="exam"){ clearInterval(examTimer); return; } const l=examLeft(); c.textContent=l>0?mmss(l):"Zeit um"; if(l<=0) c.style.color="var(--bad)"; },1000);
    return;
  }
  const x=ESSAYS.find(y=>y.id===e.id);
  if(!x){ state.examRun=null; save(); renderExam(); return; }
  if(e.phase!=="grade"){
    $("#app").innerHTML=`<div class="etop"><span class="small muted">Probe-Essay · ${e.min} Min.</span><span class="clock" id="clock">${mmss(examLeft())}</span></div>
      <div class="block"><p style="margin:0"><b>${x.q}</b></p></div>
      <div class="essay"><textarea id="xt" style="min-height:22rem" placeholder="Erst gliedern, dann schreiben …">${esc(e.text||"")}</textarea><p class="wc" id="xwc">${wcLabel(e.text,x)}</p></div>
      <div class="row" style="margin:8px 0 16px"><button class="btn" id="xg">Abgeben</button><button class="btn ghost small" id="xq">Abbrechen</button></div>`;
    $("#xt").oninput=ev=>{ e.text=ev.target.value; $("#xwc").textContent=wcLabel(e.text,x); examSave(); };
    $("#xg").onclick=()=>{ const b=$("#xg"); if(examLeft()>0&&!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Wirklich abgeben?"; return; } e.used=Date.now()-e.start; e.phase="grade"; save(); renderExam(); window.scrollTo(0,0); };
    $("#xq").onclick=()=>{ const b=$("#xq"); if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Wirklich abbrechen (Text geht verloren)"; return; } state.examRun=null; save(); renderExam(); };
    examTimer=setInterval(()=>{ const c=$("#clock"); if(!c||view!=="exam"){ clearInterval(examTimer); return; } const l=examLeft(); c.textContent=l>0?mmss(l):"Zeit um"; if(l<=0) c.style.color="var(--bad)"; },1000);
    return;
  }
  const pts=()=>x.k.filter((_,j)=>e.checks[j]).length;
  $("#app").innerHTML=`<p class="eyebrow">Probe-Essay · Bewertung · ${Math.min(e.min,Math.round((e.used||0)/60000))} von ${e.min} Minuten genutzt · ${wordCount(e.text)} Wörter</p>
    <div class="block"><p style="margin:0"><b>${x.q}</b></p></div>
    <div class="block"><h3>Dein Essay</h3>${(e.text||"").trim()?`<p class="essaytext">${esc(e.text)}</p>`:`<p class="small muted" style="margin:0">Kein Text.</p>`}</div>
    <div class="block"><h3>Erwartungshorizont</h3><p class="small muted">Streng abhaken: nur, was wirklich im Text steht.</p>
      ${x.k.map((k,j)=>`<label class="check"><input type="checkbox" id="g${j}" ${e.checks[j]?"checked":""}><span>${k}</span></label>`).join("")}
      <p class="pts" id="gp">${pts()} von ${x.k.length}</p>
      <div class="row"><button class="btn ghost" id="gcl">Von Claude bewerten lassen</button></div><div id="gcopy"></div></div>
    ${isSE(x)?rubricHTML(e.r=e.r||{},"xr"):""}
    <div class="block"><h3>Gliederungsvorschlag</h3>${glHTML(x)}</div>
    <div class="block lesson"><h3>Musteressay</h3>${musterHTML(x)}</div>
    <div class="row" style="margin-bottom:20px"><button class="btn" id="gs">Ergebnis speichern und beenden</button></div>`;
  if(isSE(x)) bindRubric(e.r,"xr",()=>{ examSave(); const y=window.scrollY; renderExam(); window.scrollTo(0,y); });
  document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ e.checks[+c.id.slice(1)]=c.checked; $("#gp").textContent=`${pts()} von ${x.k.length}`; examSave(); });
  $("#gcl").onclick=()=>copyForClaude(claudePrompt(x,e.text,true),"#gcopy");
  $("#gs").onclick=()=>{ state.exams=state.exams||[]; const extra=isSE(x)?{r:Object.assign({},e.r),pass:sePass(e.r)}:{};
    state.exams.push(Object.assign({t:Date.now(),c:e.c,id:x.id,title:x.short||"",p:pts(),max:x.k.length,w:wordCount(e.text),min:e.min},extra));
    const s=essayScore(x.id); if(!s||pts()>=s.p) state.essays[x.id]=Object.assign({p:pts(),max:x.k.length,t:Date.now(),w:wordCount(e.text)},extra);
    state.examRun=null; logDay(); save(); toast("Gespeichert"); renderExam(); window.scrollTo(0,0); };
}

/* ---------- Gliederung in 10 Minuten: der erste Schritt jedes Essays als tägliche Übung ----------
   Prüfungsfrage lesen, nur die Gliederung schreiben, dann mit dem Gliederungsvorschlag (gl) abgleichen.
   Ergebnis in state.outl[id] = {p, max, n, t}. Der Text kann als Anfang ins ganze Essay übernommen werden. */
let outlineTimer=null;
function pickOutline(n){
  let L=essaysOf(n); if(L.some(x=>x.kind==="lang")) L=L.filter(x=>x.kind==="lang");
  const o=state.outl||{}; return L.slice().sort((a,b)=>((o[a.id]||{}).t||0)-((o[b.id]||{}).t||0)||Math.random()-.5)[0];
}
function openOutline(n,id){ n=n||0; const x=id?ESSAYS.find(e=>e.id===id):pickOutline(n); cur.ol={n, id:x&&x.id, phase:"write", t0:Date.now(), text:"", checks:{}}; go("outline"); }
function renderOutline(){
  clearInterval(outlineTimer);
  const O=cur.ol, n=O.n, back=n?chLabel(n):"Üben", backFn=()=>{ if(n){ cur.ch=n; go("chapter"); } else go("practice"); };
  const x=ESSAYS.find(e=>e.id===O.id);
  if(!x){ $("#app").innerHTML=`${backTo(back)}<h1>Noch keine Prüfungsfragen</h1>`; bindCrumb(backFn); return; }
  const last=(state.outl||{})[x.id];
  const head=`${backTo(back)}<p class="eyebrow">Gliederung in 10 Minuten · Sitzung ${chOf(x.ch).no}${last?` · zuletzt ${last.p} von ${last.max}`:""}</p>
    <div class="block"><p style="margin:0"><b>${x.q}</b></p></div>`;
  if(O.phase==="write"){
    $("#app").innerHTML=`${head}
      <div class="block"><p class="small" style="margin:0 0 6px"><b>Auftrag:</b> Schreib nur die Gliederung: Einleitung, drei bis fünf Schritte, Fazit. Zu jedem Schritt Stichworte und die Autoren, die du nennen würdest. Kein ganzer Text.</p>
        <p class="small muted" style="margin:0">Operator: ${x.op}</p></div>
      <div class="etop"><span class="small muted">Richtwert 10 Minuten</span><span class="clock otime" id="otime">10:00</span></div>
      <div class="essay"><textarea id="ot" style="min-height:14rem" placeholder="1. Einleitung: …&#10;2. …&#10;3. …&#10;4. Fazit: …">${esc(O.text)}</textarea></div>
      <div class="row" style="margin-top:8px"><button class="btn" id="oDone">Mit dem Vorschlag vergleichen</button><button class="btn ghost" id="oOther">Andere Frage</button></div>`;
    $("#ot").oninput=e=>{ O.text=e.target.value; };
    $("#oDone").onclick=()=>{ O.used=Date.now()-O.t0; O.phase="compare"; renderOutline(); window.scrollTo(0,0); };
    $("#oOther").onclick=()=>{ const L=essaysOf(n).filter(y=>y.id!==x.id&&y.kind===x.kind); openOutline(n,L.length?pick(L).id:x.id); };
    outlineTimer=setInterval(()=>{ const c=$("#otime"); if(!c||view!=="outline"){ clearInterval(outlineTimer); return; } const l=O.t0+600000-Date.now(); c.textContent=l>0?mmss(l):"Zeit um"; if(l<=0) c.style.color="var(--bad)"; },1000);
  } else {
    const pts=()=>x.gl.filter((_,j)=>O.checks[j]).length;
    $("#app").innerHTML=`${head}
      <div class="block"><h3>Deine Gliederung</h3>${O.text.trim()?`<p class="essaytext">${esc(O.text)}</p>`:`<p class="small muted" style="margin:0">Leer. Lies den Vorschlag und versuch es morgen noch einmal.</p>`}
        <p class="small muted" style="margin:6px 0 0">${(m=>m===1?"1 Minute":m+" Minuten")(Math.max(1,Math.round((O.used||0)/60000)))} gebraucht.</p></div>
      <div class="block"><h3>Vorschlag: Was davon steckt in deiner Gliederung?</h3>
        ${x.gl.map((g,j)=>`<label class="check"><input type="checkbox" id="g${j}" ${O.checks[j]?"checked":""}><span>${g}</span></label>`).join("")}
        <p class="pts" id="op">${pts()} von ${x.gl.length}</p>
        <div class="row"><button class="btn" id="oSave">Speichern</button><button class="btn ghost" id="oEssay">Daraus das ganze Essay schreiben</button></div></div>
      <div class="block"><h3>Worauf es bei dieser Frage ankommt</h3><ul class="gl">${x.k.map(k=>`<li>${inl(k)}</li>`).join("")}</ul></div>
      ${sess?`<div class="row" style="margin-bottom:14px">${sessBtn()}</div>`:""}`;
    document.querySelectorAll(".check input").forEach(c=>c.onchange=()=>{ O.checks[+c.id.slice(1)]=c.checked; $("#op").textContent=`${pts()} von ${x.gl.length}`; });
    const store=()=>{ if(O.saved) return; const h=state.outl[x.id]||{n:0}; state.outl[x.id]={p:pts(),max:x.gl.length,n:h.n+1,t:Date.now()}; O.saved=true; logDay(); save(); };
    $("#oSave").onclick=()=>{ store(); toast(`${pts()} von ${x.gl.length} gespeichert`); if(sess) sessNext(); else renderOutline(); };
    $("#oEssay").onclick=()=>{ store(); state.drafts=state.drafts||{}; if(!(state.drafts[x.id]||"").trim()&&O.text.trim()){ state.drafts[x.id]=O.text.trim()+"\n\n"; save(); } openEssay(n,x.id); };
  }
  bindCrumb(backFn);
}

{id:"v1-1", t:"Was ist Politik?", html:`
<p>Politik ist nicht nur das, was im Bundestag passiert. Schwanholz beginnt mit zwei Bildern: dem Bundespräsidenten, der mit Familien in einer Schlange im Wahllokal steht, und einer Großdemonstration gegen Stuttgart 21. Beides ist Politik. Was haben die beiden Bilder gemeinsam?</p>
<div class="quote">Politik ist soziales Handeln, das auf Entscheidungen und Steuerungsmechanismen ausgerichtet ist, die <b>allgemein verbindlich</b> sind und das Zusammenleben von Menschen regeln.<cite>Bernauer et al. 2009, S. 32</cite></div>
<p>Der Kern ist das Wort <b>allgemein verbindlich</b>: Eine Entscheidung gilt für alle, auch für die, die dagegen waren. Ein Vereinsbeschluss bindet nur Mitglieder, ein Gesetz bindet alle.</p>
<h3>Merkmale politischer Realität</h3>
<table class="kvq">
<tr><td><b>Ebenen</b></td><td>lokal, regional, national, europäisch, international</td></tr>
<tr><td><b>Akteure</b></td><td>individuelle (z. B. Bundeskanzler) und kollektive (z. B. Kabinett, Parteien, Fraktionen)</td></tr>
<tr><td><b>Institutionen und Organe</b></td><td>z. B. Regierung, Parlament, Verfassungsgericht</td></tr>
<tr><td><b>Verfahren</b></td><td>z. B. demokratische Wahlen, Gesetzgebung, Normenkontrollverfahren</td></tr></table>
<div class="litbox"><b>Lektüre: Patzelt (2023, Kap. 1)</b>Patzelt definiert ähnlich: Politik ist menschliches Handeln, das auf die <b>Herstellung und Durchsetzung allgemein verbindlicher Regelungen und Entscheidungen</b> in und zwischen Gruppen zielt. Dabei wirken immer vier Dinge zusammen, das <b>MINK-Schema</b>: <b>M</b>acht (nach Max Weber die Chance, den eigenen Willen auch gegen Widerstreben durchzusetzen), <b>I</b>deologie, <b>N</b>ormen und <b>K</b>ommunikation.</div>
<div class="ergbox"><b>Ergänzung: Normenkontrolle</b>Ein Normenkontrollverfahren ist ein Verfahren vor dem Bundesverfassungsgericht, in dem geprüft wird, ob ein Gesetz mit dem Grundgesetz vereinbar ist. Kommt in Sitzung 5 (Verfassungsorgane) wieder.</div>`,

{id:"v1-2", t:"Polity, Politics, Policy", html:`
<p>Das Deutsche hat ein Wort für Politik, das Englische drei. Die Politikwissenschaft nutzt diese drei Wörter, um Politik in drei Dimensionen zu zerlegen: die <b>Dreifachgliederung des Politischen</b>.</p>
<table class="kvq">
<tr><th>Dimension</th><th>Was gemeint ist</th><th>Stichworte</th></tr>
<tr><td><b>Polity</b></td><td>Form: das Regelwerk für Politik, die Grundlagen des Gemeinwesens</td><td>Verfassung, Staat, politisches System</td></tr>
<tr><td><b>Politics</b></td><td>Prozess: wie um Entscheidungen gerungen wird</td><td>Interesse, Akteur, Kommunikation, Legitimation, Macht</td></tr>
<tr><td><b>Policy</b></td><td>Inhalt: Handlungsprogramme, also was entschieden wird</td><td>Problem, Programm, Erfolg</td></tr></table>
<div class="merk"><b>Eselsbrücke</b>Polit<b>y</b> wie <b>Y</b>-Rahmen: das Gerüst. Polit<b>ics</b> wie „Kampf“: der Streit. Polic<b>y</b> wie Police (Versicherungspolice): das Programm, das am Ende auf dem Papier steht.</div>
<div class="ergbox"><b>Ergänzung: Beispiel G9 in NRW</b>
<b>Polity:</b> Bildung ist nach dem Grundgesetz Ländersache, also entscheidet der Landtag NRW über das Schulgesetz.<br>
<b>Politics:</b> Elterninitiativen, Lehrerverbände und Parteien streiten jahrelang über G8 oder G9, es gibt Anhörungen und Mehrheiten im Landtag.<br>
<b>Policy:</b> Das beschlossene Programm: Gymnasien kehren zu neun Jahren bis zum Abitur zurück.</div>
<p class="small muted">Für deinen GL-Unterricht: Der Klassenrat zeigt alle drei Dimensionen im Kleinen. Die Klassenratsregeln sind die Polity, die Diskussion ist Politics, der Beschluss (etwa eine Pausenregel) ist die Policy.</p>`,

{id:"v1-3", t:"Was ist Politikwissenschaft?", html:`
<p>Bevor es um Politikwissenschaft geht, klärt Schwanholz, was Wissenschaft überhaupt ist.</p>
<div class="quote">Wissenschaft zielt auf Aussagen, die an <b>empirischem und logischem Wahrheitsgehalt</b> dem überlegen sind, was schon der „gesunde Menschenverstand“ formulieren kann.<cite>sinngemäß nach Patzelt 2007</cite></div>
<h3>Arten wissenschaftlicher Aussagen</h3>
<ul><li>Beschreibungen</li><li>Aussagen über Zusammenhänge</li><li>Erklärungen</li><li>Prognosen</li><li>Werturteile</li><li>Empfehlungen oder Handlungsanweisungen</li></ul>
<h3>Politikwissenschaft</h3>
<p>Nach <b>Schmidt (2010)</b> ist Politikwissenschaft die Wissenschaft von der Politik, also die wissenschaftliche <b>Beschreibung, Erklärung oder Prognose</b> politischer Phänomene auf Basis wissenschaftlich fundierter Analysen. Sie</p>
<ul><li>analysiert Ursachen und Auswirkungen von Polities, Politics und Policies,</li>
<li>arbeitet mit wissenschaftlichen <b>Methoden</b> (Umfragen, vergleichende Fallstudien, Prozessanalysen, Dokumentenanalysen, Fokusgruppen, Regressionen, Experimente …)</li>
<li>und auf Basis von <b>Modellen und Theorien</b>: Gesetzesaussagen, die Tatbestände erklären, Ereignisse prognostizieren, überprüfbar sind und neue Theorien hervorbringen.</li></ul>
<p>Moderne Politikwissenschaft ist vor allem <b>empirisch-analytisch</b> und <b>werturteilsfrei</b>: Aussagen sollen auf Erfahrung beruhen und überprüfbar sein. Gütekriterien sind <b>Systematik, Generalisierbarkeit, Kausalmechanismen, Reliabilität</b> (Verlässlichkeit) und <b>Validität</b> (Gültigkeit).</p>
<h3>Teilgebiete des Fachs</h3>
<table class="kvq"><tr><td>1</td><td>Politische Theorie / Ideengeschichte</td></tr><tr><td>2</td><td>Internationale Beziehungen / EU</td></tr><tr><td><b>3</b></td><td><b>Vergleichende Politikwissenschaft / Regierungslehre</b></td></tr><tr><td><b>4</b></td><td><b>Politisches System der BRD</b></td></tr><tr><td>5</td><td>Sozialwissenschaftliche Methoden</td></tr></table>
<p>Die Vorlesung bewegt sich in den Feldern <b>3 und 4</b>: das politische System Deutschlands, verglichen mit anderen Ländern.</p>`,

{id:"v1-4", t:"Politisches System und Eastons Modell", html:`
<p>Nach <b>Parsons</b> ist das politische System ein <b>Subsystem der Gesellschaft</b>, das auf <b>Zielverfolgung und politische Steuerung</b> spezialisiert ist. Wie weit man den Begriff fasst, ist eine Entscheidung:</p>
<div class="merk"><b>Eng oder weit?</b><div class="mrows">
<div><span class="ml">Eng: Zentrales Politisches Entscheidungssystem (ZPES)</span><span>Nur die Institutionen, die verbindlich entscheiden. Formal-institutionenbezogene Sicht.</span></div>
<div><span class="ml">Weit: ZPES plus angrenzende Akteure</span><span>Dazu Parteien, Wirtschaftsakteure, Verbände und andere Interessengruppen. Inhaltlich-prozessbezogene Sicht.</span></div></div></div>
<h3>Eastons Systemmodell</h3>
${FIG_EASTON}
<p>David Easton betrachtet das politische System wie eine Maschine in einer Umwelt:</p>
<ul><li><b>Inputs</b> kommen aus der Umwelt: <b>Forderungen</b> (demands) und <b>Unterstützung</b> (support).</li>
<li>Das <b>politische System</b> verarbeitet sie zu <b>Entscheidungen</b> (decisions).</li>
<li>Die <b>Outputs</b> wirken auf die Umwelt zurück.</li>
<li>Über die <b>Rückkopplung</b> (feedback) beeinflussen die Ergebnisse die nächsten Forderungen und die Unterstützung.</li></ul>
<h3>Drei Formen der Legitimation</h3>
<table class="kvq"><tr><th>Form</th><th>woher sie kommt</th></tr>
<tr><td><b>Soziale Legitimation</b></td><td>Zustimmung durch die Bürgerinnen und Bürger (bei Inputs und Unterstützung)</td></tr>
<tr><td><b>Input-Legitimation</b></td><td>demokratische Verfahren (im System selbst)</td></tr>
<tr><td><b>Output-Legitimation</b></td><td>erfolgreiche Problembearbeitung (bei den Outputs)</td></tr></table>
<div class="litbox"><b>Lektüre: Merkel (2013), Patzelt (2023)</b><p><b>Parsons' AGIL-Schema:</b> Jedes System muss vier Funktionen erfüllen: <b>A</b>daptation (Anpassung an die Umwelt), <b>G</b>oal Attainment (Zielerreichung, die Aufgabe des politischen Systems), <b>I</b>ntegration (Zusammenhalt), <b>L</b>atent Pattern Maintenance (Erhalt kultureller Wertmuster).</p>
<p><b>Easton genauer:</b> Seine Leitfrage war, wie sich politische Systeme in einer Welt aus Stabilität und Wandel behaupten. Typische Forderungen sind Frieden, Rechtssicherheit, Wohlstand und soziale Sicherheit, eine saubere Umwelt. <b>Withinputs</b> sind Forderungen, die im System selbst entstehen, etwa aus der Regierung. Easton unterscheidet <b>specific support</b> (Zufriedenheit mit den Leistungen und Amtsträgern) und <b>diffuse support</b> (Bindung an das System als Ganzes, seine Werte und Verfahren).</p>
<p><b>Patzelt:</b> Die Fähigkeit eines Systems, Input aufzunehmen und darauf zu reagieren, heißt <b>Responsivität</b>. Gelingt der Kreislauf so, dass die Bürger das System aus freien Stücken für rechtens halten, entsteht <b>Legitimität</b>. Fehlt sie, reagiert ein System mit Reformen oder mit Repression.</p></div>
<div class="ergbox"><b>Ergänzung</b>Die Unterscheidung von Input- und Output-Legitimation geht vor allem auf Fritz Scharpf zurück. Sie passt gut in Essays über die EU: Die EU gilt oft als stark bei der Output-, aber schwächer bei der Input-Legitimation.</div>`,

{id:"v1-5", t:"Kreislaufmodell nach Almond und Powell", html:`
<p>Almond und Powell (1988) bauen Eastons Modell aus. Sie fragen, welche <b>Funktionen</b> ein politisches System erfüllen muss und welche <b>Strukturen</b> das übernehmen.</p>
<table class="kvq">
<tr><th>Ebene</th><th>Funktionen</th></tr>
<tr><td><b>Systemfunktionen</b></td><td>Sozialisierung, Rekrutierung, Kommunikation: halten das System am Laufen</td></tr>
<tr><td><b>Prozessfunktionen</b></td><td>Interessenartikulation → Interessenaggregation → Policy-making → Implementierung und Überprüfung</td></tr>
<tr><td><b>Policy-Funktionen</b></td><td>Steuern, Regulierung, Verteilung: die Outputs, die als Outcomes in der Gesellschaft ankommen</td></tr></table>
<h3>Wer übernimmt welche Funktion?</h3>
<table class="kvq">
<tr><td>Parteien</td><td>Interessen bündeln (Aggregation)</td></tr>
<tr><td>Interessengruppen, Verbände</td><td>Interessen äußern (Artikulation)</td></tr>
<tr><td>Parlament, Regierung</td><td>Entscheiden (Policy-making)</td></tr>
<tr><td>Verwaltung, Justiz</td><td>Umsetzen und überprüfen</td></tr></table>
<p>Bei den Inputs unterscheiden sie <b>diffuse Unterstützung</b> und <b>spezifische Unterstützung</b>. Umwelt und Rückkopplungen (Feedbacks) umschließen das Ganze wie bei Easton.</p>
<div class="litbox"><b>Lektüre: Merkel (2013)</b><p><b>Diffuse Unterstützung</b> gilt dem System als Ganzem, etwa der Demokratie an sich. <b>Spezifische Unterstützung</b> hängt von den Leistungen ab und gilt den aktuellen Entscheidungen und Amtsträgern. Man kann die Regierung ablehnen und trotzdem die Demokratie unterstützen.</p>
<p>Laut Merkel ist Almond/Powell die ausgefeilteste Version des Systemkonzepts, weil sie Eastons „Blackbox“ ausleuchtet: welche Struktur welche Funktion übernimmt. <b>Kritik von Luhmann:</b> Kein Teilsystem steht über den anderen. Wirtschaft, Recht oder Wissenschaft folgen eigenen Codes, darum kann die Politik sie nicht einfach steuern. Merkel hält das für zu radikal, nimmt aber eine gewisse <b>Steuerungsskepsis</b> mit: Politische Steuerung erzeugt oft nicht beabsichtigte Effekte.</p></div>
<div class="ergbox"><b>Ergänzung</b>„Steuern“ meint im Schaubild das Erheben von Abgaben (englisch extraction), nicht das Lenken.</div>`,

{id:"v1-6", t:"Demokratie und Autokratie unterscheiden", html:`
<p><b>Demokratie</b> kommt von griechisch <i>démos</i> (Volk) und <i>kratía</i> (Herrschaft): Herrschaft des Volkes. Das entscheidende Unterscheidungsmerkmal:</p>
<div class="merk"><b>Kernsatz</b>In Demokratien ist der <b>Gesetzgeber selbst den Gesetzen unterworfen</b>, in Autokratien nicht.</div>
<ul><li><b>Autokratie</b> wird oft mit Diktatur gleichgesetzt.</li>
<li>Vorschlag einer <b>dichotomen</b> Typenlehre: Alle Nicht-Demokratien sind Autokratien. „Democracy is the opposite of autocracy“ (Jaggers/Gurr 1995).</li>
<li><b>Linz (1975)</b> unterteilt Autokratien in <b>totalitäre</b> und <b>autoritäre</b> Regime.</li>
<li><b>Merkel (2010)</b> unterteilt Demokratien in <b>eingebettete rechtsstaatliche</b> (embedded) und <b>defekte</b> Demokratien.</li></ul>
<h3>Kontinuum politischer Regime (Lauth et al. 2014)</h3>
<table class="kvq">
<tr><th colspan="2">Demokratie-Seite</th></tr>
<tr><td><b>Demokratie</b></td><td>repräsentativ, direkt, parlamentarisch oder präsidentiell</td></tr>
<tr><td><b>Defekte Demokratie</b></td><td>illiberal, delegativ, exklusiv</td></tr>
<tr><th colspan="2">Autokratie-Seite: autoritäre Regime</th></tr>
<tr><td><b>Schwach autoritär</b></td><td>kontrolliertes Mehrparteienregime (mit dominanter Partei) oder Einparteiensystem</td></tr>
<tr><td><b>Stark autoritär</b></td><td>Militärregime, absolute Monarchie, ideologisch fundiertes Einparteiensystem</td></tr>
<tr><th colspan="2">Autokratie-Seite: totalitäre Regime</th></tr>
<tr><td><b>Totalitär</b></td><td>faschistisch, kommunistisch, theokratisch (jeweils mit Totalitätsanspruch)</td></tr></table>
<h3>Drei Dimensionen (Lauth 2006)</h3>
<table class="kvq"><tr><th></th><th>totalitär</th><th>autoritär</th><th>demokratisch</th></tr>
<tr><td>politische Freiheit</td><td>nicht gegeben</td><td>partiell</td><td>gegeben</td></tr>
<tr><td>politische Gleichheit</td><td>nicht gegeben</td><td>partiell</td><td>gegeben</td></tr>
<tr><td>politische und rechtliche Kontrolle</td><td>nicht gegeben</td><td>partiell</td><td>gegeben</td></tr></table>
<div class="litbox"><b>Lektüre: Kelsen und Linz (Merkel 2013, Lauth 2015)</b><p><b>Kelsen (1925)</b> liefert die abstrakte Begründung des Kernsatzes: In Demokratien sind die, die Gesetze machen, und die, für die sie gelten, dieselben (<b>autonome Normen</b>). In Autokratien fallen Normautoren und Normadressaten auseinander (<b>heteronome Normen</b>).</p>
<p><b>Linz</b> unterscheidet autoritär und totalitär an drei Merkmalen:</p>
<table class="kvq"><tr><th></th><th>autoritär</th><th>totalitär</th></tr>
<tr><td>Pluralismus</td><td>begrenzt</td><td>Monismus</td></tr>
<tr><td>Legitimation</td><td>Mentalitäten (Patriotismus, Nationalismus, Sicherheit, Modernisierung)</td><td>umfassende Weltanschauung (z. B. Marxismus-Leninismus)</td></tr>
<tr><td>Mobilisierung</td><td>Bevölkerung demobilisiert</td><td>inszenierte Dauermobilisierung</td></tr></table>
<p>Merkel nennt dazu Hannah Arendts Satz: Autoritäre Herrschaft schränkt die Freiheit ein, totalitäre schafft sie ab. Heute gilt nur noch Nordkorea als totalitär.</p></div>
<p>Für Essays wichtig: Die Tabelle von Lauth zeigt ein <b>Kontinuum</b>. Die dichotome Sicht (entweder Demokratie oder Autokratie) ist einfach, aber sie kann Grauzonen wie defekte Demokratien schlecht abbilden.</p>`,

{id:"v1-7", t:"Was ist eine Demokratie? Lauth, Dahl, Merkel", html:`
<p>Für Essays brauchst du eine Definition, die du zitieren kannst. Schwanholz nutzt die von Lauth:</p>
<div class="quote">Demokratie ist eine <b>rechtsstaatliche Herrschaftsform</b>, die <b>Selbstbestimmung</b> für alle Staatsbürger im Sinne der <b>Volkssouveränität</b> ermöglicht: durch maßgebliche Beteiligung an der Besetzung der Entscheidungspositionen in <b>freien, kompetitiven und fairen Verfahren</b>, durch die Chance auf kontinuierliche Einflussnahme und durch eine <b>Kontrolle der Herrschaft</b>.<cite>gekürzt nach Lauth 2006, S. 100</cite></div>
<p>Daraus folgen die drei Dimensionen: <b>Freiheit, Gleichheit, Kontrolle</b>.</p>
<h3>Prozedural oder materiell?</h3>
<table class="kvq"><tr><td><b>Prozedural</b></td><td>Wie wird Herrschaft vergeben und kontrolliert? Rekrutierung des Personals, Kontrolle der Exekutive, Offenheit für Beteiligung.</td></tr>
<tr><td><b>Materiell</b></td><td>Was kommt heraus? Politikinhalte und -ergebnisse, etwa gerechte Verteilung.</td></tr></table>
<p>Laut Folie hat sich die <b>prozedurale</b> Vorstellung als weitaus wirkungsmächtiger erwiesen.</p>
<h3>Dahl (1971): acht Garantien</h3>
<ol class="cb-ol">
<li><span>Assoziations- und Koalitionsfreiheit</span></li><li><span>Recht auf freie Meinungsäußerung</span></li><li><span>aktives Wahlrecht</span></li><li><span>passives Wahlrecht</span></li><li><span>Recht der Eliten, um Wählerstimmen zu konkurrieren</span></li><li><span>alternative, pluralistische Informationsquellen</span></li><li><span>freie und faire Wahlen</span></li><li><span>Institutionen, die Regierungspolitik von Wählerstimmen und Bürgerpräferenzen abhängig machen</span></li></ol>
<h3>Merkel (2010): sechs Fragen an jede Herrschaft</h3>
<table class="kvq"><tr><th>Dimension</th><th>Frage</th></tr>
<tr><td>Legitimation</td><td>Durch wen wird Macht legitimiert?</td></tr>
<tr><td>Zugang</td><td>Wie ist der Zugang zur Macht geregelt?</td></tr>
<tr><td>Monopol</td><td>Wer trifft die bindenden Entscheidungen?</td></tr>
<tr><td>Struktur</td><td>Auf wie viele Träger ist die Macht verteilt?</td></tr>
<tr><td>Anspruch</td><td>Ist der Herrschaftsanspruch gegenüber den Bürgern begrenzt?</td></tr>
<tr><td>Weise</td><td>Wie wird Herrschaft ausgeübt?</td></tr></table>
<div class="litbox"><b>Lektüre: Merkel (2013), Tabelle 1</b>
<p style="margin:6px 0 4px"><b>Autokratien</b></p>
<table class="kvq"><tr><th></th><th>totalitär</th><th>autoritär</th></tr>
<tr><td>Legitimation</td><td>Weltanschauung</td><td>Mentalitäten</td></tr>
<tr><td>Zugang</td><td>geschlossen</td><td>restriktiv</td></tr>
<tr><td>Anspruch</td><td>unbegrenzt</td><td>umfangreich</td></tr>
<tr><td>Monopol</td><td>Führer, Partei</td><td>Führer, Oligarchie</td></tr>
<tr><td>Struktur</td><td>monistisch</td><td>semipluralistisch</td></tr>
<tr><td>Weise</td><td>systematisch repressiv, terroristisch</td><td>willkürlich repressiv</td></tr></table>
<p style="margin:10px 0 4px"><b>Demokratien</b></p>
<table class="kvq"><tr><th></th><th>defekt</th><th>rechtsstaatlich (embedded)</th></tr>
<tr><td>Legitimation</td><td>Volkssouveränität</td><td>Volkssouveränität</td></tr>
<tr><td>Zugang</td><td>offen</td><td>offen</td></tr>
<tr><td>Anspruch</td><td>begrenzt, Grenzen aber verletzt</td><td>begrenzt und garantiert</td></tr>
<tr><td>Monopol</td><td>gewählte Autoritäten, evtl. durch Vetomächte eingeschränkt</td><td>gewählte Autoritäten</td></tr>
<tr><td>Struktur</td><td>pluralistisch</td><td>pluralistisch</td></tr>
<tr><td>Weise</td><td>beschädigte Rechtsstaatlichkeit</td><td>rechtsstaatlich</td></tr></table>
<p>Mit diesen sechs Kriterien lassen sich Demokratie und Autokratie und jeweils ihre beiden Untertypen trennen.</p></div>`,

{id:"v1-8", t:"Embedded Democracy und defekte Demokratien", html:`
<p>Merkels Konzept der <b>Embedded Democracy</b> (2010) ist ein Messkonzept für die <b>Qualität</b> von Demokratien. Das ist sehr wahrscheinlich Essay-Stoff.</p>
<div class="merk"><b>Idee</b>Stabile rechtsstaatliche Demokratien sind <b>doppelt eingebettet</b>: <b>intern</b> (die Teilregime stützen sich gegenseitig) und <b>extern</b> (durch ihr Umfeld). Annahme: So ist die Demokratie gegen äußere und innere Schocks geschützt.</div>
${FIG_EMBEDDED}
<h3>Interne Einbettung: fünf Teilregime</h3>
<table class="kvq">
<tr><td><b>A</b></td><td>Wahlregime</td></tr>
<tr><td><b>B</b></td><td>Politische Freiheiten (Teilhaberechte)</td></tr>
<tr><td><b>C</b></td><td>Bürgerliche Rechte</td></tr>
<tr><td><b>D</b></td><td>Horizontale Verantwortlichkeit (Gewaltenkontrolle)</td></tr>
<tr><td><b>E</b></td><td>Effektive Regierungsgewalt</td></tr></table>
<h3>Externe Einbettung</h3>
<p>Staatlichkeit, Zivilgesellschaft, ökonomische Voraussetzungen und soziale Gerechtigkeit.</p>
<h3>Wozu das Konzept?</h3>
<ul><li>„Qualität“ von Demokratie genauer bestimmen</li><li>Länder vergleichen und Demokratiedefekte identifizieren</li><li>systematisch beobachten, wie einzelne Teilsysteme „infiziert“ werden</li><li>Aushöhlung der Demokratie und schleichende Autokratisierung erkennen</li></ul>
<div class="litbox"><b>Lektüre: vier Typen defekter Demokratie (Merkel 2013)</b>
<p><b>Exklusive Demokratie:</b> Ganze Gruppen sind vom universellen Wahlrecht ausgeschlossen (A). Beispiel: Südafrika zur Zeit der Apartheid, mildere Form bei der russischen Minderheit in Lettland und Estland.</p>
<p><b>Enklavendemokratie:</b> Vetomächte wie Militär, Milizen, Großgrundbesitzer oder Konzerne entziehen ganze Politikbereiche den Gewählten (E). Beispiele: Chile kurz nach Pinochet, Indonesien.</p>
<p><b>Illiberale Demokratie:</b> Die Gerichte kontrollieren Regierung und Parlament nur eingeschränkt, Freiheits- und Schutzrechte sind beschädigt (C). Häufigster Typ, etwa Türkei, Ukraine, Peru.</p>
<p><b>Delegative Demokratie:</b> Ein meist charismatischer Präsident regiert am Parlament vorbei und greift in die Justiz ein (D). Beispiele bei Merkel: Russland unter Putin, Venezuela unter Chávez.</p>
<p><b>Ursachen</b> sind meist Bündel: unvollständige Modernisierung, Wirtschaftskrisen, schwache Zivilgesellschaft, Klientelismus und Korruption, fehlende regionale Einbindung. Defekte Demokratien sind nicht unbedingt Übergangsstadien, sie können stabil sein. Um 2011 war etwa die Hälfte der 117 Wahldemokratien defekt.</p>
<p>Zur externen Einbettung zählt Merkel im Text neben sozioökonomischem Kontext und Zivilgesellschaft auch die <b>internationale und regionale Einbindung</b>.</p></div>
<p>Kernaussage für Essays: Eine defekte Demokratie hat noch ein funktionierendes Wahlregime, aber in anderen Teilregimen fehlt die gegenseitige Absicherung. Darum reicht es nicht, nur zu fragen, ob gewählt wird.</p>`,

ESSAYS.push(
 {id:"v1-e1", ch:1, kind:"lang", short:"Embedded Democracy",
  q:"Erläutern Sie das Konzept der „Embedded Democracy“ nach Merkel und diskutieren Sie, inwiefern es sich eignet, Defekte von Demokratien zu erkennen.",
  op:"„Erläutern“: Konzept erklären, mit Beispielen veranschaulichen. „Diskutieren“: Stärken und Grenzen abwägen und am Ende Stellung nehmen.",
  gl:["<b>Einleitung:</b> Problem: Viele Staaten halten Wahlen ab und sind trotzdem keine vollständigen Demokratien. Frage: Wie lässt sich die Qualität einer Demokratie messen?",
   "<b>Demokratiebegriff:</b> Abgrenzung zur Autokratie (Gesetzgeber an Gesetze gebunden), kurz Lauths Definition oder Dahls Kriterien.",
   "<b>Das Konzept:</b> doppelte Einbettung. Intern fünf Teilregime A bis E, extern Staatlichkeit, Zivilgesellschaft, sozioökonomische Voraussetzungen.",
   "<b>Defekte Demokratie:</b> Wahlregime funktioniert, ein anderes Teilregime ist beschädigt. Typen mit Beispielen.",
   "<b>Diskussion Stärken:</b> differenzierter als die Dichotomie, Teilregime einzeln prüfbar, Ländervergleich, schleichende Autokratisierung sichtbar.",
   "<b>Diskussion Grenzen:</b> Abgrenzung zwischen defekter Demokratie und autoritärem Regime unscharf, Messung erfordert Urteile, normativ geprägt.",
   "<b>Fazit:</b> gut geeignet als Analyseraster, aber kein Automatismus. Eigene Einschätzung."],
  k:["Problemstellung in der Einleitung (Wahlen allein machen noch keine Demokratie)",
   "Idee der doppelten Einbettung: intern und extern",
   "Alle fünf Teilregime genannt (Wahlregime, politische Freiheiten, bürgerliche Rechte, horizontale Verantwortlichkeit, effektive Regierungsgewalt)",
   "Externe Einbettung genannt (Staatlichkeit, Zivilgesellschaft, sozioökonomische Voraussetzungen)",
   "Defekte Demokratie erklärt: Wahlregime intakt, andere Teilregime beschädigt, mindestens ein Typ mit Beispiel",
   "Ziele des Konzepts: Qualität messen, vergleichen, Aushöhlung erkennen",
   "Abwägung mit mindestens einer Stärke und einer Grenze",
   "Fazit beantwortet die Frage mit begründeter eigener Einschätzung"],
  m:["Heute halten die meisten Staaten der Welt Wahlen ab. Dennoch würde kaum jemand jeden dieser Staaten als Demokratie bezeichnen. Die Vergleichende Politikwissenschaft braucht deshalb Instrumente, die mehr leisten als die Frage, ob gewählt wird. Ein solches Instrument ist das Konzept der „Embedded Democracy“ von Wolfgang Merkel (2010). Im Folgenden wird das Konzept erläutert und anschließend diskutiert, wie gut es Demokratiedefekte sichtbar macht.",
   "Grundlage ist ein prozeduraler Demokratiebegriff. Nach Lauth (2006) ist Demokratie eine rechtsstaatliche Herrschaftsform, die Selbstbestimmung im Sinne der Volkssouveränität durch freie, kompetitive und faire Verfahren ermöglicht und die Kontrolle der Herrschaft garantiert. Anders als in Autokratien ist der Gesetzgeber selbst an die Gesetze gebunden.",
   "Merkel geht davon aus, dass stabile rechtsstaatliche Demokratien doppelt eingebettet sind. Intern besteht die Demokratie aus fünf Teilregimen: dem Wahlregime (A) im Zentrum, den politischen Freiheiten (B), den bürgerlichen Rechten (C), der horizontalen Verantwortlichkeit, also der gegenseitigen Kontrolle der Gewalten (D), und der effektiven Regierungsgewalt der gewählten Vertreter (E). Diese Teilregime sichern sich gegenseitig ab: Freie Wahlen nützen wenig, wenn die Presse nicht berichten darf oder Gerichte die Regierung nicht kontrollieren können. Extern ist die Demokratie in Staatlichkeit, eine lebendige Zivilgesellschaft und sozioökonomische Voraussetzungen eingebettet. Die Annahme ist, dass diese doppelte Einbettung die Demokratie gegen innere und äußere Schocks schützt.",
   "Daraus ergibt sich der Begriff der defekten Demokratie: Das Wahlregime funktioniert im Kern, aber andere Teilregime sind beschädigt. Je nach betroffenem Teilregime unterscheidet man etwa die illiberale Demokratie, in der bürgerliche Rechte eingeschränkt sind, die delegative Demokratie, in der die Regierung Parlament und Justiz umgeht, und die exklusive Demokratie, in der Teile der Bevölkerung von der Teilhabe ausgeschlossen sind. Ungarn wird in der Forschung häufig als Beispiel für eine illiberale Entwicklung genannt.",
   "Für die Erkennung von Defekten hat das Konzept klare Stärken. Es ist differenzierter als eine dichotome Einteilung in Demokratien und Autokratien, wie sie Jaggers und Gurr vorschlagen. Weil die Teilregime einzeln geprüft werden, lässt sich genau benennen, wo eine Demokratie Schwächen hat. Das ermöglicht Ländervergleiche und macht sichtbar, wie einzelne Teilsysteme nach und nach „infiziert“ werden. Gerade schleichende Autokratisierung, die ohne offenen Putsch über Jahre abläuft, wird so erkennbar.",
   "Zugleich hat das Konzept Grenzen. Die Grenze zwischen einer stark defekten Demokratie und einem schwach autoritären Regime bleibt unscharf, und die Einstufung erfordert Urteile, die je nach Forscher unterschiedlich ausfallen können. Außerdem beruht das Modell auf einem westlich-liberalen Leitbild, an dem alle Staaten gemessen werden.",
   "Insgesamt eignet sich das Konzept der Embedded Democracy gut, um Defekte von Demokratien zu erkennen, weil es den Blick von den Wahlen auf das Zusammenspiel aller Teilregime lenkt. Es ersetzt aber nicht die genaue Analyse des Einzelfalls und liefert keine automatische Einstufung. Gerade deshalb ist es als Analyseraster für die Vergleichende Politikwissenschaft wertvoll."]},
 {id:"v1-e2", ch:1, kind:"lang", short:"Demokratie und Autokratie",
  q:"Grenzen Sie Demokratie und Autokratie voneinander ab. Diskutieren Sie dabei, ob eine dichotome Unterscheidung der politischen Wirklichkeit gerecht wird.",
  op:"„Abgrenzen“: Kriterien nennen, nach denen sich beide unterscheiden. „Diskutieren“: dichotome Sicht und Kontinuum gegenüberstellen, Stellung nehmen.",
  gl:["<b>Einleitung:</b> Wortbedeutung (démos, kratía), Fragestellung: Reicht „Demokratie oder nicht“?",
   "<b>Kernkriterium:</b> Bindung des Gesetzgebers an die Gesetze.",
   "<b>Kriterien für Demokratie:</b> Lauths Definition und die drei Dimensionen Freiheit, Gleichheit, Kontrolle; Dahls Garantien als Beispiel.",
   "<b>Autokratien unterscheiden:</b> Linz: autoritär und totalitär, mit Merkmalen.",
   "<b>Dichotome Sicht:</b> Jaggers/Gurr, Vorteile (klar, messbar).",
   "<b>Kontinuum:</b> Lauth et al. 2014, defekte Demokratien, schwach und stark autoritär; Merkels Embedded Democracy als Werkzeug.",
   "<b>Fazit:</b> Dichotomie als erster Schritt, für die Wirklichkeit braucht es das Kontinuum."],
  k:["Wortbedeutung oder Grundidee der Demokratie als Volksherrschaft",
   "Kernkriterium: Gesetzgeber in der Demokratie an die Gesetze gebunden, in der Autokratie nicht",
   "Drei Dimensionen nach Lauth (Freiheit, Gleichheit, Kontrolle) mit Abstufung gegeben, partiell, nicht gegeben",
   "Autoritär und totalitär nach Linz unterschieden",
   "Dichotome Typenlehre (Jaggers/Gurr) dargestellt",
   "Kontinuum nach Lauth et al. mit defekter Demokratie und Abstufungen der Autokratie",
   "Begründete Antwort auf die Frage nach der Dichotomie"],
  m:["Der Begriff Demokratie stammt aus dem Griechischen: démos bedeutet Volk, kratía Herrschaft. Demokratie ist also der Grundidee nach die Herrschaft des Volkes, Autokratie die Selbstherrschaft eines Einzelnen oder einer kleinen Gruppe. Doch zwischen beiden liegen viele Staaten, die sich nicht eindeutig zuordnen lassen. Dieses Essay grenzt beide Herrschaftsformen ab und fragt, ob eine Einteilung in nur zwei Typen der Wirklichkeit gerecht wird.",
   "Das grundlegende Unterscheidungsmerkmal ist die Bindung an das Recht: In Demokratien ist der Gesetzgeber selbst den Gesetzen unterworfen, in Autokratien nicht. Lauth (2006) bestimmt Demokratie als rechtsstaatliche Herrschaftsform, die Selbstbestimmung im Sinne der Volkssouveränität ermöglicht. Daraus leitet er drei Dimensionen ab: politische Freiheit, politische Gleichheit sowie politische und rechtliche Kontrolle. In einer Demokratie sind alle drei gegeben, in einem autoritären Regime nur teilweise, in einem totalitären Regime gar nicht. Dahls (1971) Kriterien wie freie und faire Wahlen, Meinungsfreiheit und pluralistische Informationsquellen konkretisieren diese Dimensionen.",
   "Auch Autokratien sind nicht gleich. Linz (1975) unterscheidet autoritäre Regime, die einen begrenzten Pluralismus zulassen und die Bevölkerung eher ruhigstellen, von totalitären Regimen, die mit einer umfassenden Ideologie alle Lebensbereiche erfassen und die Bevölkerung mobilisieren.",
   "Eine dichotome Typenlehre, wie sie Jaggers und Gurr (1995) vertreten, ordnet jeden Staat entweder als Demokratie oder als Autokratie ein. Ihr Vorteil ist Klarheit: Sie erleichtert Zählungen und große Vergleiche. Ihr Nachteil zeigt sich bei Staaten, die zwar regelmäßig wählen lassen, aber Gerichte schwächen oder die Presse kontrollieren.",
   "Lauth et al. (2014) ordnen politische Regime deshalb auf einem Kontinuum an: von der Demokratie über die defekte Demokratie, das schwach und das stark autoritäre Regime bis zum totalitären Regime. Defekte Demokratien wie die illiberale oder die delegative Demokratie stehen noch auf der Seite der Demokratie, weisen aber deutliche Mängel auf. Mit Merkels Konzept der Embedded Democracy lässt sich genau bestimmen, welches Teilregime beschädigt ist.",
   "Im Ergebnis ist die dichotome Unterscheidung ein sinnvoller erster Schritt, weil das Kernkriterium der Rechtsbindung klar ist. Der politischen Wirklichkeit wird sie aber nicht gerecht, da viele Staaten in einer Grauzone liegen. Erst ein Kontinuum erlaubt es, diese Zwischenformen zu beschreiben und Entwicklungen wie eine schleichende Autokratisierung zu erkennen."]},
 {id:"v1-e3", ch:1, kind:"kurz", short:"Polity, Politics, Policy",
  q:"Erläutern Sie den dreidimensionalen Politikbegriff an einem selbst gewählten Beispiel.",
  op:"„Erläutern“: alle drei Dimensionen definieren und am selben Beispiel zeigen. Etwa 15 Minuten.",
  gl:["<b>Einstieg:</b> Politik nach Bernauer et al. (allgemein verbindliche Entscheidungen), drei englische Begriffe für ein deutsches Wort.",
   "<b>Polity</b> definieren und am Beispiel zeigen.",
   "<b>Politics</b> definieren und am Beispiel zeigen.",
   "<b>Policy</b> definieren und am Beispiel zeigen.",
   "<b>Schluss:</b> Die Dimensionen hängen zusammen, die Polity setzt den Rahmen für Politics, daraus entsteht Policy."],
  k:["Polity als Form oder Regelwerk (Verfassung, Staat, politisches System)",
   "Politics als Prozess (Interessen, Akteure, Macht, Legitimation)",
   "Policy als Inhalt oder Handlungsprogramm (Problem, Programm, Erfolg)",
   "Ein durchgehendes Beispiel, an dem alle drei Dimensionen gezeigt werden",
   "Zusammenhang der drei Dimensionen angesprochen"],
  m:["Politik ist nach Bernauer et al. (2009) soziales Handeln, das auf allgemein verbindliche Entscheidungen zielt. Um Politik genauer zu analysieren, unterscheidet die Politikwissenschaft drei Dimensionen, die mit den englischen Begriffen Polity, Politics und Policy bezeichnet werden. Das lässt sich an der Rückkehr von G8 zu G9 an den Gymnasien in Nordrhein-Westfalen zeigen.",
   "Polity bezeichnet die Form der Politik, also das Regelwerk und die Grundlagen des Gemeinwesens: Verfassung, Staat und politisches System. Im Beispiel gehört dazu, dass Bildung nach dem Grundgesetz in die Zuständigkeit der Länder fällt und deshalb der Landtag über das Schulgesetz entscheidet.",
   "Politics meint den Prozess, in dem um Entscheidungen gerungen wird. Hier geht es um Interessen, Akteure, Kommunikation, Legitimation und Macht. Im Beispiel stritten Elterninitiativen, Lehrerverbände und Parteien über Jahre, ob die verkürzte Schulzeit beibehalten werden soll, bis sich im Landtag eine Mehrheit fand.",
   "Policy schließlich bezeichnet die Inhalte, also die Handlungsprogramme mit Problem, Programm und Erfolg. Im Beispiel ist das die beschlossene Regel, dass das Abitur am Gymnasium wieder nach neun Jahren abgelegt wird, und die Frage, ob sie das Problem der Überlastung löst.",
   "Die drei Dimensionen hängen eng zusammen: Die Polity setzt den Rahmen, in dem Politics stattfindet, und aus diesem Prozess entsteht die Policy."]},
 {id:"v1-e4", ch:1, kind:"kurz", short:"Easton und Legitimation",
  q:"Erklären Sie Eastons Modell des politischen Systems und ordnen Sie die drei Formen der Legitimation darin ein.",
  op:"„Erklären“: Bausteine und Zusammenhang des Modells darstellen. „Einordnen“: jede Legitimationsform an der richtigen Stelle verorten. Etwa 15 Minuten.",
  gl:["<b>Einstieg:</b> politisches System als Teil der Gesellschaft (Parsons), Easton als Systemtheoretiker.",

  k:["Inputs: Forderungen (demands) und Unterstützung (support) aus der Umwelt",

   "Rückkopplung (Feedback) erklärt",

  m:["David Easton versteht das politische System als Teil der Gesellschaft, der mit seiner Umwelt in ständigem Austausch steht. Aus der Umwelt gelangen Inputs in das System. Easton unterscheidet dabei Forderungen, etwa nach mehr Lehrkräften, und Unterstützung, also die Bereitschaft der Bürger, das System und seine Entscheidungen mitzutragen.",

{id:"v1-9", t:"Warum Wissenschaft? Alltagsdenken und Aussagen", html:`
<p>${LIT("Patzelt 2023, Kap. 1")} Patzelt beschreibt Wissenschaft als <b>Emanzipation aus den Fesseln des gesunden Menschenverstandes</b>. Wissenschaft braucht es erst dort, wo das Alltagswissen nicht mehr reicht.</p>
<h3>Drei Schwächen des Alltagsdenkens</h3>
<table class="kvq">
<tr><td><b>unreflektiert selektiv</b></td><td>Niemand nimmt alles wahr, und vom Wahrgenommenen vergisst man das meiste. Die Politikwissenschaft hält mit bewusster Fallauswahl und Stichproben dagegen.</td></tr>
<tr><td><b>unreflektiert perspektivisch</b></td><td>Jeder sieht von seinem Standort aus. Dagegen helfen bewusst gewählte Begriffe und Theorien.</td></tr>
<tr><td><b>selbstverständlich</b></td><td>Was nicht ins Weltbild passt, wird eher bezweifelt als das Weltbild. Dagegen helfen Wissenschaftstheorie und Methodenlehre.</td></tr></table>
<h3>Empirisch und logisch wahr</h3>
<p>Wissenschaftliche Aussagen sollen <b>empirisch wahr</b> sein, also mit der Wirklichkeit übereinstimmen, und <b>logisch wahr</b>, also ohne Denk- und Ableitungsfehler. Logik allein ersetzt nie die empirische Prüfung: Ein sauberes Argument mit falscher Prämisse bleibt falsch.</p>
<h3>Empirische und normative Aussagen</h3>
<table class="kvq">
<tr><td><b>empirisch</b></td><td>Beschreibungen, Zusammenhangsaussagen, Erklärungen, Prognosen. Sie sind wahr oder falsch und lassen sich an den Tatsachen prüfen.</td></tr>
<tr><td><b>normativ</b></td><td>Werturteile und Handlungsanweisungen. Sie sind nicht wahr oder falsch, sondern <b>normativ brauchbar oder unbrauchbar</b>, also besser oder schlechter begründet.</td></tr></table>
<div class="merk"><b>Begriffe</b><div class="mrows">
<div><span class="ml">Reliabilität</span><span>Daten werden unabhängig von Person und Laune des Forschers erhoben und ausgewertet.</span></div>
<div><span class="ml">Validität</span><span>Ein konkreter Begriff erfasst wirklich das, was der abstrakte Begriff meint (gelungene Operationalisierung).</span></div>
<div><span class="ml">Hypothese</span><span>Eine empirische Aussage, die gerade überprüft wird.</span></div></div></div>
<p>Patzelt nennt auch <b>Immunisierungsstrategien</b>, mit denen man sich unseriös gegen Kritik abschirmt: unklar formulieren, sich auf Autoritäten statt auf Belege berufen, nur „aus sich selbst heraus“ verstehen lassen, Überprüfbarkeit grundsätzlich ablehnen.</p>`,

{id:"v1-10", t:"Regierung, Regime, Staat, Regierungssystem", html:`
<p>${LIT("Merkel 2013, Lauth 2015")} Vier Begriffe, die oft verwechselt werden. Merkel ordnet sie nach ihrer Reichweite und Dauer.</p>
<table class="kvq">
<tr><td><b>Regierung</b></td><td>Der engste Begriff: Regierungschef und Kabinett. Lenkt die Entscheidungen, in Demokratien auf Zeit gewählt und abwählbar.</td></tr>
<tr><td><b>Regime</b></td><td>Formelle und informelle Organisation der Herrschaft: Wer hat Zugang zur Macht, wie verhalten sich Herrschende und Beherrschte? Die Regeln des Regimes unterscheiden Demokratie und Autokratie. Dauerhafter als eine Regierung.</td></tr>
<tr><td><b>Staat</b></td><td>Dauerhafte Herrschaftsstruktur mit Zwangsmitteln. Nach <b>Jellinek</b> (Drei-Elemente-Lehre): Staatsgebiet, Staatsvolk, Staatsgewalt. Überdauert Regimewechsel: „A state may remain in place, even when regimes come and go.“</td></tr>
<tr><td><b>Politisches System</b></td><td>Der umfassendste Begriff. Deckt Funktionen und Strukturen von Regierung und Staat ab und verbindet die Ordnung über Inputs und Outputs mit der Umwelt.</td></tr></table>
<div class="merk"><b>Beispiel</b>Spanien nach Franco: Das <b>Regime</b> wechselte von der Diktatur zur Demokratie, der <b>Staat</b> mit Verwaltung und vielen Beamten blieb. Dieselben Staatsapparate können in Demokratien wie Diktaturen funktionieren.</div>
<h3>Regime und Regierungssystem (Lauth)</h3>
<p>Lauth nutzt Regime und Herrschaftsform gleichbedeutend. Davon abzugrenzen ist das <b>Regierungssystem</b>: Parlamentarisch und präsidentiell sind zwei Varianten <i>innerhalb</i> des Regimetyps Demokratie. Das wird in Sitzung 2 wichtig.</p>
<p>Lauth betont außerdem: Jedes Regime setzt einen <b>Staat</b> mit Gewaltmonopol voraus. Bei fragiler Staatlichkeit lassen sich die Typologien nur eingeschränkt anwenden.</p>`,

 {q:"Was ändert sich bei einem Regimewechsel laut Merkel typischerweise nicht?", o:["Die Regeln des Zugangs zur Macht","Staatsgebiet, Staatsvolk und Staatsgewalt","Die Art, wie Herrschaft legitimiert wird"], a:1, ex:"Der Staat bleibt, das Regime, also die Regeln der Herrschaft, wird neu definiert."},
 {q:"Parlamentarische und präsidentielle Demokratie sind bei Lauth …", o:["zwei verschiedene Regime","zwei Regierungssysteme innerhalb des Regimes Demokratie","Formen defekter Demokratie"], a:1, ex:"Beide erfüllen die Merkmale der Demokratie voll, sie unterscheiden sich im Institutionendesign."}
]},
{id:"v1-11", t:"Zwei, drei oder stufenlos? Typologien und Grauzonen", html:`
<p>${LIT("Merkel 2013, Lauth 2015")} Die Folie zeigt Lauths Kontinuum. Merkel diskutiert, warum es überhaupt verschiedene Einteilungen gibt.</p>
<h3>Das Schwellenproblem</h3>
<p>Wie weit darf eine Demokratie bei Wahlen, Bürgerrechten oder Gewaltenkontrolle vom Ideal abweichen und trotzdem noch voll demokratisch sein? Wo genau hört Demokratie auf? Diese Frage ist laut Merkel <b>nirgends präzise gelöst</b>, vielleicht gar nicht lösbar. Dazu kommt die Frage, ob sehr gute Wahlen Schwächen bei den Bürgerrechten <b>ausgleichen</b> dürfen.</p>
<p>Das Problem verschwindet auch bei schlanken Definitionen nicht. Beispiele: Wahlen unter Putin gelten nicht als unfrei, aber zunehmend als unfair. Italien unter Berlusconi kontrollierte große Teile der Medien privat.</p>
<h3>Drei Antworten</h3>
<table class="kvq">
<tr><td><b>Dichotomie</b></td><td>Demokratie oder Autokratie (Kelsen, Przeworski). Klar und nützlich, wenn man mit vielen Fällen rechnet und den Regimetyp als Ursache für etwas anderes testet.</td></tr>
<tr><td><b>Dreiteilung</b></td><td>Mit hybriden Regimen als Grauzone. Freedom House: free, partly free, not free. Polity IV: democracy, anocracy, autocracy. Die Schwellenfrage verschiebt sich nur.</td></tr>
<tr><td><b>Gradualismus</b></td><td>Alle Regime auf einem Kontinuum zwischen idealer Demokratie und perfektem Totalitarismus. Mehr Präzision, aber auch hier keine exakte Grenze.</td></tr></table>
<p>Merkel selbst folgt der Zweiteilung mit Untertypen (Embedded und defekte Demokratie, autoritäre und totalitäre Regime).</p>
<h3>Untertypen oder hybride Regime? (Lauth)</h3>
<ul><li><b>Reguläre Subtypen</b> fügen Merkmale hinzu, zum Beispiel parlamentarisch oder präsidentiell.</li>
<li><b>Verminderte Subtypen</b> (diminished subtypes) haben alle Merkmale, aber einige nur eingeschränkt: die <b>defekte Demokratie</b>. Beispiel: die Schweiz bis zum Frauenwahlrecht 1971.</li>
<li><b>Hybride Regime</b> verbinden Merkmale <i>verschiedener</i> Regimetypen, etwa demokratische Wahlen mit sehr schwacher Machtkontrolle. Auch „competitive“ oder „electoral authoritarianism“.</li></ul>
<h3>Idealtyp und Realtyp</h3>
<p>Ein <b>Realtyp</b> nimmt einen echten Fall als Muster. Ein <b>Idealtyp</b> (Max Weber) spitzt die Leitidee gedanklich zu und muss mit keinem Fall genau übereinstimmen. „Ideal“ heißt hier nicht vorbildlich.</p>
<h3>Demokratie messen</h3>
<p>Einfache Messungen nutzen wenige Indikatoren (Vanhanen: Wettbewerb und Beteiligung nach Dahl). Komplexe Messungen wie <b>Freedom House</b> (rund 100 Indikatoren), der <b>Bertelsmann Transformationsindex</b> oder <b>V-Dem</b> (über 3000 Länderexperten) erfassen auch die Qualität. Gemessen wird graduell, darum braucht es begründete Schwellenwerte, um Typen zu bilden.</p>`,

{id:"v1-12", t:"Patzelts Merkmalsraum: Systeme einordnen", html:`
<p>${LIT("Patzelt 2023, Kap. 3")} Patzelt vergleicht politische Systeme nach vier Leitvariablen (nach Manfred Hättich). Jede ist ein Kontinuum mit zwei Polen.</p>
<table class="kvq">
<tr><th>Leitvariable</th><th>Pol 1</th><th>Pol 2</th></tr>
<tr><td>Herrschaftsstruktur</td><td>monistisch (ein Machtzentrum)</td><td>gewaltenteilend</td></tr>
<tr><td>Willensbildung</td><td>monopolisiert</td><td>konkurrierend (Pluralismus)</td></tr>
<tr><td>Gestaltungsanspruch</td><td>unbegrenzt</td><td>begrenzt</td></tr>
<tr><td>Offenheit</td><td>geschlossen</td><td>offen</td></tr></table>
<p>Die ersten drei spannen einen dreidimensionalen Merkmalsraum auf. Daraus ergeben sich zwei Extremtypen und eine große Mitte:</p>
<div class="merk"><b>Typen</b><div class="mrows">
<div><span class="ml">Liberaler demokratischer Verfassungsstaat</span><span>gewaltenteilend (Verfassungsstaat), konkurrierend unter Einbeziehung aller (demokratisch), begrenzter Anspruch (liberal)</span></div>
<div><span class="ml">Totalitäre Diktatur</span><span>monistisch (Diktatur), monopolisiert (autokratisch), unbegrenzter Anspruch (totalitär)</span></div>
<div><span class="ml">Autoritäre Systeme</span><span>ziemlich monistisch, monopolisierte Willensbildung ohne Einbeziehung aller (oligarchisch), begrenzter Anspruch. Die häufigste Gruppe.</span></div></div></div>
<p>Sind Zugang zur Macht, Willensbildung und die Debatte über Gestaltungsansprüche für alle offen, spricht Patzelt mit Karl Popper von einer <b>offenen Gesellschaft</b>, sonst von einer geschlossenen.</p>
<h3>Fünf Formen der Gewaltenteilung</h3>
<table class="kvq">
<tr><td><b>sozial</b></td><td>Zugang zu Ämtern für alle Bevölkerungskreise</td></tr>
<tr><td><b>dezisiv</b></td><td>Konkurrenz von Parteien und Verbänden (Pluralismus)</td></tr>
<tr><td><b>vertikal</b></td><td>Verteilung auf Ebenen: Kommunen, Länder, Bund, EU (Subsidiarität)</td></tr>
<tr><td><b>horizontal</b></td><td>Regierung, Parlament, Gerichte kontrollieren sich gegenseitig (Vetospieler)</td></tr>
<tr><td><b>temporal</b></td><td>Ämter nur auf Zeit</td></tr></table>
<p class="small muted">Für deinen GL-Unterricht: Die Einteilung nach „wie viele herrschen, und herrschen sie gut oder schlecht?“ geht auf Aristoteles zurück (Monarchie und Tyrannis, Aristokratie und Oligarchie, Politie und Demokratie). Sie taucht bei Merkel und Patzelt als Ausgangspunkt auf und eignet sich gut für den Einstieg in Herrschaftsformen.</p>`,

{id:"v1-13", t:"Drei Demokratiemodelle", html:`
<p>${LIT("Merkel 2013")} Wie viel gehört zur Demokratie? Merkel unterscheidet drei Antworten. Das ist ein klassischer Essay-Baustein.</p>
<table class="kvq">
<tr><th>Modell</th><th>Was gehört dazu?</th><th>Vertreter</th></tr>
<tr><td><b>Minimalistisch</b></td><td>Freie, gleiche, geheime Wahlen sind die Demokratie. Parteien bieten Programme an wie auf einem Markt, die Wähler wählen aus. Nur vertikale Verantwortlichkeit. Auch „elitistisch“ genannt.</td><td>Schumpeter, Downs, der frühe Dahl, Przeworski</td></tr>
<tr><td><b>Mittel, prozedural</b></td><td>Wahlen plus Rechtsstaat und horizontale Gewaltenkontrolle. Beteiligung auch über Referenden, Zivilgesellschaft, öffentliche Debatte.</td><td>Bobbio, Habermas, Barber; Merkels Embedded Democracy</td></tr>
<tr><td><b>Maximalistisch</b></td><td>Auch der Output gehört dazu: Sicherheit, Wohlstand, Sozialstaat, vor allem eine faire Verteilung.</td><td>Bernstein, Heller, Thomas Meyer, Ringen</td></tr></table>
<h3>Merkels Abwägung</h3>
<ul><li>Gegen das Maximalmodell: Solche Leistungen sind nicht demokratiespezifisch, auch Diktaturen erbringen sie (Wachstum in China, Wohlstand in Singapur, Gleichheit in Kuba). Darum gehört der Output nicht in die <i>Definition</i>.</li>
<li>Aber: Liefert eine Demokratie nicht, sinkt ihre <b>Output-Legitimität</b>, und ihre Stabilität ist gefährdet. Seit drei Jahrzehnten wachsende Ungleichheit rückt die Verteilungsfrage wieder näher an die Demokratietheorie.</li>
<li>In Europa dominieren mittlere, prozedurale Modelle.</li></ul>
<h3>Weitere Kernsätze</h3>
<ul><li><b>Dahl</b> nennt real existierende Demokratien <b>Polyarchien</b> („public contestation and the right to participate“). Im Zentrum steht der pluralistische Wettbewerb. Laut Lauth hat Dahl sein achtes Kriterium später gestrichen.</li>
<li><b>Przeworski:</b> Demokratie ist „organisierte Unsicherheit“. Die Regeln stehen vorher fest, das Ergebnis nicht.</li>
<li><b>Habermas:</b> Bürgerrechte und politische Beteiligung sind gleichursprünglich. Weder Demokratie ohne Rechtsstaat noch Rechtsstaat ohne Beteiligung ist auf Dauer zu haben.</li></ul>
<div class="litbox"><b>Lauth ergänzt</b>Weitere Leitbilder: Rätedemokratie (imperatives Mandat, Ämterrotation), Konstitutionalismus (Machtbegrenzung, Loewenstein), soziale Demokratie (Demokratie auch in Betrieben und Schulen oder als Erzeugung sozialer Gerechtigkeit), partizipatorische und deliberative Demokratie (Barber). Auch Volkssouveränität heißt nicht unbegrenzte Herrschaft: Menschenrechte stehen nicht zur Disposition der Mehrheit.</div>`,

{id:"v1-14", t:"Autokratien: Typen und warum sie überleben", html:`
<p>${LIT("Merkel 2013, Lauth 2015")} Die meisten politischen Systeme waren lange Autokratien, die meisten davon autoritär. Wie lassen sie sich unterscheiden, und was hält sie zusammen?</p>
<h3>Typen nach der Legitimation (Merkel)</h3>
<p>Kommunistische, faschistische und theokratische Regime (autoritär oder totalitär), dazu Militärregime, rassistische Apartheidregime, Modernisierungsregime, dynastische und sultanistische Regime (autoritär). Faschistische und rassistische Autokratien sind im 21. Jahrhundert weitgehend verschwunden.</p>
<h3>Elektoraler Autoritarismus</h3>
<p>Heute häufigster Typ: Autokratien halten <b>semipluralistische Wahlen</b> ab, als demokratisches „Mäntelchen“. Die Wahlen sind manipuliert und mit Repression verbunden, meist gewinnt der Amtsinhaber, ein Rest Unsicherheit bleibt (Schedler, Levitsky/Way).</p>
<h3>Geddes: nach dem Herrschaftsträger</h3>
<table class="kvq"><tr><td><b>Einparteienregime</b></td><td>knapp 23 Jahre im Schnitt, am stabilsten: Konflikte werden in Verfahren gelöst</td></tr>
<tr><td><b>Personalistische Regime</b></td><td>15,1 Jahre, Schwachstelle ist die Nachfolgefrage</td></tr>
<tr><td><b>Militärregime</b></td><td>8,8 Jahre, Streit, ob man in die Kasernen zurückkehrt oder härter durchgreift</td></tr></table>
<p>Merkel kritisiert die personalistische Kategorie als Restkategorie, in der sehr verschiedene Herrscher landen.</p>
<h3>Drei-Säulen-Modell (WZB, Gerschewski et al. 2013)</h3>
<div class="merk"><b>Drei Säulen autokratischer Herrschaft</b><div class="mrows">
<div><span class="ml">Legitimation</span><span>normativ-ideologisch (wie diffuse support) und leistungsbezogen (wie specific support). Weil Heilsversprechen und Realität auseinanderklaffen, sind Diktaturen besonders auf ihre Leistungsbilanz angewiesen.</span></div>
<div><span class="ml">Repression</span><span>weich (Versammlungs-, Meinungs-, Pressefreiheit einschränken) oder hart (Leib und Leben). Allein trägt sie nicht: Steigt Repression, sinkt Legitimation.</span></div>
<div><span class="ml">Kooptation</span><span>Wichtige Gruppen (Wirtschaft, Militär, Sicherheitsapparat) werden mit Ämtern, Privilegien und Geld eingebunden: Korruption, Klientelismus. Rohstoffstaaten haben dafür die meisten Mittel.</span></div></div></div>
<p>Bricht eine Säule, können die anderen das eine Weile ausgleichen, aber auch überlastet werden. Dann entsteht eine <b>critical juncture</b>, in der die Opposition ihre Chance sieht.</p>
<div class="litbox"><b>Lauth ergänzt</b>Linz' Definition autoritärer Regime: begrenzter, nicht verantwortlicher Pluralismus, keine ausgearbeitete Ideologie, aber Mentalitäten, keine intensive Mobilisierung, ein Führer oder kleine Gruppe übt Macht in kaum definierten, aber vorhersagbaren Grenzen aus. Friedrich und Brzezinski nennen sechs Merkmale totalitärer Herrschaft: umfassende Ideologie, Massenpartei mit Führer, Geheimpolizei, Nachrichtenmonopol, Waffenmonopol, gelenkte Wirtschaft.</div>`,
