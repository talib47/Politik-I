<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politik I</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Politik I">
<meta name="theme-color" content="#8A2E3B">
<link rel="apple-touch-icon" href="/Politik-I/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" href="/Politik-I/icon-192.png?v=4">
<link rel="manifest" href="/Politik-I/manifest.webmanifest?v=4">
<style>
/* Layout: eine schmale Lernspalte (max. 42rem) mit fester Tableiste unten, wie die W&G-I-App; eigene Akzentfarbe (Weinrot) für Politik I; Grundgerüst und Lernformen aus Wirtschaft II */
:root{
  --bg:#F3EEEF; --surface:#FBF9F9; --ink:#241A1C; --muted:#66595C; --line:#D9CDD0;
  --accent:#8A2E3B; --accent-ink:#FFFFFF; --accent-soft:#F2DFE2;
  --good:#2F7A4A; --good-soft:#DDEEE2; --bad:#A3392B; --bad-soft:#F4DEDA; --gold:#A87B1F;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#171113; --surface:#211A1C; --ink:#EEE5E7; --muted:#AE9FA3; --line:#3E3034;
    --accent:#E7A5B0; --accent-ink:#22100F; --accent-soft:#3B2529;
    --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#171113; --surface:#211A1C; --ink:#EEE5E7; --muted:#AE9FA3; --line:#3E3034;
  --accent:#E7A5B0; --accent-ink:#22100F; --accent-soft:#3B2529;
  --good:#6CC28B; --good-soft:#1E3327; --bad:#E58373; --bad-soft:#3A2420; --gold:#D9AE55; }
*{box-sizing:border-box}
html{font-size:calc(100% * var(--z,1))}
.zoom{position:fixed;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(72px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:8px;z-index:6}
.zoom button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:22px;line-height:1;opacity:.9;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tag{display:inline-block;font-family:var(--sans);font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:999px;vertical-align:middle;white-space:nowrap}
.tag.core{color:var(--accent);border:1px solid var(--accent)}
.tag.bg{color:var(--muted);border:1px dashed var(--line)}
.cctx{margin:-4px 0 0;font-size:.82rem;color:var(--muted)}
.cinfo{display:flex;gap:8px;align-items:flex-start;margin:0;font-size:.82rem;line-height:1.45;color:var(--muted)}
.cinfo .cl{display:block}
.cinfo .cl+.cl{margin-top:3px}
.cinfo b{color:var(--ink);font-weight:600}
.cinfo .ci{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);font:600 .7rem/16px var(--serif);font-style:italic;text-align:center;margin-top:1px}
.wlink{color:var(--accent);text-decoration:none;font-weight:600;font-size:.92rem;line-height:1.4}
.wlink:hover{text-decoration:underline}
.mc .idk{border-style:dashed;color:var(--muted);text-align:center}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased}
main{max-width:42rem;margin:0 auto;padding-block:20px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;text-wrap:balance}
h1{font-size:1.75rem}
h1,h2,h3,.card .front{overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
.muted{color:var(--muted)} .small{font-size:.875rem}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 .3em}
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.9rem}
.btn.warn{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.l1{color:var(--gold);border-color:var(--gold)}
.chip.l2{color:var(--accent);border-color:var(--accent)}
.chip.l3{color:var(--good);border-color:var(--good)}
.chip.soon{border-style:dashed}

/* Klausuraufbau */
.parts{display:grid;grid-template-columns:12fr 24fr 24fr;gap:4px;margin:10px 0 8px}
.parts div{height:10px;border-radius:3px;background:var(--line)}
.parts div.on{background:var(--accent)}
.partlist{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;font-size:.92rem}
.partlist b{font-variant-numeric:tabular-nums}

/* Aufgabenliste */
.tlist{display:flex;flex-direction:column}
.titem{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.titem:first-child{border-top:0}
.titem .t{font-weight:600}
.titem .d{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--good)}

/* Aufgabe */
.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.95rem}
.data th,.data td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.data th{font-weight:600;color:var(--muted);font-size:.8rem}
.data td{font-family:var(--mono)}
.tablewrap{overflow-x:auto;margin:8px 0 2px}
.vals{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5rem,1fr));gap:6px;margin:10px 0 2px}
.vals div{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);display:flex;flex-direction:column;gap:1px;min-width:0}
.vals span{font-size:.76rem;color:var(--muted);line-height:1.3}
.vals b{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.eq{font-family:var(--mono);font-size:.92rem;background:var(--bg);border-radius:8px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 12px;font-size:.85rem;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
.step.ok{border-color:var(--good);background:var(--good-soft)}
.step.no{border-color:var(--bad);background:var(--bad-soft)}
.step .lab{font-weight:600}
.step .why{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.inp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp input{width:9.5rem;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--mono);font-size:1.05rem}
.inp input:focus{border-color:var(--accent)}
.res{font-size:.9rem;margin-top:8px}
.res.good{color:var(--good)} .res.bad{color:var(--bad)}
.hint{font-size:.88rem}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--accent)}

/* Schmierzettel */
.pad{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.pad canvas{display:block;width:100%;height:240px;touch-action:none}
.pad .tools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.pad .tools button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem}
.pad .ph{position:absolute;left:12px;top:10px;font-size:.8rem;color:var(--muted);pointer-events:none}

/* Statistik */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;margin:10px 0 4px}
.week div{background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.weekl{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.75rem;color:var(--muted);text-align:center}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.srow:first-of-type{border-top:0}
.srow.ch{grid-template-columns:1fr auto}
.srow.ch .small{grid-column:1/-1;grid-row:2}
.srow span{font-variant-numeric:tabular-nums}

/* Tableiste */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));z-index:5}
nav button{flex:1;max-width:9rem;background:none;border:0;border-radius:10px;padding:9px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){ .step{transition:background .2s,border-color .2s} }

/* ===== Lernpfad, Lektionen, Karten, Grafiken, Essay ===== */
.chap{display:grid;grid-template-columns:2.4rem 1fr auto;gap:4px 12px;align-items:center;padding:12px 2px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.chap:first-child{border-top:0}
.chap .no{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--accent);text-align:center}
.chap .t{font-weight:600;min-width:0}
.chap .d{grid-column:2/-1;font-size:.82rem;color:var(--muted)}
.chap .bar{grid-column:2/-1}
.chap.off .no,.chap.off .t{color:var(--muted)}
.chap:disabled{cursor:default}
.modes{display:flex;flex-direction:column}
.mode{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:13px 2px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.mode:first-child{border-top:0}
.mode .t{font-weight:600}
.mode .d{grid-column:1/-1;font-size:.84rem;color:var(--muted)}
.mode .n{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.today{border-color:var(--accent);background:var(--accent-soft)}
.lesson h2{margin-top:.2em}
.lesson p,.lesson li{max-width:65ch}
.lesson ul{padding-left:1.2em;margin:0 0 .8em}
.lesson li{margin:.2em 0}
.merk{border-left:4px solid var(--gold);background:var(--bg);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0}
.merk b:first-child{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.kv{width:100%;border-collapse:collapse;font-size:.9rem;margin:6px 0 10px}
.kv td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
.kv td:first-child{font-weight:600;padding-right:14px;width:34%;hyphens:auto;-webkit-hyphens:auto}
@media (max-width:560px){ .kv,.kv tbody,.kv tr,.kv td{display:block;width:100%} .kv tr{border-top:1px solid var(--line);padding:6px 0} .kv tr:first-child{border-top:0} .kv td{border:0;padding:1px 0} .kv td:first-child{width:auto} }
.mc{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.mc button{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mc button.r{border-color:var(--good);background:var(--good-soft)}
.mc button.w{border-color:var(--bad);background:var(--bad-soft)}
.mc button:disabled{cursor:default;color:var(--ink)}
.ex{font-size:.9rem;margin-top:8px}
.card{min-height:12rem;display:flex;flex-direction:column;justify-content:center;gap:10px}
.card .front{font-family:var(--serif);font-size:1.25rem;font-weight:600;text-wrap:balance}
.card .back{border-top:1px solid var(--line);padding-top:10px;white-space:pre-line}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.gbox{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.gbox svg,.gbox canvas{position:absolute;inset:0;width:100%;height:100%}
.gbox canvas{touch-action:none}
.gbox .solsvg{pointer-events:none}
.fig{width:100%;max-width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:8px 0 12px}
svg .ax{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .base{stroke:var(--ink);stroke-width:2.4;fill:none}
svg .sol{stroke:var(--accent);stroke-width:2.8;fill:none}
svg .gold{stroke:var(--gold);stroke-width:2.8;fill:none}
svg .dash{stroke-dasharray:5 5}
svg .thin{stroke-width:1.4}
svg text{fill:var(--muted);font:13px var(--sans)}
svg text.st{fill:var(--accent);font-weight:600}
svg text.bt{fill:var(--ink)}
svg .dot{fill:var(--surface);stroke:var(--ink);stroke-width:2}
svg .sdot{fill:var(--accent)}
svg .arrowhead{fill:var(--muted)}
svg .sarrow{fill:var(--accent)}
.essay textarea{width:100%;min-height:16rem;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font:1rem/1.55 var(--sans);resize:vertical}
.pts{font-variant-numeric:tabular-nums;font-weight:600}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.9rem;margin-bottom:8px}

/* ===== Strukturierte Inhalte: Begriffslisten, Gegenüberstellungen, Beispielboxen, Formeln ===== */
.eq{white-space:normal;overflow-wrap:break-word;overflow-x:visible;line-height:1.55;margin:6px 0}
.pz{color:var(--muted);font-size:.9em}
.dlist{display:grid;grid-template-columns:fit-content(42%) 1fr;margin:4px 0 8px}
.dlist>b,.dlist>span{padding:6px 0;border-top:1px solid var(--line);min-width:0;overflow-wrap:break-word}
.dlist>b{padding-right:14px;font-weight:600;hyphens:auto;-webkit-hyphens:auto}
.dlist>b:first-child,.dlist>b:first-child+span{border-top:0}
.dlist .eq{margin:4px 0 2px}
.cmp{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 10px}
.cmp th,.cmp td{border-top:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.cmp thead th{border-top:0;font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.cmp tbody th{font-weight:600;padding-left:0}
.cmp td{overflow-wrap:break-word}
@media (max-width:560px){
  .cmp:not(.tight) thead{display:none}
  .cmp:not(.tight),.cmp:not(.tight) tbody,.cmp:not(.tight) tr,.cmp:not(.tight) th,.cmp:not(.tight) td{display:block;width:100%}
  .cmp:not(.tight) tr{border-top:1px solid var(--line);padding:6px 0}
  .cmp:not(.tight) tr:first-child{border-top:0}
  .cmp:not(.tight) tbody th,.cmp:not(.tight) td{border:0;padding:2px 0}
  .cmp:not(.tight) td{display:grid;grid-template-columns:fit-content(45%) 1fr;gap:10px}
  .cmp:not(.tight) td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;padding-top:1px}
}
.bsp{border:1px solid var(--line);border-radius:12px;padding:10px 14px 4px;margin:12px 0;background:var(--bg)}
.bsp .bh,.lesson .bsp .bh{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 2px}
.bsp .dlist{margin:0}
.lesson ol.steps{padding-left:1.3em;margin:0 0 .8em}
.lesson ol.steps li{margin:.35em 0}
.card{cursor:pointer;-webkit-tap-highlight-color:transparent}
.card .cctx{margin:0;font-size:.8rem;color:var(--muted);letter-spacing:.01em}
.card .back{white-space:normal}
.card .back p{margin:0 0 .5em}
.card .back ul,.card .back ol{margin:0 0 .5em;padding-left:1.25em}
.card .back li{margin:.2em 0}
.card .back>:last-child{margin-bottom:0}
.ml ol,.ml ul{padding-left:1.25em;margin:0 0 .5em} .ml li{margin:.25em 0} .ml p{margin:0 0 .5em}
.grade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grade .btn{padding:12px 6px}
.cardpad{margin:0 0 12px}
.cardpad canvas{height:170px}
.card .tap{font-size:.78rem;color:var(--muted);margin:0}
.fb{margin-top:10px;border-left:3px solid var(--line);padding:2px 0 2px 12px;font-size:.92rem}
.fb.good{border-color:var(--good)} .fb.bad{border-color:var(--bad)} .fb.idk{border-color:var(--gold)}
.fb .fh{margin:0 0 2px;font-weight:600}
.fb.good .fh{color:var(--good)} .fb.bad .fh{color:var(--bad)} .fb.idk .fh{color:var(--gold)}
.fb .dlist{margin:0}
.unc{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip.unk{color:var(--gold);border-color:var(--gold)}
.copybox{width:100%;min-height:8rem;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-size:.85rem}
.week7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.week7 .d{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.week7 .bw{height:80px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.week7 .bw i{display:block;width:70%;max-width:2.2rem;background:var(--accent);opacity:.55;border-radius:4px 4px 0 0;min-height:2px}
.week7 .wd{font-size:.78rem;font-weight:600;margin-top:6px}
.week7 .dt{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.week7 .n{font-size:.85rem;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.week7 .u{font-size:.6rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.week7 .d.today .bw i{opacity:1}
.week7 .d.today .wd{color:var(--accent)}
.week7 .d.today{background:var(--accent-soft);border-radius:8px;padding-bottom:4px}
.klist{display:grid;grid-template-columns:fit-content(40%) 1fr;font-size:.92rem;margin:4px 0 10px}
.klist>b,.klist>span{padding:6px 0;border-top:1px solid var(--line)}
.klist>b{padding-right:14px;font-weight:600}
.klist>b:first-child,.klist>b:first-child+span{border-top:0}
#sessbar{position:sticky;top:0;z-index:7;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#sessbar .sbin{max-width:42rem;margin:0 auto;display:flex;gap:8px;align-items:center;padding:8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px))}
#sessbar .sbt{flex:1;min-width:0;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan{margin:6px 0 12px;padding-left:1.3em}
.plan li{margin:.35em 0}
.plan li span{display:block;font-size:.84rem;color:var(--muted)}
.who{font-family:var(--serif);font-size:1.2rem;font-weight:600;line-height:1.35;margin:0 0 6px}
.weak{margin:4px 0 8px;padding-left:1.2em;font-size:.92rem}
.weak li{margin:.2em 0}

<script>
"use strict";
/* ================= Speicher (eigene Schlüssel, damit nichts mit anderen Apps unter talib47.github.io kollidiert) ================= */
const KEY="p1-lernapp-v1";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
let state;
try{ state=JSON.parse(lsGet(KEY)||"null"); }catch(e){ state=null; }
if(!state||typeof state!=="object") state={};
function norm(){ for(const k of ["days","lessons","box","due","lapses","qbox","qlapses","who","outl","essays","drafts","kreuz","unclear","examDates","sessions"]) if(!state[k]||typeof state[k]!=="object") state[k]={}; }
norm();
if(state.course!=="se") state.course="vl";
function save(){ state.updated=Date.now(); lsSet(KEY,JSON.stringify(state)); schedulePush(); }

/* ===== Geräte-Abgleich über GitHub (Datei fortschritt.json im Zweig "fortschritt", wie in der W&G-I-App) ===== */
const GH={repo:"https://api.github.com/repos/talib47/Politik-I", file:"fortschritt.json", branch:"fortschritt", tokenKey:"p1-gh-token"};
GH.api=GH.repo+"/contents/"+GH.file;
let ghToken=null, remoteSha=null, syncStatus="aus", lastSync=null, pushTimer=null, pushing=false, pushAgain=false;
function initToken(){
  const m=location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey,m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken=lsGet(GH.tokenKey);
}
const ghHeaders=()=>({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc=str=>btoa(unescape(encodeURIComponent(str)));
const b64dec=str=>decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
async function ensureBranch(){
  const r=await fetch(GH.repo+"/git/ref/heads/"+GH.branch,{headers:ghHeaders(),cache:"no-store"});
  if(r.ok) return true;
  const base=await fetch(GH.repo,{headers:ghHeaders(),cache:"no-store"}); if(!base.ok) return false;
  const def=(await base.json()).default_branch||"main";
  const h=await fetch(GH.repo+"/git/ref/heads/"+def,{headers:ghHeaders(),cache:"no-store"}); if(!h.ok) return false;
  const sha=(await h.json()).object.sha;
  const c=await fetch(GH.repo+"/git/refs",{method:"POST",headers:ghHeaders(),body:JSON.stringify({ref:"refs/heads/"+GH.branch,sha})});
  return c.ok;
}
async function pull(){
  if(!ghToken) return null;
  const r=await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); remoteSha=d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0;attempt<3;attempt++){
      const body={message:"Lernstand",branch:GH.branch,content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r=await fetch(GH.api,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401){ syncStatus="schluessel"; break; }
      if(r.status===404){ if(!(await ensureBranch())){ syncStatus="fehler"; break; } continue; }  // Zweig fehlt noch: anlegen
      if(r.status===409||r.status===422){ await pull(); continue; }  // veraltete Version: neu holen und nochmal
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>{ pushTimer=null; push(); },1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }
/* Neuerer Stand gewinnt (Zeitstempel "updated") */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote=await pull();
    if(remote===null) return false;
    if(remote.updated && remote.updated>(state.updated||0)){ state=Object.assign(state,remote); norm(); lsSet(KEY,JSON.stringify(state)); syncStatus="ok"; lastSync=new Date(); return true; }
    if((state.updated||0)>(remote.updated||0)) await push();
    else { syncStatus="ok"; lastSync=new Date(); }
  }catch(e){ syncStatus="fehler"; }
  return false;
}
async function autoPull(){
  if(!ghToken||document.visibilityState!=="visible"||["exam","essay","lesson","cards","kreuz","recall","who","outline"].includes(view)||pushTimer||pushing) return;
  if(await syncFromRemote()) render();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPush(); else autoPull(); });
window.addEventListener("pagehide",flushPush);
window.addEventListener("focus",autoPull);
setInterval(autoPull,30000);
function syncBox(){
  if(!ghToken) return `<div class="block"><h3>Geräte verbinden</h3>
    <p class="small muted">Damit iPad, iPhone und Laptop denselben Stand haben, verbinde jedes Gerät einmal. Am einfachsten öffnest du dafür deinen Verbindungslink (Adresse der App mit #t=Schlüssel am Ende).</p>
    <label class="small muted" for="tkIn">Oder füge hier deinen GitHub-Schlüssel ein (beginnt mit github_pat_):</label>
    <textarea id="tkIn" style="width:100%;min-height:70px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;font-family:var(--mono);font-size:.85rem"></textarea>
    <button class="btn" id="tkGo" style="margin-top:8px">Gerät verbinden</button></div>`;
  const msg={ok:`Dieses Gerät ist verbunden und gleicht automatisch ab${lastSync?", zuletzt um "+lastSync.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):""}.`,
    fehler:"Abgleich gerade nicht möglich, etwa ohne Internet. Dein Stand bleibt auf diesem Gerät und wird später abgeglichen.",
    schluessel:"Der Schlüssel funktioniert nicht. Prüfe, ob er Zugriff auf das Repository Politik-I hat, oder verbinde mit einem neuen Schlüssel.",
    aus:"Wird abgeglichen …"}[syncStatus];
  return `<div class="block"><h3>Geräte-Abgleich</h3>
    <p class="small" ${syncStatus==="ok"?'style="color:var(--muted)"':'style="color:var(--bad)"'}>${msg}</p>
    <div class="row"><button class="btn ghost small" id="syNow">Jetzt abgleichen</button><button class="btn ghost small" id="syOff">Gerät trennen</button></div></div>`;
}
function bindSync(){
  const goB=$("#tkGo");
  if(goB) goB.onclick=async()=>{
    const t=$("#tkIn").value.trim();
    if(!/^github_pat_\w+$/.test(t)){ toast("Das sieht nicht nach einem Schlüssel aus. Er beginnt mit github_pat_."); return; }
    lsSet(GH.tokenKey,t); ghToken=t; toast("Verbinde …");
    await syncFromRemote(); toast(syncStatus==="ok"?"Gerät verbunden":"Verbinden hat nicht geklappt"); render();
  };
  const now=$("#syNow");
  if(now) now.onclick=async()=>{ flushPush(); await syncFromRemote(); toast(syncStatus==="ok"?"Abgeglichen":"Abgleich hat nicht geklappt"); render(); };
  const off=$("#syOff");
  if(off) off.onclick=()=>{ if(!off.dataset.armed){ off.dataset.armed="1"; off.textContent="Wirklich trennen"; return; } lsDel(GH.tokenKey); ghToken=null; syncStatus="aus"; render(); };
}

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const isInt=x=>Math.abs(x-Math.round(x))<1e-9;
const nice=(x,dec)=>Math.abs(x*10**dec-Math.round(x*10**dec))<1e-7;
const r=x=>Math.round(x*1e6)/1e6;
function fmt(x){
  x=r(x); if(Object.is(x,-0)) x=0;
  let s=String(Math.abs(x)); if(s.includes("e")) s=Math.abs(x).toFixed(6).replace(/0+$/,"");
  s=s.replace(".",","); return (x<0?"−":"")+s;
}
const par=x=>x<0?"("+fmt(x)+")":fmt(x);
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseNum(v){
  let t=String(v).trim().replace(/\s|€/g,"").replace(/−|–/g,"-");
  const pct=t.includes("%"); t=t.replace("%","");
  if(t.includes(",")) t=t.replace(/\./g,"").replace(",",".");
  if(t===""||t==="-"||isNaN(+t)) return null;
  return {v:+t,pct};
}
const close=(a,b)=>Math.abs(a-b)<=Math.max(0.011,Math.abs(b)*0.005);
function judge(step,raw){
  const p=parseNum(raw); if(!p) return null;
  let v=p.v;
  if(step.tol!=null) return Math.abs(v-step.ans)<=step.tol;
  if(step.rate){ if(p.pct) v=v/100; return close(v,step.ans)||close(v/100,step.ans); }
  if(step.pct){ return close(v,step.ans)||close(v*100,step.ans); }
  return close(v,step.ans);
}

/* ================= Inhalte: Gliederung =================
   Zwei Veranstaltungen im Modul Grundlagen Politik I, getrennt geprüft:
   vl = Vorlesung „Politische Systeme im Vergleich“ (PD Dr. Julia Schwanholz), Prüfung: Essay 60 Min., unbenotet
   se = Seminar „Das politische System Deutschlands und der EU“ (Dr. Schwarz, online), Prüfung laut Modulbeschreibung: Klausur 60 Min. + Vortrag 10 Min.
   n ist die interne Kapitelnummer (Vorlesung 1–10, Seminar ab 101), no die angezeigte Nummer.
   Lektions-, Karten- und Aufgaben-IDs bleiben stabil, auch wenn Kapitel umgestellt werden.
   Grundlage Vorlesung: Folien Schwanholz WiSe 26/27 und Vorlesungsplan (Folien 3–6, Moodle). */
const COURSES={
  vl:{short:"Vorlesung", who:"Schwanholz", title:"Politische Systeme im Vergleich", eyebrow:"Politik I · Vorlesung · Schwanholz"},
  se:{short:"Seminar", who:"Dr. Schwarz", title:"Das politische System Deutschlands und der EU", eyebrow:"Politik I · Seminar · Dr. Schwarz"}
};
const CHAPTERS=[
  {n:1,  c:"vl", no:1,  date:"15.10.", title:"Politik, Politikwissenschaft, Demokratie und Autokratie", teaser:"Politikbegriff (Polity, Politics, Policy), politisches System nach Easton und Almond/Powell, Herrschaftsformen nach Lauth, Dahl und Merkel, Embedded Democracy. Dazu die Selbstlernphase (22. und 29.10.)."},
  {n:2,  c:"vl", no:2,  date:"05.11.", title:"Demokratien bestimmen, Regierungssysteme, Grundgesetz", teaser:"Landkarte der Demokratien, Präsidentialismus und Parlamentarismus (Steffani, Lijphart), konstitutionelle Grundlagen und Grundprinzipien des Grundgesetzes, die EU im GG."},
  {n:3,  c:"vl", no:3,  date:"12.11.", title:"Mehrebenensystem Europäische Union", teaser:"Das politische System der EU. Gastvortrag Dr. Alexander Hoppe."},
  {n:4,  c:"vl", no:4,  date:"19.11.", title:"Strukturmerkmale des Regierens, Verfassungsorgane I", teaser:"Gewaltenteilung, Föderalismus und Unitarismus, Bund, Länder und Kommunen. Bundespräsident, Bundesrat, Staatsoberhäupter anderer Länder (online)."},
  {n:5,  c:"vl", no:5,  date:"26.11.", title:"Verfassungsorgane II", teaser:"Bundesregierung, Bundestag, Bundesverfassungsgericht. Regierungen, Parlamente und Supreme Courts anderer Länder."},
  {n:6,  c:"vl", no:6,  date:"03.12.", title:"Demokratische Legitimation", teaser:"Repräsentation, Responsivität, politische Kommunikation. Gastvortrag Dr. Janis Hülder (Schulministerium NRW)."},
  {n:7,  c:"vl", no:7,  date:"10.12.", title:"Parteien und Parteiensysteme", teaser:"Parteientheorie, Entstehung politischer Parteien, Parteiensysteme."},
  {n:8,  c:"vl", no:8,  date:"17.12.", title:"Wahlrecht, Wahlen und Wahlverhalten", teaser:"Wahlsysteme und Wahlreformen, Wahlverhalten, Nichtwahl."},
  {n:9,  c:"vl", no:9,  date:"07.01.", title:"Herausforderungen für die Demokratie", teaser:"Populismus und Extremismus, extreme Rechte im Vergleich (Heinze 2022, Lewandowsky 2025; online)."},
  {n:10, c:"vl", no:10, date:"14.01.", title:"Polarisierung, Fallstudien und Vergleiche", teaser:"Typen von Polarisierung und lokale Ebene (Schwanholz 2026), Fallstudien, MSS- und MDS-Designs (online)."}
];
const LESSONS={}, CARDS={}, ESSAYS=[], KREUZ=[];
/* Kapitel einer Veranstaltung, und ob ein Kapitel schon Inhalte hat */
const courseChs=(c=state.course)=>CHAPTERS.filter(x=>x.c===c);
const chOf=n=>CHAPTERS.find(c=>c.n===n);

/* ================= Textformat: Karten, Rückmeldungen, Beispielboxen =================
   Schreibweise in den Inhalten (Karten-Rückseite b, Beispielboxen):
   - Zeilen mit "- " werden Aufzählung, "1. " nummerierte Schritte
   - "Begriff: Erklärung" wird Begriff fett, Erklärung daneben
   - "$ Formel" wird Formelbox (bricht auf dem Handy um)
   - "| Kopf | A | B" (mehrere Zeilen) wird Gegenüberstellung, auf dem Handy gestapelt
   - **fett**, Y^N hochgestellt, Y_POT tiefgestellt; Klammern mit Wörtern werden leiser gesetzt */
const nb=s=>String(s).replace(/(\d) (%|€|Prozentpunkte|Punkte|P\.|Tage|Minuten)/g,"$1&nbsp;$2");
const subsup=s=>s.replace(/([A-Za-zΠ*])\^([A-Za-z]+)/g,"$1<sup>$2</sup>").replace(/([A-Za-zΠ])_([A-Za-zΠ]{1,8})/g,"$1<sub>$2</sub>");
const quietParens=s=>s.replace(/\(([^()]{2,})\)/g,(m,x)=>/^[A-Za-zÄÖÜäöüß„]/.test(x)&&/[A-Za-zÄÖÜäöüß]{3,}/.test(x)&&!/[=+−·<>\/]/.test(x)?`<span class="pz">(${x})</span>`:m);
const inl=s=>quietParens(subsup(nb(String(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"))));
const fx=s=>subsup(nb(s));
const TERM=/^([^:=⇒]{1,42}): (.+)$/;
function cmp(rows){
  const h=rows[0], body=rows.slice(1);
  const tight=rows.every(r=>r.every(c=>String(c).replace(/\*\*/g,"").length<=18));
  return `<table class="cmp${tight?" tight":""}"><thead><tr>${h.map(x=>`<th>${inl(x)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr><th scope="row">${inl(r[0])}</th>${r.slice(1).map((c,j)=>`<td data-l="${esc(String(h[j+1]).replace(/\*\*/g,"").replace(/[\^_]/g,""))}"><span>${inl(c)}</span></td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function richText(b){
  const L=String(b).split("\n"); let out="", kind=null, items=[];
  const flush=()=>{ if(!kind) return;
    if(kind==="dl") out+=`<div class="dlist">${items.join("")}</div>`;
    else out+=`<${kind}>${items.map(x=>`<li>${x}</li>`).join("")}</${kind}>`;
    kind=null; items=[]; };
  const open=k=>{ if(kind!==k){ flush(); kind=k; } };
  for(let i=0;i<L.length;i++){ const l=L[i].trim(); let m;
    if(!l){ flush(); continue; }
    if((m=l.match(/^\$ ?(.*)$/))){ const box=`<div class="eq">${fx(m[1])}</div>`;
      if((kind==="ol"||kind==="ul")&&items.length) items[items.length-1]+=box; else { flush(); out+=box; } continue; }
    if(l.startsWith("|")){ flush(); const rows=[];
      while(i<L.length&&L[i].trim().startsWith("|")){ rows.push(L[i].trim().replace(/^\||\|$/g,"").split("|").map(x=>x.trim())); i++; }
      i--; out+=cmp(rows); continue; }
    if((m=l.match(/^[-•] (.*)$/))){ open("ul"); items.push(termInline(m[1])); continue; }
    if((m=l.match(/^\d+[.)] (.*)$/))){ open("ol"); items.push(termInline(m[1])); continue; }
    if((m=l.match(TERM))){ open("dl"); items.push(`<b>${inl(m[1])}</b><span>${inl(m[2])}</span>`); continue; }
    flush(); out+=`<p>${inl(l)}</p>`;
  }
  flush(); return out;
}
function termInline(s){ const m=s.match(TERM); return m? `<b>${inl(m[1])}:</b> ${inl(m[2])}` : inl(s); }
/* Beispielbox für Lektionen: links Label, rechts Inhalt */
function bsp(title,rows){ return `<div class="bsp"><p class="bh">${title}</p><div class="dlist">${rows.map(([k,v])=>`<b>${k}</b><span>${v.split("\n").map(x=>x.startsWith("$")?`<div class="eq">${fx(x.replace(/^\$ ?/,""))}</div>`:inl(x)).join("<br>")}</span>`).join("")}</div></div>`; }

async function copyText(text,holder){

/* ================= Zeichenfläche für den Stift (Schreibfeld auf Karten) ================= */
function drawSurface(c,strokes){
  const ctx=c.getContext("2d"); let penSeen=false, curS=null;
  const color=()=>getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#8A2E3B";
  function size(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
  function draw(){ const r=c.getBoundingClientRect(); ctx.clearRect(0,0,r.width,r.height); ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle=color();
    for(const s of strokes){ for(let i=1;i<s.length;i++){ ctx.lineWidth=s[i][2]; ctx.beginPath(); ctx.moveTo(s[i-1][0]*r.width,s[i-1][1]*r.height); ctx.lineTo(s[i][0]*r.width,s[i][1]*r.height); ctx.stroke(); } } }
  const pt=e=>{ const r=c.getBoundingClientRect(); const p=e.pressure&&e.pointerType==="pen"?e.pressure:.5; return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,1.2+p*2.6]; };
  c.onpointerdown=e=>{ if(e.pointerType==="pen") penSeen=true; if(penSeen&&e.pointerType==="touch") return; curS=[pt(e)]; strokes.push(curS); try{c.setPointerCapture(e.pointerId);}catch(x){} };
  c.onpointermove=e=>{ if(!curS) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; for(const ev of evs) curS.push(pt(ev)); draw(); };
  c.onpointerup=c.onpointercancel=()=>{ curS=null; };
  size(); window.addEventListener("resize",size);
  return {undo(){ strokes.pop(); draw(); }, clear(){ strokes.length=0; draw(); }};
}

/* ================= Fortschritt ================= */
function lessonState(id){ return (state.lessons||{})[id]; }
function cardBox(id){ return (state.box||{})[id]||0; }
function chapterProgress(n){
  const L=LESSONS[n]||[], K=CARDS[n]||[], X=kreuzOf(n), W=essaysOf(n);
  if(!L.length) return null;
  const l=L.filter(x=>lessonState(x.id)).length/L.length;
  const k=K.length? K.filter(x=>cardBox(x.id)>=3).length/K.length : 1;
  const x=X.length? X.filter(i=>(kzStat(i.id)||{}).best===4).length/X.length : 1;
  const w=W.length? W.filter(i=>essayScore(i.id)).length/W.length : 1;
  const parts=[[l,.3,1],[k,.3,K.length],[x,.2,X.length],[w,.2,W.length]].filter(p=>p[2]);
  const wsum=parts.reduce((s,p)=>s+p[1],0);
  return {l,k,x,w,total:Math.round(parts.reduce((s,p)=>s+p[0]*p[1],0)/wsum*100)};
}
/* Was ist als Nächstes dran? Theorie zuerst, dann Karten, Selbsttest, Schreiben */
function nextStep(){
  for(const ch of courseChs()){ const n=ch.n; if(!isReady(n)) continue;
    const L=LESSONS[n], li=L.findIndex(x=>!lessonState(x.id));
    if(li>=0) return {label:`Sitzung ${ch.no} · Theorie`, title:L[li].t, go:()=>openLesson(n,li), lesson:true};
    if((CARDS[n]||[]).some(x=>!isSeen(x.id))) return {label:`Sitzung ${ch.no} · Karten`, title:"Begriffe festigen", go:()=>openCards(n)};
    if(kreuzOf(n).some(x=>!kzStat(x.id))) return {label:`Sitzung ${ch.no} · Selbsttest`, title:"Wahr oder falsch?", go:()=>openKreuz(n)};
    if(essaysOf(n).some(x=>!essayScore(x.id))) return {label:`Sitzung ${ch.no} · Schreiben`, title:"Essay-Fragen üben", go:()=>openEssay(n)};
  }
  if(!readyNs().length) return null;
  return {label:"Wiederholen", title:"Gemischt üben hält alles frisch", go:()=>openCards(0)};
}

function openLesson(n,i){ cur.ch=n; cur.li=i; cur.ans={}; cur.shown={}; go("lesson"); }
/* Tabellen in Lektionen aufbereiten: Begriffspaare ohne Kopfzeile werden Liste (Begriff fett),
   Tabellen mit Kopfzeile werden Gegenüberstellung, die auf dem Handy gestapelt wird */
function enhanceLesson(root){
  root.querySelectorAll("table.kvq").forEach(t=>{
    const rows=[...t.rows]; if(!rows.length) return;
    const head=rows[0].querySelectorAll("th").length===rows[0].cells.length && rows[0].cells.length>1;
    if(!head && rows.every(r=>r.cells.length===2)){
      const d=document.createElement("div"); d.className="dlist";
      rows.forEach(r=>{ const b=document.createElement("b"), s=document.createElement("span"); b.innerHTML=r.cells[0].innerHTML; s.innerHTML=r.cells[1].innerHTML; d.append(b,s); });
      t.replaceWith(d); return;
    }
    if(head){
      const H=[...rows[0].cells].map(c=>c.textContent.trim());
      const body=rows.slice(1); if(!body.length) return;
      const tight=rows.every(r=>[...r.cells].every(c=>c.textContent.trim().length<=18));
      const tb=document.createElement("table"); tb.className="cmp"+(tight?" tight":"");
      tb.innerHTML=`<thead><tr>${H.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>{
        if(r.cells.length===1||r.cells[0].colSpan>1) return `<tr><th scope="row" colspan="${H.length}">${r.cells[0].innerHTML}</th></tr>`;
        const c=[...r.cells]; return `<tr><th scope="row">${c[0].innerHTML}</th>${c.slice(1).map((x,j)=>`<td data-l="${esc(H[j+1]||"")}"><span>${x.innerHTML}</span></td>`).join("")}</tr>`; }).join("")}</tbody>`;
      t.replaceWith(tb);
    }
  });
}

/* Alte Schreibweise der Rückseiten in das gemeinsame Textformat (format.js) übersetzen:
   „A vs. B“ mit Zeilen „Merkmal: a / b“ wird Gegenüberstellung, einfache Zeilen werden Aufzählung */
function toRich(c){
  const lines=String(c.b).split("\n").map(s=>s.trim()).filter(Boolean);
  if(lines.length===1) return lines[0];
  const vs=c.f.split(/\s+vs\.\s+/), kv=/^([^:]{1,38}):\s+(.+)$/;
  if(vs.length===2 && lines.every(l=>kv.test(l)&&l.match(kv)[2].includes(" / ")))
    return ["| | "+vs.map(x=>x.replace(/[?:]$/,"")).join(" | ")].concat(lines.map(l=>{ const m=l.match(kv), p=m[2].split(" / "); return `| ${m[1]} | ${p[0]} | ${p.slice(1).join(" / ")}`; })).join("\n");
  return lines.map(l=>/^\d+[.)] /.test(l)||/^[-•] /.test(l)||/^([^:=⇒]{1,42}): (.+)$/.test(l)&&!/[.!?]$/.test(l.split(":")[0])&&!/,\s/.test(l.split(":")[0])?l:"- "+l).join("\n");
}
const DECK_NAME={b:"Begriffe", br:"Begriffe umgekehrt"};

const deckBack=n=>DECK_NAME[n]?go("terms"):n?go("chapter"):go("practice");
function allCards(n){
  if(DECK_NAME[n]) return (CARDS[n]||[]).filter(x=>termCourse(x.id)===state.course);
  if(n) return CARDS[n]||[];
  return courseChs().flatMap(c=>CARDS[c.n]||[]).concat(allCards("b"),allCards("br"));
}
function chapterOfCard(id){ for(const ch of CHAPTERS) if((CARDS[ch.n]||[]).some(x=>x.id===id)) return "Sitzung "+ch.no+" · "+ch.title; return ""; }
const INTERVAL=[0,0,1,3,7,16];   // Tage bis zur nächsten Abfrage je Fach; Fach 5 erneut gewusst: 35 Tage
const dayStart=(t=Date.now())=>{ const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const isSeen=id=>!!(state.box||{})[id];
const isDue=id=>isSeen(id) && ((state.due||{})[id]||0)<=Date.now();
function dueCards(n){ return allCards(n).filter(x=>isDue(x.id)).sort((a,b)=>((state.due||{})[a.id]||0)-((state.due||{})[b.id]||0)); }
function openCards(n,free,deck){ cur.cardCh=n; cur.free=!!free; cur.deck=deck?deck.slice():(free?buildDeck(n):buildDueDeck(n)); cur.ci=0; cur.flip=false; cur.right=0; cur.unsure=0; cur.cstrokes=[]; cur.requeued={}; go("cards"); }
function buildDueDeck(n){
  const due=dueCards(n), fresh=n? allCards(n).filter(x=>!isSeen(x.id)) : [];
  return due.concat(fresh).slice(0,Math.max(10,Math.min(due.length,30)));
}
function buildDeck(n){
  const pool=allCards(n).slice(), deck=[];
  while(deck.length<Math.min(10,pool.length)){
    const w=pool.map(x=>[6,5,4,3,2,1][cardBox(x.id)]); let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0;
    for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } deck.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return deck;
}
function renderCards(){

    ${cur.pad?`<div class="pad cardpad"><span class="ph">Hier hinschreiben</span><canvas id="cpad" aria-label="Schreibfeld für die Antwort"></canvas><div class="tools"><button id="cpU">Zurück</button><button id="cpX">Leeren</button></div></div>`:""}
    ${cur.flip?`<div class="grade"><button class="btn warn" id="no">Nicht gewusst</button><button class="btn ghost" id="mid">Unsicher</button><button class="btn" id="yes">Sicher</button></div>`
      :`<div class="row"><button class="btn" id="flip" style="flex:1">Antwort zeigen</button><button class="btn ghost" id="padT">${cur.pad?"Schreibfeld aus":"Schreibfeld"}</button></div><p class="small muted" style="margin-top:8px">Erst antworten, im Kopf oder im Schreibfeld, dann aufdecken. Ehrlich bewerten: „Unsicher“, wenn du nur ungefähr wusstest.</p>`}`;
  bindCrumb(()=>deckBack(n));
  if($("#flip")) $("#flip").onclick=()=>{ cur.flip=true; renderCards(); };
  const cd=$("#card"); cd.onclick=e=>{ if(e.target.closest("a")) return; cur.flip=!cur.flip; renderCards(); };
  cd.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); cd.click(); } };

  if($("#padT")) $("#padT").onclick=()=>{ cur.pad=!cur.pad; renderCards(); };
  /* Bewertung: 2 sicher (nächstes Fach), 1 unsicher (Fach bleibt, morgen wieder), 0 nicht gewusst (Fach 1, gleich nochmal) */
  const grade=lv=>{ const b0=cardBox(c.id), old=state.due[c.id]||0;
    const b1= lv===2? Math.min(5,Math.max(b0,1)+1) : lv===1? Math.max(1,b0) : 1;
    const nd= lv===2? dayStart()+(b0===5?35:INTERVAL[b1])*864e5 : lv===1? dayStart()+864e5 : Date.now();
    if(!cur.free){ state.box[c.id]=b1; state.due[c.id]=nd; }
    else if(lv<2){ state.box[c.id]=Math.min(b0||1,b1); state.due[c.id]=Math.min(old||nd,nd); }
    if(lv===2) cur.right++; else if(lv===1) cur.unsure++;
    else { state.lapses[c.id]=(state.lapses[c.id]||0)+1; if((cur.requeued[c.id]||0)<2){ cur.requeued[c.id]=(cur.requeued[c.id]||0)+1; D.push(c); } }
    logDay(); save(); cur.ci++; cur.flip=false; cur.cstrokes=[]; renderCards(); };
  if($("#yes")) $("#yes").onclick=()=>grade(2);
  if($("#mid")) $("#mid").onclick=()=>grade(1);
  if($("#no")) $("#no").onclick=()=>grade(0);
}

      return `<div class="srow ch"><span>Sitzung ${c.no}: ${c.title}</span><span class="small muted">${[["Theorie",p.l,1],["Karten",p.k,(CARDS[c.n]||[]).length],["Selbsttest",p.x,kreuzOf(c.n).length],["Schreiben",p.w,essaysOf(c.n).length]].filter(x=>x[2]).map(x=>x[0]+" "+Math.round(x[1]*100)+" %").join(" · ")}</span><span class="pts">${p.total} %</span></div>`;}).join(""):`<p class="small muted" style="margin:0">Noch keine Sitzungen mit Inhalten.</p>`}</div>
    ${syncBox()}
    <div class="block"><h3>Fortschritt zurücksetzen</h3><p class="small muted">Löscht deinen gesamten Lernstand (Vorlesung und Seminar), auch auf den verbundenen Geräten.</p>
      <button class="btn warn" id="rst">${statsArmed?"Wirklich zurücksetzen":"Zurücksetzen"}</button></div>`;
  bindSync(); bindExamPlan(); bindWeak();
  $("#rst").onclick=()=>{ if(!statsArmed){ statsArmed=true; render(); return; } const c=state.course; state={}; norm(); state.course=c; save(); flushPush(); statsArmed=false; toast("Zurückgesetzt"); render(); };
}

/* ================= Verständnisfragen: erst selbst abrufen, dann Auswahl; Wiederholung mit Abstand (aus Wirtschaft II) =================
   Jede Frage aus den Lektionen bekommt ein eigenes Fach wie eine Karteikarte (state.qbox), ID = Lektions-ID#Nummer.
   Ältere Antworten (vor dieser Funktion) werden aus state.lessons abgeleitet, ohne etwas zu speichern.
   c.w[k] erklärt, warum genau Antwort k falsch ist. */
const qid=(lid,j)=>lid+"#"+j;
function allQuestions(c=state.course){ const out=[]; for(const ch of CHAPTERS.filter(x=>x.c===c)) for(const L of (LESSONS[ch.n]||[])) L.check.forEach((q,j)=>out.push({id:qid(L.id,j), lid:L.id, n:ch.n, c:q, lt:L.t, li:(LESSONS[ch.n]||[]).indexOf(L)})); return out; }
function qInfo(id){
  const s=(state.qbox||{})[id]; if(s) return s;
  const ls=(state.lessons||{})[id.split("#")[0]]; if(!ls) return null;
  return ls.ok? {b:2, due:dayStart(ls.t)+3*864e5} : {b:1, due:dayStart(ls.t)+864e5};
}
function qDue(){ const now=Date.now(); return allQuestions().filter(q=>{ const s=qInfo(q.id); return s&&s.due<=now; }).sort((a,b)=>qInfo(a.id).due-qInfo(b.id).due); }
/* richtig: nächstes Fach; falsch oder „Weiß ich nicht“: Fach 1, morgen wieder (ohne Strafe in der Statistik bei „Weiß ich nicht“) */
function qGrade(id,ok,idk){
  const s=qInfo(id)||{b:0};
  const b1= ok? Math.min(5,Math.max(s.b,1)+1) : 1;
  state.qbox[id]={b:b1, due:dayStart()+(ok?(s.b===5?35:INTERVAL[b1]):1)*864e5};
  if(!ok&&!idk) state.qlapses[id]=(state.qlapses[id]||0)+1;
}
/* Reihenfolge der Antworten je Frage und Tag gemischt (damit man sich nicht die Position merkt), beim Neuzeichnen stabil */
function optOrder(c){ let h=dayStart()/864e5|0; for(const ch of c.q) h=(h*31+ch.charCodeAt(0))>>>0;
  const idx=c.o.map((_,k)=>k); for(let i=idx.length-1;i>0;i--){ h=(h*1103515245+12345)>>>0; const j=h%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; } return idx; }
/* Eine Frage: erst nur die Frage, dann auf Wunsch die Auswahl */
function qBlock(c,key,a,shown,first){
  const opts= a!==undefined || shown;
  return `<div class="qb" style="margin-top:${first?4:18}px"><p style="margin:0"><b>${inl(c.q)}</b></p>
    ${opts?`<div class="mc">${optOrder(c).map(k=>{ const o=c.o[k], cls=a===undefined?"":(k===c.a?"r":(k===a?"w":""));
        return `<button data-q="${key}" data-k="${k}" class="${cls}" ${a!==undefined?"disabled":""}>${inl(o)}</button>`; }).join("")}
        ${a===undefined?`<button data-q="${key}" data-k="-1" class="idk">Weiß ich nicht</button>`:""}</div>`
      :`<p class="small muted" style="margin:6px 0 8px">Erst selbst überlegen, am besten in einem Satz. Dann die Auswahl zeigen.</p>
        <div class="row"><button class="btn small" data-show="${key}">Auswahl zeigen</button><button class="btn ghost small" data-q="${key}" data-k="-1">Weiß ich nicht</button></div>`}
    ${a!==undefined?feedback(c,a):""}</div>`;
}
/* Übungsmodus: fällige Verständnisfragen */
function openRecall(list,n){ const L=list||qDue().slice(0,8); cur.rq={list:L, i:0, ans:undefined, shown:false, right:0, n:n||0}; go("recall"); }
function renderRecall(){
  const R=cur.rq, L=R.list, back=R.n?chLabel(R.n):"Üben", backFn=()=>{ if(R.n){ cur.ch=R.n; go("chapter"); } else go("practice"); };
  if(R.i>=L.length){
    const left=qDue().length;
    $("#app").innerHTML=`${backTo(back)}<h1>${L.length?"Runde geschafft":"Nichts fällig"}</h1><div class="block">
      ${L.length?`<p>${R.right} von ${L.length} richtig.</p>`:`<p>Gerade ist keine Verständnisfrage fällig. Neue Fragen kommen mit jeder Lektion dazu.</p>`}
      <p class="small muted">Richtige Fragen kommen nach 1, 3, 7, 16 und 35 Tagen wieder, falsche und „Weiß ich nicht“ schon morgen. ${left?`Noch ${left} fällig.`:""}</p>
      <div class="row">${sess?sessBtn():`${left?`<button class="btn" id="rAgain">Weiter</button>`:""}<button class="btn ghost" id="rOut">Fertig</button>`}</div></div>`;
    bindCrumb(backFn); if($("#rAgain")) $("#rAgain").onclick=()=>openRecall(null,R.n); if($("#rOut")) $("#rOut").onclick=backFn; return;
  }
  const q=L[R.i], ch=chOf(q.n);
  $("#app").innerHTML=`${backTo(back)}
    <p class="eyebrow">Verständnisfrage ${R.i+1} von ${L.length}</p>
    <div class="block"><p class="small muted" style="margin:0 0 2px">Sitzung ${ch.no} · ${q.lt}</p>${qBlock(q.c,"r",R.ans,R.shown,true)}</div>
    ${R.ans!==undefined?`<div class="row"><button class="btn" id="rNext">Weiter</button><button class="btn ghost" id="rLes">Zur Lektion</button></div>`:""}`;
  bindCrumb(backFn);
  document.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{ R.shown=true; renderRecall(); });
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{ if(R.ans!==undefined) return; const k=+b.dataset.k; R.ans=k; const ok=k===q.c.a; if(ok) R.right++; qGrade(q.id,ok,k===-1); logDay(); save(); renderRecall(); });
  if($("#rNext")) $("#rNext").onclick=()=>{ R.i++; R.ans=undefined; R.shown=false; renderRecall(); window.scrollTo(0,0); };
  if($("#rLes")) $("#rLes").onclick=()=>openLesson(q.n,q.li);
}

/* ================= „Was gehört wohin?“: Zuordnungstraining (Idee aus Wirtschaft II, „Wer sagt das?“) =================
   Mehrere Zuordnungsarten (WHO_SETS): Autor, Regimetyp, Teilregime der Embedded Democracy, Polity/Politics/Policy.
   Ein Eintrag: id (bleibt fest), set, ch (Sitzung), t (Aussage oder Merkmal), s (richtige Kategorie),
   alt (ähnliche Kategorien, die nicht als falsche Antwort angeboten werden), ex (Begründung aus Folie oder Lektüre).
   Verwechslungen werden gespeichert (state.who[id].conf) und kommen öfter. Inhalte je Sitzung in content_*.js. */
const WHO_SETS={};
const WHO=[];
const whoOf=n=>n? WHO.filter(x=>x.ch===n) : WHO.filter(x=>isReady(x.ch)&&chOf(x.ch).c===state.course);
function whoOptions(x){
  const S=WHO_SETS[x.set], all=Object.keys(S.opts);
  if(all.length<=4) return all.slice();
  const pool=all.filter(k=>k!==x.s&&!(x.alt||[]).includes(k));
  return shuffle([x.s].concat(shuffle(pool).slice(0,3)));
}
function whoPick(n,ch){
  const st=state.who||{}, pool=whoOf(ch).slice(), out=[];
  const w=pool.map(x=>{ const h=st[x.id]; return !h?3 : h.last?1 : 5; });
  while(out.length<Math.min(n,pool.length)){ let r=Math.random()*w.reduce((a,b)=>a+b,0), i=0; for(;i<pool.length;i++){ r-=w[i]; if(r<=0) break; } i=Math.min(i,pool.length-1); out.push(pool.splice(i,1)[0]); w.splice(i,1); }
  return out;
}
function openWho(n,ch){ cur.wh={list:whoPick(n||8,ch).map(x=>({x,o:whoOptions(x)})), i:0, a:null, right:0, ch:ch||0}; go("who"); }
function renderWho(){
  const W=cur.wh, L=W.list, back=W.ch?chLabel(W.ch):"Üben", backFn=()=>{ if(W.ch){ cur.ch=W.ch; go("chapter"); } else go("practice"); };
  if(W.i>=L.length){
    $("#app").innerHTML=`${backTo(back)}<h1>${L.length?"Runde geschafft":"Noch nichts zum Zuordnen"}</h1><div class="block">${L.length?`<p>${W.right} von ${L.length} richtig zugeordnet.</p>`:""}
      <p class="small muted">Falsch zugeordnete Aussagen kommen in den nächsten Runden häufiger. Welche Kategorien du oft verwechselst, steht unter Statistik.</p>
      <div class="row">${sess?sessBtn():`${L.length?`<button class="btn" id="wAgain">Neue Runde</button>`:""}<button class="btn ghost" id="wOut">Fertig</button>`}</div></div>`;
    bindCrumb(backFn); if($("#wAgain")) $("#wAgain").onclick=()=>openWho(8,W.ch); if($("#wOut")) $("#wOut").onclick=backFn; return;
  }
  const {x,o}=L[W.i], S=WHO_SETS[x.set];
  $("#app").innerHTML=`${backTo(back)}
    <p class="eyebrow">Was gehört wohin? · ${W.i+1} von ${L.length}</p>
    <div class="block"><p class="wset">${S.q}</p><p class="who${x.t.length>110?" sm":""}">${S.quote?"„"+inl(x.t)+"“":inl(x.t)}</p>
      <div class="mc">${o.map(k=>{ const cls=W.a===null?"":(k===x.s?"r":(k===W.a?"w":"")); return `<button data-s="${k}" class="${cls}" ${W.a!==null?"disabled":""}>${S.opts[k]}</button>`; }).join("")}</div>
      ${W.a===null?"":W.a===x.s?`<div class="fb good"><p class="fh">Richtig.</p><p style="margin:0">${inl(x.ex)}</p></div>`
        :`<div class="fb bad"><p class="fh">Nicht ganz.</p><div class="dlist"><b>Richtig</b><span>${S.opts[x.s]}</span><b>Warum</b><span>${inl(x.ex)}</span>${S.why&&S.why[W.a]?`<b>${S.opts[W.a]}</b><span>${inl(S.why[W.a])}</span>`:""}</div></div>`}</div>
    ${W.a!==null?`<button class="btn" id="wNext">Weiter</button>`:S.tip?`<p class="small muted">Tipp: ${S.tip}</p>`:""}`;
  bindCrumb(backFn);
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ if(W.a!==null) return; W.a=b.dataset.s; const ok=W.a===x.s; if(ok) W.right++;
    const h=state.who[x.id]||{n:0,r:0}; h.n++; if(ok) h.r++; h.last=ok; if(!ok) h.conf=W.a; state.who[x.id]=h; logDay(); save(); renderWho(); });
  if($("#wNext")) $("#wNext").onclick=()=>{ W.i++; W.a=null; renderWho(); window.scrollTo(0,0); };
}

/* ================= Begriffe und Abkürzungen (nach dem Symbol-Training aus Wirtschaft II) =================
   Jeder Begriff einmal erklärt: Bedeutung, Mini-Beispiel, typische Verwechslung, Merkhilfe, Quelle.
   Daraus entstehen zwei Kartenstapel (Begriff → Bedeutung, Bedeutung → Begriff) und das Lexikon.
   Felder: id (bleibt fest, sonst geht der Lernstand verloren), s Begriff/Abkürzung, lang Langform, n Bedeutung kurz,
   bed, bsp, falle (typische Verwechslung), merk (Merkhilfe), q (Quelle). Gruppen je Veranstaltung (c) und Sitzung (ch). */
const TERM_GROUPS=[];
function termsReady(){ TERMS.length=0; TERM_GROUPS.forEach(g=>g.items.forEach(x=>TERMS.push(Object.assign({g:g.id, gt:g.t, c:g.c, ch:g.ch},x)))); buildTermCards(); }
const TERMS=[];
const termCourse=id=>{ const t=TERMS.find(x=>"b-"+x.id===id||"br-"+x.id===id); return t?t.c:null; };
function termBack(x){ return [x.lang?`Langform: ${x.lang}`:"", `Bedeutung: ${x.bed}`, `Beispiel: ${x.bsp}`, x.falle?`Verwechslung: ${x.falle}`:""].filter(Boolean).join("\n"); }
function termBackRev(x){ return [`**${x.s}**${x.lang?" ("+x.lang+")":""}`, `Beispiel: ${x.bsp}`, x.falle?`Verwechslung: ${x.falle}`:""].filter(Boolean).join("\n"); }
function buildTermCards(){
  CARDS.b=TERMS.map(x=>({id:"b-"+x.id, f:x.s, rich:termBack(x)}));
  CARDS.br=TERMS.map(x=>({id:"br-"+x.id, f:x.n, rich:termBackRev(x)}));
  TERMS.forEach(x=>{ CARD_CTX["b-"+x.id]="Begriff · "+x.gt+" · Was bedeutet das?"; CARD_CTX["br-"+x.id]="Begriff · "+x.gt+" · Wie heißt das?";
    const info=[x.merk?"Merkhilfe: "+x.merk:"", x.q?"Quelle: "+x.q:""].filter(Boolean).join("\n"); if(info) CARD_INFO["b-"+x.id]=CARD_INFO["br-"+x.id]=info; });
}
/* Lexikon: alle Begriffe der Veranstaltung nach Themen */
function lexiconHTML(){
  const G=TERM_GROUPS.filter(g=>g.c===state.course&&isReady(g.ch));
  if(!G.length) return `<div class="block"><p class="small muted" style="margin:0">Noch keine Begriffe.</p></div>`;
  return G.map(g=>`<div class="block"><h3>${g.t}</h3><div class="dlist lex">${g.items.map(x=>`<b class="sy">${inl(x.s)}</b><span>${inl(x.n)}${x.lang?`<span class="small muted">${inl(x.lang)}</span>`:""}<span class="small muted">${inl(x.bsp)}</span>${x.falle?`<span class="small lexwarn">${inl(x.falle)}</span>`:""}</span>`).join("")}</div></div>`).join("");
}
function renderTerms(){
  const st=n=>{ const A=allCards(n); return `${dueCards(n).length} fällig · ${A.filter(x=>!isSeen(x.id)).length} neu`; };
  $("#app").innerHTML=`${backTo("Üben")}<p class="eyebrow">${COURSES[state.course].short} · Grundlagen fürs Essay</p><h1>Begriffe und Abkürzungen</h1>
    <p class="muted">Die Fachbegriffe der Sitzungen mit Beispiel und typischer Verwechslung. Gewusste Karten kommen nach 1, 3, 7, 16 und 35 Tagen wieder, wie die anderen Karten.</p>
    <div class="block"><div class="modes">
      <button class="mode" id="tb1"><span class="t">Begriff → Bedeutung</span><span class="n">${st("b")}</span><span class="d">Vorne steht der Begriff, z. B. ZPES. Erklär ihn in einem Satz.</span></button>
      <button class="mode" id="tb2"><span class="t">Bedeutung → Begriff</span><span class="n">${st("br")}</span><span class="d">Vorne steht die Erklärung. Nenn den Fachbegriff, so wie er im Essay stehen sollte.</span></button>
    </div></div>
    <h2 style="margin-top:18px">Lexikon</h2>${lexiconHTML()}`;
  bindCrumb(()=>go("practice"));
  $("#tb1").onclick=()=>openCards("b"); $("#tb2").onclick=()=>openCards("br");
}

/* ================= Tägliche Einheit „Heute“ (aus Wirtschaft II) =================
   Mischt, was in der gewählten Veranstaltung heute dran ist: fällige Karten (oder neue), fällige Verständnisfragen,
   eine Übung im Prüfungsformat (Vorlesung: Gliederung in 10 Minuten), abwechselnd Zuordnen, Selbsttest oder Begriffe,
   dazu die nächste neue Lektion. Gemischtes Üben (Interleaving) und Abstände (Spacing) ohne eigene Planung. */
let sess=null;
const dayIndex=()=>Math.floor(dayStart()/864e5);
function freshChapter(){ for(const ch of courseChs()){ const L=LESSONS[ch.n]||[]; if(L.some(x=>lessonState(x.id)) && (CARDS[ch.n]||[]).some(x=>!isSeen(x.id))) return ch.n; } return 0; }
function planToday(){
  /* geübt wird nur, was schon gelesen wurde: begonnene Sitzungen (mindestens eine Lektion bearbeitet) */
  const started=courseChs().filter(ch=>(LESSONS[ch.n]||[]).some(x=>lessonState(x.id)));
  const half=started.some(ch=>{ const L=LESSONS[ch.n]; return L.filter(x=>lessonState(x.id)).length>=L.length/2 && essaysOf(ch.n).length; });
  const S=[], dc=dueCards(0).length, dq=qDue().length, nx=nextStep();
  const lesson=nx&&nx.lesson?{k:"lesson", t:"Neu lernen", d:nx.title, min:5, go:nx.go}:null;
  if(!dc&&!dq&&lesson) S.push(lesson);
  if(dc) S.push({k:"cards", t:"Karten wiederholen", d:`${Math.min(dc,20)} fällige Karten`, min:Math.max(2,Math.round(Math.min(dc,20)*.4))});
  else { const n=freshChapter(); if(n) S.push({k:"newcards", n, t:"Neue Karten", d:`5 neue Karten aus Sitzung ${chOf(n).no}`, min:3}); }
  if(dq) S.push({k:"recall", t:"Verständnisfragen", d:`${Math.min(dq,6)} fällige Fragen aus den Lektionen`, min:3});
  if(half) S.push({k:"outline", t:"Gliederung in 10 Minuten", d:"eine Prüfungsfrage gliedern, wie am Anfang des Essays", min:10});
  if(started.length){ const rot=["who","kreuz","terms"][dayIndex()%3];
    if(rot==="who"&&whoOf(0).length) S.push({k:"who", t:"Was gehört wohin?", d:"6 Aussagen zuordnen", min:3});
    else if(rot==="terms"&&allCards("b").length) S.push({k:"terms", t:"Begriffe", d:"8 Begriffe, gemischt in beide Richtungen", min:3});
    else if(kreuzOf(0).length) S.push({k:"kreuz", t:"Selbsttest", d:"Aussagen als wahr oder falsch erkennen", min:4}); }
  if(lesson&&!S.includes(lesson)) S.push(lesson);
  return S;
}
/* Begriffe für heute: erst fällige, dann neue, beide Richtungen gemischt */
function termsForToday(){ const A=allCards("b").concat(allCards("br")); const due=A.filter(x=>isDue(x.id)), fresh=A.filter(x=>!isSeen(x.id)); return shuffle(due).concat(shuffle(fresh)).slice(0,8); }
function startSession(){ sess={steps:planToday(), i:0, t0:Date.now()}; runStep(); }
function runStep(){
  if(!sess) return; const s=sess.steps[sess.i];
  if(!s){ return finishSession(); }
  ({cards:()=>openCards(0,false,dueCards(0).slice(0,20)),
    newcards:()=>openCards(s.n,false,allCards(s.n).filter(x=>!isSeen(x.id)).slice(0,5)),
    recall:()=>openRecall(qDue().slice(0,6)),
    outline:()=>openOutline(0),
    who:()=>openWho(6),
    terms:()=>openCards("b",false,termsForToday()),
    kreuz:()=>openKreuz(0),
    lesson:()=>s.go()})[s.k]();
  window.scrollTo(0,0);
}
function sessNext(){ if(!sess) return; sess.i++; runStep(); }
function endSession(){ sess=null; updateSessBar(); go("home"); }
function finishSession(){
  const min=Math.max(1,Math.round((Date.now()-sess.t0)/60000)); state.sessions[today()]=min; save();
  sess=null; updateSessBar(); view="sessdone"; renderNav();
  $("#app").innerHTML=`<p class="eyebrow">Heute</p><h1>Geschafft</h1><div class="block"><p>Deine Einheit ist fertig, etwa ${min} Minuten.</p>
    <p class="small muted">Morgen stellt die App eine neue Einheit zusammen. Was du heute nicht sicher wusstest, ist dann wieder dabei.</p>
    <div class="row"><button class="btn" id="sdHome">Zum Lernpfad</button></div></div>`;
  $("#sdHome").onclick=()=>go("home"); window.scrollTo(0,0);
}
function updateSessBar(){
  const b=$("#sessbar"); if(!b) return;
  if(!sess||!sess.steps[sess.i]){ b.hidden=true; b.innerHTML=""; return; }
  const s=sess.steps[sess.i];
  b.hidden=false;
  b.innerHTML=`<div class="sbin"><span class="sbt"><b>Heute ${sess.i+1}/${sess.steps.length}</b> · ${s.t}</span><button class="btn small" id="sbNext">${sess.i<sess.steps.length-1?"Nächster Schritt":"Abschließen"}</button><button class="btn ghost small" id="sbEnd" aria-label="Einheit beenden">✕</button></div>`;
  $("#sbNext").onclick=sessNext; $("#sbEnd").onclick=endSession;
}
const sessBtn=()=>`<button class="btn" id="sessGo">${sess&&sess.i<sess.steps.length-1?"Weiter zum nächsten Schritt":"Einheit abschließen"}</button>`;
document.addEventListener("click",e=>{ if(e.target.closest("#sessGo")) sessNext(); });
/* Block auf der Startseite */
function todayBlock(){
  const done=(state.sessions||{})[today()], S=planToday(), min=S.reduce((a,s)=>a+s.min,0);
  const plan=examPlanToday();
  if(sess) return `<div class="block today"><p class="eyebrow">Heute</p><h2>Einheit läuft</h2><p class="small muted" style="margin-top:0">Schritt ${sess.i+1} von ${sess.steps.length}: ${sess.steps[sess.i]?sess.steps[sess.i].t:""}</p><button class="btn" id="goSess">Fortsetzen</button></div>`;
  if(!S.length) return "";
  return `<div class="block today"><p class="eyebrow">Heute · etwa ${min} Minuten</p><h2>${done?"Für heute erledigt":"Deine Lerneinheit"}</h2>
    ${done?`<p class="small muted" style="margin-top:0">Du hast heute schon gelernt. Eine zweite Runde schadet nicht, morgen geht es mit neuen Abständen weiter.</p>`:""}
    <ol class="plan">${S.map(s=>`<li><b>${s.t}</b><span>${inl(s.d)}</span></li>`).join("")}</ol>
    ${plan?`<p class="small" style="margin:0 0 10px"><b>Probe-Essay:</b> ${plan}</p>`:""}
    <button class="btn" id="goSess">${done?"Noch eine Runde":"Starten"}</button></div>`;
}

/* ================= Prüfungstermin, Plan für Probeprüfungen und Schwachstellen (aus Wirtschaft II) =================
   Termin je Veranstaltung in state.examDates (vl/se). Ohne Eintrag gilt der Termin aus den Unterlagen (nur angezeigt,
   nicht gespeichert): Vorlesung 04.02.2027 laut Folie „Modulprüfung“. */
const EXAM_DEFAULT={vl:"2027-02-04"};
const fmtDate=t=>{ const d=new Date(t); return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()]+" "+d.getDate()+"."+(d.getMonth()+1)+"."; };
const examDateStr=()=>(state.examDates||{})[state.course]||EXAM_DEFAULT[state.course]||null;
const examDateTs=()=>{ const s=examDateStr(); if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d).getTime(); };
const probeName=()=>state.course==="vl"?"Probe-Essay":"Probeklausur";
/* Plan: eine Probeprüfung früh als Standortbestimmung, dann 21, 14 und 7 Tage vor dem Termin */
function examPlan(){
  const T=examDateTs(), ex=(state.exams||[]).filter(e=>(e.c||"vl")===state.course).map(e=>e.t).sort((a,b)=>a-b);
  const P=[{lab:"Standortbestimmung", when:null}];
  if(T) [21,14,7].forEach(d=>P.push({lab:`${d} Tage vorher`, when:T-d*864e5}));
  const used=new Set();
  P.forEach(p=>{ const i=ex.findIndex((t,k)=>!used.has(k)&&(p.when==null||t>=p.when-3*864e5)); if(i>=0){ used.add(i); p.done=ex[i]; } });
  return P;
}
function examPlanToday(){
  if(!essaysOf(0).length) return "";
  const P=examPlan(), now=Date.now(), open=P.find(p=>!p.done);
  if(!open) return "";
  if(open.when==null) return "Schreib bald einen als Standortbestimmung (unter Üben). Er zeigt, wo du stehst.";
  if(open.when-now<=864e5) return `Laut Plan ist jetzt der nächste dran (${open.lab}).`;
  return "";
}
function examPlanBlock(){
  const T=examDateTs(), P=examPlan(), days=T?Math.ceil((T-dayStart())/864e5):null, own=!!(state.examDates||{})[state.course];
  return `<div class="block"><h2>Prüfung und ${probeName()}s</h2>
    <div class="row" style="margin-bottom:8px"><label class="small" for="exD">Prüfungstermin ${COURSES[state.course].short}</label><input type="date" id="exD" value="${examDateStr()||""}" class="dateinp"><button class="btn ghost small" id="exS">Speichern</button></div>
    ${T?`<p class="small" style="margin:0 0 6px">${days>0?`Noch <b>${days} Tage</b> bis zur Prüfung.`:days===0?"<b>Heute ist Prüfung.</b> Viel Erfolg!":"Der Termin liegt in der Vergangenheit."}${!own&&EXAM_DEFAULT[state.course]?" Termin aus der Folie „Modulprüfung“.":""}</p>`:`<p class="small muted" style="margin:0 0 6px">Trag den Termin ein, sobald er feststeht. Dann plant die App drei ${probeName()}s in den letzten Wochen.</p>`}
    <div class="klist">${P.map(p=>`<b>${p.done?"✓ ":""}${p.lab}</b><span>${p.done?`geschrieben am ${fmtDate(p.done)}`:p.when?fmtDate(p.when):"so bald wie möglich"}</span>`).join("")}</div>
    ${essaysOf(0).length?`<button class="btn ghost small" id="exGo">${probeName()} starten</button>`:""}</div>`;
}
function bindExamPlan(){
  if($("#exS")) $("#exS").onclick=()=>{ const v=$("#exD").value; if(v) state.examDates[state.course]=v; else delete state.examDates[state.course]; save(); toast(v?"Termin gespeichert":"Termin entfernt"); render(); };
  if($("#exGo")) $("#exGo").onclick=()=>go("exam");
}

/* Schwachstellen aus allen Übungsformen der gewählten Veranstaltung */
function weakData(){
  const cardsAll=allCards(0), byId=Object.fromEntries(cardsAll.map(c=>[c.id,c]));
  const weakCards=Object.entries(state.lapses||{}).filter(([id,n])=>n>=2&&byId[id]).sort((a,b)=>b[1]-a[1]).map(([id])=>byId[id]);
  const qs=allQuestions(), qById=Object.fromEntries(qs.map(q=>[q.id,q]));
  const weakQ=Object.entries(state.qlapses||{}).filter(([id,n])=>n>=1&&qById[id]&&(qInfo(id)||{}).b<=2).sort((a,b)=>b[1]-a[1]).map(([id])=>qById[id]);
  const conf={}, confItems={};
  whoOf(0).forEach(x=>{ const h=(state.who||{})[x.id]; if(h&&h.conf&&!h.last){ const S=WHO_SETS[x.set], k=S.opts[x.s]+" ↔ "+S.opts[h.conf]; conf[k]=(conf[k]||0)+1; (confItems[k]=confItems[k]||[]).push(x); } });
  const confL=Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const weakE=essaysOf(0).filter(x=>{ const s=essayScore(x.id); return s&&s.p<s.max*.6; });
  const weakO=essaysOf(0).filter(x=>{ const s=(state.outl||{})[x.id]; return s&&s.p<s.max*.6; });
  return {weakCards,weakQ,confL,confItems,weakE,weakO};
}
function weakBlock(){
  const {weakCards,weakQ,confL,weakE,weakO}=weakData();
  const none=!weakCards.length&&!weakQ.length&&!confL.length&&!weakE.length&&!weakO.length;
  return `<div class="block"><h2>Deine Schwachstellen</h2>${none?`<p class="small muted" style="margin:0">Noch nichts Auffälliges. Die Übersicht füllt sich, sobald du übst: Karten, die du mehrmals nicht wusstest, falsche Verständnisfragen, verwechselte Zuordnungen und schwache Gliederungen oder Essays.</p>`:""}

    ${weakQ.length?`<h3 style="margin-top:14px">Verständnisfragen mit Fehlern</h3><ul class="weak">${weakQ.slice(0,5).map(q=>`<li>${inl(q.c.q)}</li>`).join("")}</ul><button class="btn ghost small" id="wkQ">Diese Fragen üben</button>`:""}
